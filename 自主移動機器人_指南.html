<script>const DATA={"project":"室內自主配送車","pages":[{"id":"01","slug":"goal-system","name":"任務與機器人系統","en":"TASK · HARDWARE · ROS 2","question":"想做一台能自行送貨的小車，軟硬體需要如何分工？","lead":"先畫定運作環境，再讓感測、定位、導航和控制模組相互交換資料。後面每一項技術都要能放回這張系統圖。","focus":"系統架構","figs":["robot","ros","stack"],"sections":[["任務決定機器配置","先以平坦室內走道配送為例：相機或LiDAR負責觀測、輪速與IMU提供移動線索、電腦負責推算位置與選路、驅動板控制馬達。戶外道路或機械手臂會需要不同規格與機構。","先定義目標、速度、通行寬度及停車條件，再選技術。"],["感知 → 定位 → 規劃 → 控制","相機與LiDAR提供「周圍有什麼」；定位估算「自己在哪裡」；規劃選擇路線；控制器把路線轉成輪速與轉向。每次收到新觀測就更新判斷。","這是反覆運作的閉環，不是一條只執行一次的流程。"],["ROS2把功能連成系統","ROS2是機器人軟體通訊框架。每個節點負責一項工作；Topic持續傳送感測與狀態資料；Action管理需要時間的導航目標。tf2讓所有節點能理解不同座標系的位置關係。","ROS2本身不是自動駕駛演算法，而是讓演算法合作的基礎。"],["導航工具的角色","Nav2整合移動機器人的導航功能；Autoware以道路車輛自動駕駛功能為主；兩者可運用ROS2，但不是同一用途。選哪個取決於底盤與使用場景。","室內差速輪車通常先考慮Nav2；小型前輪轉向自駕車可研究Autoware架構。"],["資料更新要及時","感測、運算、傳輸和馬達回應都會花時間。若環境變化比系統更新還快，規劃再準也可能太晚。","設計時要留意更新頻率、資料時間戳與安全停止能力。"],["需求與驗收要在動工前配對","例如「遇到障礙要停止」是需求；檢查雷射是否更新、控制板是否能煞停，是核實；在指定走道反覆避障，是確認系統真的符合用途。","把每一項能力配上一個測試，別等整車組好才想怎麼判定成功。"]],"callout":"從這一頁開始，把每個新技術都放回同一個位置：輸入是什麼、輸出給誰、發生錯誤會影響哪個環節。","gloss":["ros2","node","ros_topic","ros_action","tf2","nav2","autoware","bms","ros2_control","urdf","vv","vmodel"],"origin":[1,4,5,7,8,9],"official":["ros2","autoware","nav2","tf2","ros2humble","ros2control","iso34502"],"build":{"mode":"基本路線","done":"零件與連線圖確定；機器人有實體停止方式。","parts":"雙輪差速底盤、2顆帶編碼器減速馬達、驅動板、電池／保護板、保險絲、實體急停鈕、2D LiDAR、IMU、車載小型Linux電腦、微控制器（如ESP32）。","tools":"Windows11＋WSL Ubuntu22.04／ROS2 Humble（開發）；車載Ubuntu＋ROS2（執行）。","steps":["選室內平地、低速、固定起終點；記下通道寬度、車體大小，以及「能導航、能停車」的驗收條件。","決定差速兩輪配置，畫感測器／電腦／控制板／馬達的接線與通訊圖。","核對各裝置供電電壓、馬達最大電流與總重量，預留實體斷馬達電源的急停。"],"watch":"車載電腦與馬達供電要妥善隔離／穩壓；電池使用合格保護與充電方案。","fail":"馬達啟動時電腦重開機：先查供電壓降及驅動器額定電流。","note":"這是一台低速、室內差速輪車；若做前輪轉向自駕車，底盤與控制方式需另換。"},"type":"core","applied":{"lecture":"Lecture9","title":"先寫三條可驗收的機器人需求","grade":"基本路線","steps":["寫出任務：從A點到B點、遇障礙停止、失去通訊停止。","為每項任務指定可觀察結果，例如是否到站、是否碰撞、指令逾時是否停車。","日後每次改裝或更新軟體，都重新檢查相同條件。"],"check":"完成一張「需求→測試→通過條件」對照表。","caution":"安全需求優先；速度、停止距離需要根據實際車重、速度和地面測試訂定。"}},{"id":"02","slug":"motion-control","name":"車輛運動、軌跡與控制","en":"KINEMATICS · TRAJECTORY · MPC","question":"電腦算出路線後，為什麼車子不能直接沿線瞬間轉90度？","lead":"幾何路線不包含速度和轉向機構。真正控制機器人時，要遵守底盤運動方式、最大轉向角、加速度與煞車距離等限制。","focus":"運動／控制","figs":["bicycle","trajectory","latency","stack"],"sections":[["路徑不等於可執行軌跡","路徑是一連串空間點；軌跡還規定各時刻的位置、速度、加速度與方向。兩台車即使走相同路線，通過路口的時間不同，也會有不同碰撞風險。","軌跡是一條帶時間的運動計畫。"],["差速輪車和前輪轉向車不同","差速驅動靠左右輪速差轉彎，可在一定條件下原地旋轉。一般前輪轉向車無法原地旋轉，轉向有最小半徑；要先認清底盤形式。","不要把車輛單車模型直接套用到差速輪車。"],["單車模型描述轉向限制","對低速、忽略輪胎側滑的前輪轉向車，可以用單車模型簡化。軸距L、前輪轉向角δ決定轉彎半徑R=L/tan(δ)；轉向角有限，彎道就不可能任意小。","這是幾何近似；高速與打滑時須考慮更完整動力學。"],["非完整約束限制瞬時方向","車輪一般只能沿滾動方向前進，不能像游標直接橫向平移。這種方向上的速度限制稱非完整約束，因此規劃時不能只看障礙物是否擋路。","平行停車靠多次前進、轉彎與倒退取得側向位移。"],["軌跡最佳化處理多個條件","軌跡最佳化把碰撞距離、速度、加速度、Jerk、轉向與時間要求放在一起找可行解。MPC每隔一段時間重新預測未來並更新控制指令。","安全約束必須獨立檢查；最佳化結果不等於安全保證。"],["動態障礙要持續重規劃","行人可能突然穿越原路線。局部規劃與控制須反覆使用新觀測修正動作，必要時減速停止；不能只執行開始時算好的一條曲線。","這裡再次回到感知－規劃－行動閉環。"]],"callout":"完整導航包含幾何路線、符合底盤的運動軌跡與持續回饋控制。這三層應分開理解。","gloss":["diffdrive","bicycle","nonholonomic","trajopt","mpc","jerk","ros2_control","encoder","motor_driver"],"origin":[4,7,8],"official":["nav2","autoware","moveit","ros2control"],"build":{"mode":"基本路線","done":"能安全手動前進、後退、轉彎；輪速回饋正常。","parts":"底盤、馬達與編碼器、匹配額定電流的馬達驅動板、微控制器（如ESP32）、急停鈕。","tools":"ROS2、ros2_control／diff_drive_controller或自寫底盤驅動、RViz2、序列埠工具。","steps":["固定車輪與馬達，先架空車輪檢查轉向與驅動板接線。","讓微控制器接收速度指令、回報左右輪編碼器資料，建立車身里程計。","用ROS2速度指令低速控制直走與轉彎，確認停止與指令逾時自動停車。"],"watch":"先限速、架空測試再落地；急停應在軟體失效時仍能切斷馬達驅動。","fail":"直走偏航或轉圈：查左右輪方向、編碼器正負、輪半徑與輪距。","note":"這個階段先讓車可控，後續再加上平滑軌跡與自動導航。"},"type":"core"},{"id":"03","slug":"sensors-geometry","name":"感測器、座標與相機投影","en":"SENSING · FRAMES · PROJECTION","question":"相機和光達看到的物體，怎麼變成機器人能使用的空間位置？","lead":"感測器各用不同方式觀察世界；要融合資料，必須先知道它們何時量測、裝在哪裡，以及如何把資料轉進同一個座標系。","focus":"感測／幾何基礎","figs":["sensor","frames","pinhole","fusion"],"sections":[["相機、LiDAR與IMU互相補足","相機適合讀取顏色與紋理；LiDAR用光線回波估計距離並形成點雲；IMU量測加速度和角速度。玻璃、雨滴、反光與光線不足會讓某些量測不可靠。 部分LiDAR利用飛行時間（ToF）測距。","不要把任何一種感測器當成完美真值。"],["先分清位置和位姿","位姿包含位置與朝向。相機、車身、地圖各有自己的座標系；同一個點在相機座標裡可能是(1,0,2)，換到車身座標後數字會改變，但物體沒移動。","座標變換用旋轉R和平移t；多段轉換可用齊次變換矩陣串接。"],["針孔相機把3D投到2D","針孔相機模型把三維點(X,Y,Z)經相機投影到像素(u,v)。焦距、主點等相機內參控制投影比例；相機相對世界的位置與角度則由外參描述。簡化公式：u=fx·X/Z+cx，v=fy·Y/Z+cy。","一個像素對應空間中的一條射線，沒有深度就不能唯一得到三維距離。"],["有了深度就能反投影","RGB-D相機能提供彩色圖與深度圖。用相機內參和深度Z，可將像素反投影為三維點：X=(u−cx)Z/fx、Y=(v−cy)Z/fy。很多像素合起來形成點雲。","深度空洞與離群點需要檢查，不是每一個像素都有可靠深度。"],["校正後才能真正融合","相機和LiDAR的安裝位置不同，要先做內參與相機外參校正；接著進行感測器融合：把LiDAR點轉入相機座標系並投影到畫面，才能正確疊合距離與顏色。OpenCV提供相機校正等電腦視覺工具。","更換支架或撞到感測器，原本的校正可能不再準確。"]],"callout":"這一頁的核心是「資料坐標一致」。沒有正確座標與時間對齊，後面的建圖、定位和導航都會受到影響。","gloss":["lidar","tof","pointcloud","imu","frame","pose","transform","pinhole","intrinsics","extrinsics","rgbd","unprojection","calibration","fusion","opencv","urdf","encoder"],"origin":[4,5,6,8],"official":["opencv","tf2","sllidar"],"build":{"mode":"基本路線","done":"RViz2能看到雷射掃描、IMU、輪速里程計，座標方向一致。","parts":"2D LiDAR（如支援ROS2的RPLIDAR系列）、IMU、輪編碼器；相機先選配。","tools":"LiDAR ROS2驅動、RViz2、tf2、robot_state_publisher、URDF（車體模型）。","steps":["固定LiDAR水平、避免車身擋住掃描；接上驅動並確認雷射資料有更新。","建立base_link、laser、odom等座標關係，填入感測器相對車體的位置。","在RViz2檢查掃描方向和障礙物是否對得上現場。"],"watch":"USB電力、固定方式、時間戳與座標軸會直接影響建圖；2D雷射不保證能看到懸空障礙。","fail":"牆壁在畫面反向／轉動時飄移：先檢查tf2座標及時間同步。","note":"相機投影、內外參在本章保留；基本2D導航可先不用相機。"},"type":"core"},{"id":"04","slug":"slam-localization","name":"SLAM、點雲對齊與定位","en":"ODOMETRY · ICP · LOOP CLOSURE","question":"機器人移動時，怎麼一邊知道自己在哪裡、一邊累積一張能重複使用的地圖？","lead":"每一幀只看到局部環境。機器人需要估算自己如何移動、把不同觀測對齊；回到舊地點時，還要修正先前累積的定位誤差。","focus":"定位／建圖","figs":["mapping","icp","slamloop","frames"],"sections":[["定位與建圖互相依賴","SLAM同時估計機器人的位姿和環境地圖。移動時先用輪速、IMU或視覺里程計預測位移，再利用新感測資料更新位置與局部地圖。","SLAM不是單純把相片拼起來，而是估算「在哪裡看到什麼」。"],["ICP如何對齊兩張點雲","ICP先找兩組點雲的可能對應點，再計算最能縮小距離差的旋轉與平移；反覆執行直到變化變小或達到限制。常需先有合理初始位姿。","大量重複牆面、移動人群與錯誤初始值，可能造成錯誤對齊。"],["累積里程會逐漸漂移","每一小步估計都帶誤差，走久後機器人以為自己在A點，實際卻偏到B點。這就是漂移；只做相鄰兩幀對齊並不能保證全局地圖一致。","定位誤差會直接影響路徑安全邊界。"],["閉環偵測修正整段地圖","當機器人再次看到熟悉位置，閉環偵測把新觀測和舊地標連起來，後端最佳化再調整整條軌跡及地圖，讓首尾一致。","閉環匹配也可能認錯相似場景，必須驗證約束品質。"],["地圖通常有不同層次","視覺SLAM可建立特徵點地圖；LiDAR SLAM常處理幾何點雲；移動車導航則可能再轉成佔用柵格地圖。每種地圖適合回答的問題不同。","持久地圖用於重定位；即時障礙資訊仍要持續更新。"]],"callout":"SLAM的價值是提供可重複使用的空間參考；但若地圖過時或定位失準，必須讓導航知道自己已經不確定。","gloss":["slam","odometry","visualodo","imu","icp","drift","loopclosure","pointcloud","pose","occupancy","slam_toolbox","amcl"],"origin":[5,6],"official":["tf2","colmap","amcl"],"build":{"mode":"基本路線","done":"建立並儲存室內2D地圖；重啟後能在地圖上定位。","parts":"已裝好的2D LiDAR、輪編碼器、IMU、可穩定行駛的底盤。","tools":"slam_toolbox、RViz2、robot_localization（選配融合）、Nav2 AMCL（已有地圖定位）。","steps":["先確認/scan、/odom與tf2的座標鏈，再以低速手動行走掃描空間。","用slam_toolbox建圖，盡量經過迴圈路線；儲存地圖。","切換定位模式，在已知地圖上指定初始位置並檢查姿態是否穩定。"],"watch":"里程計品質不好會讓地圖扭曲；玻璃、反光與人流會造成不穩定量測。","fail":"地圖重疊／機器人跳位：先查輪距標定、odom→base_link、scan時間戳。","note":"ICP、閉環偵測與漂移修正是SLAM背後的原理，不需每項都自己重寫。"},"type":"core"},{"id":"05","slug":"map-route","name":"可通行地圖與路徑規劃","en":"C-SPACE · A* · PRM · RRT","question":"機器人已知道自己在哪裡，接著要怎麼找出一條不撞到障礙物的路？","lead":"把感測結果變成可走與不可走的區域，再依機器人尺寸、目標和路徑成本選路。不同搜尋方法適合不同大小與自由度的問題。","focus":"地圖／規劃","figs":["occupancy","astar","sampling","planning"],"sections":[["佔用柵格不是普通地圖","佔用柵格地圖把地面切成很多格，記錄障礙、空間或未知區域。格子太粗會失去窄門細節；太細則占用更多記憶體和計算時間。","地圖未知不等於已經確認可通行。"],["C-Space把機器人尺寸算進去","如果只讓機器人中心點避開牆，車身邊緣仍可能撞到門框。構型空間（C-Space）把車的尺寸與朝向納入狀態；對簡化圓形車可在地圖做障礙物膨脹。","障礙物膨脹是幾何近似，複雜外形仍要正確碰撞檢查。"],["A*與BFS適合格子或圖","BFS逐層擴張，在邊權相同時找到最少步數路徑。A*把已走成本和剩餘距離的估計加在一起，優先探索較有希望的路，常用於網格路線搜尋。","路線搜尋只確定怎麼繞過障礙，未必考慮能否順利轉彎。"],["PRM先建路網再查路","PRM在可通行的構型中抽樣，建立無碰撞連線；不同起終點可在同一張路網查詢。狹窄通道若抽不到點，明明有路也可能找不到。","PRM適合多次查詢的空間；採樣數量與方式影響效果。"],["RRT從起點長出探索樹","RRT每次隨機選一個方向，從樹上最接近的點往外伸一小步，確認無碰撞就加入。RRT*進一步重新連接節點以改善路徑代價。","RRT首先求可行；RRT*的漸近最佳有條件，結果也不一定平滑。"],["自由度多時不能暴力格子化","平面位置只要兩個變數；多關節手臂需要很多關節角度。這些獨立變數數量稱為自由度（DoF）。如果每個維度都細分成格子，狀態數量會快速增加，因此常改用採樣規劃。","不是所有機器人都該用同一個規劃器。"],["看不清楚時先確認再移動","遇到門邊盲區、異常障礙物或不確定的空間，先停止，再以受控角度改變觀察位置、更新地圖，必要時改道或請人處理。這是把主動感知概念用在移動導航的延伸建議。","不要靠強行前進來探測未知障礙；第一次驗證先在模擬或低速受控環境中進行。"]],"callout":"路徑只回答「從哪裡走到哪裡」；要讓輪式車真的跟上路線，還需要下一章的運動學、速度和控制。","gloss":["occupancy","cspace","inflation","dof","astar","bfs","prm","rrt","rrtstar","costmap","activeperception"],"origin":[7,8,11],"official":["nav2","moveit","nav2setup"],"build":{"mode":"基本路線","done":"在RViz2點選目標，車能繞障礙到達並停下。","parts":"前述完整底盤與感測器；本階段通常不用新增主要零件。","tools":"Nav2、地圖伺服器、Costmap、路徑規劃器、控制器、RViz2。","steps":["載入已存地圖與定位結果，設定車身外形（footprint）及安全膨脹距離。","配置Nav2導航、路徑規劃與局部避障，先在空曠區域選短距離目標。","逐步增加走廊轉彎與靜態障礙，觀察規劃路線與實際車輪反應。"],"watch":"路徑能穿過不代表車身能穿過；安全距離必須算進車體尺寸。 轉角與門口若感測不足，先停車取得更多資訊，不要盲目通過。","fail":"原地打轉／卡在門口：查定位、footprint、Costmap、最小轉彎能力。","note":"A*、PRM與RRT是不同規劃方法；室內差速輪車先以Nav2現成規劃器為主。"},"type":"core"},{"id":"06","slug":"deployment-safety","name":"真實部署、ODD與安全","en":"ODD · FAILURE · SAFE FALLBACK","question":"機器人可以完成任務，怎麼確認它在真實環境出問題時仍不造成危險？","lead":"展示影片只證明某些情況下能工作。真實部署還要界定使用條件、監控定位與感測品質、管理風險並準備無法繼續時的安全行為。","focus":"部署／安全","figs":["odd","safety","risk","scenario"],"sections":[["ODD定義可運作的條件","ODD原本是自動駕駛領域的運作設計範圍：包括道路種類、天氣、照明、速度等預期條件。借用這種思路，可把室內車限定為平坦走道、指定區域與合理人流。","ODD是設計限制，不代表列入範圍就自動安全。"],["外界變了，模型也可能失準","雨水、鏡頭污損、照明突變或感測器支架鬆動，會讓部署資料不同於訓練資料，造成分布偏移。少見但危險的情況尤其需要另外處理。","應監控輸入品質與定位不確定性。"],["安全監控應與正常任務並行","除了「去目的地」的任務流程，還要有監控定位品質、障礙距離、速度、通訊與硬體狀態的安全流程。偵測到異常後可以減速、停止或切換備援方式。","不能把每個異常都交給同一個不確定的學習模型處理。"],["無法繼續時要有退回策略","最小風險動作（MRM）是自駕車概念，例如視情況減速並到達較安全的停止狀態；對室內機器人則需根據周圍人員、地形與機構設計停止或求助方式。","安全退回策略必須依實際場景與機器人能力設計。"],["風險不是平均成功率","HARA在車用功能安全中分析危害情境，評估嚴重度、暴露情境及可控性；ISO 26262是道路車輛功能安全標準，不能直接當成所有家用或室內機器人的認證。","成功率相同的兩種故障，對人的傷害風險可能完全不同。"],["部署後還要持續評估","記錄與分類失效、判斷根因、改善感測或規劃策略，再用一致的場景確認修正效果。系統生命週期不會在第一次成功展示後結束。","評估是持續的工程流程。"],["Verification與Validation各查什麼","Verification（核實）看實作是否符合技術規格，例如逾時必須停止；Validation（確認用途）看小車在預定走道裡是否真的安全送達。測試提供證據。","先把需求寫清楚，再一項項驗收。"],["把模糊情況變成可重複測試","功能情境：走道出現障礙；邏輯情境：改變車速、距離與障礙位置；具體情境：固定某次速度與障礙距離，連續重測。每次註明通過、失敗或測例設定無效。","場景選擇要包含一般狀況，也要包含感測停更、狹窄通道等較難情境。"],["安全指標不是萬用數字","TTC用距離與接近速度估計可能碰撞的剩餘時間，但只在簡化運動假設下合理；PET適合分析交會區的時間差。室內入門車優先量「有沒有碰撞、停止距離、反應時間」，不需要先做完整汽車安全分析。","沒有單一成功率能證明所有場景安全；ISO 34502與SOTIF屬道路車輛標準，教材只借用方法。"]],"callout":"真實可靠性取決於明確的使用邊界、可監控的失效與可執行的安全狀態。","gloss":["odd","shift","mrm","hara","iso26262","rosbag2","vv","vmodel","scenarios","ttc","pet","sotif"],"origin":[1,4,5,7,8,9],"official":["odd","iso26262","iso34502","iso21448","rosbag2docs"],"build":{"mode":"基本路線 · 必做驗收","done":"小車在指定情境可重複導航；異常時安全停止，測試留有證據。","parts":"實體急停、保險絲／電源保護、電池監測；必要時加近距離防撞感測器。","tools":"ROS2日誌、rosbag2、Nav2恢復／停止功能、情境測試表；可先在Gazebo模擬，再到安全受控空間低速測。","steps":["列出實際使用條件與驗收規格：走道寬度、速度、障礙類型、感測中斷時的停止行為。","依「功能情境→參數範圍→固定測例」設計測試；先模擬，再用泡棉障礙物做低速受控測試。","記錄每次通過／失敗／測例無效與rosbag2資料；修正後重跑同一組場景。"],"watch":"急停必須能獨立切斷馬達動力；初次測試需有人監督，禁止拿真人或動物當首次碰撞目標。","fail":"測試偶爾失敗：先核對速度、感測時間戳、障礙擺放與停止規則是否一致。","note":"ODD用來界定「哪些條件下才准運作」；ISO26262屬汽車功能安全脈絡，不直接等同小車合規。"},"type":"core","applied":{"lecture":"Lecture9","title":"替小車建立3種必測情境","grade":"基本路線必做","steps":["正常：空走道從A點到B點，記錄是否到站。","障礙：先在模擬器，之後用泡棉物件放在路徑上，檢查減速／停止／改道。","異常：拔除感測資料或在控制端模擬逾時，確認馬達進入安全停止。"],"check":"每項都記錄環境、車速、結果、停止距離與資料檔；修正後能重測。","caution":"勿用實際行人做首次撞擊驗證；安全停止要能在ROS2故障時仍然作用。"}},{"id":"07","slug":"depth-reconstruction","name":"影像深度與3D重建","en":"STEREO · SfM · LEARNED DEPTH","question":"普通照片只有平面影像，為什麼有些技術能從照片估計距離或重建3D？","lead":"深度可以靠感測器直接量、靠兩個視角的幾何算，或讓模型從影像特徵學習估計。三者的資料需求與誤差來源不相同。","focus":"3D感知","figs":["stereo","geometry","depthlearn","reconstruct"],"sections":[["立體視覺利用視差估距","兩台已校正的相機從不同位置看同一點，這個點在左右影像的位置會不同。已知基線B、焦距f和視差d，在校正後的簡化模型中，深度Z=fB/d。遠方視差小，深度誤差容易放大。","雙目測距首先要找到左右照片中「同一個點」。"],["對極幾何縮小搜尋範圍","如果已知兩相機的相對位置，一個影像點在另一張圖中的對應點會落在特定對極線上。這讓演算法不用掃整張影像，但遮蔽、反光與無紋理表面仍很難匹配。","對應點找錯，三角測量會得到錯誤的空間位置。"],["SfM把多張照片變成3D","SfM先用SIFT等特徵匹配多張照片，估計相機相對位置，再經三角測量得到稀疏3D點。BA共同修正相機和點的位置。COLMAP可完成這類影像重建流程。","單目SfM通常只知道相對比例；沒有外部尺度資訊，不能保證直接得到公尺。"],["單張照片的深度是「推測」","單目影像無法純靠投影幾何唯一求出距離。學習型深度估計用大量資料學會哪些外觀通常近、哪些通常遠；輸出可能是相對深度，也可能經過專門訓練提供度量深度。","要先確認模型輸出單位與尺度，不可把色彩深度圖直接當測距儀。"],["連續影片也可以用來學深度","自監督視圖合成會同時預測深度與相機移動，用前後幀彼此合成並比較差異，當作學習訊號。若畫面有移動的人、強反光或光照突變，這種假設就可能被破壞。","平均深度誤差小，不代表近處細障礙物一定辨識得好。"],["重建表示法有不同用途","點雲偏向幾何量測；網格描述表面；NeRF與3D Gaussian Splatting偏向從照片合成新視角。畫面看起來逼真，不代表碰撞幾何和物理接觸也準確。","導航用途要關心可通行距離；視覺展示則更重視外觀品質。"]],"callout":"立體視覺與SfM利用幾何約束；學習型深度依賴資料與模型假設。需要公尺距離時，要特別檢查尺度來源。","gloss":["stereo","baseline","disparity","epipolar","triangulation","sfm","sift","colmap","ba","depthnet","selfsupervised","nerf","gs"],"origin":[5,6,7],"official":["colmap","opencv","nerf","gs"],"build":{"mode":"進階選配","done":"需要辨識桌腳高度或3D物體時，再產出深度圖／點雲。","parts":"RGB-D或雙目相機；若只做平面導航，先不必購買。","tools":"OpenCV、RViz2；多視角重建可用COLMAP（視需求）。","steps":["先確定2D LiDAR無法處理的視覺需求，再選RGB-D或雙目。","做相機校正，觀察深度圖並把有效深度轉成3D點。","將點雲放到車體座標系，檢查桌腳、地面與物體邊緣。"],"watch":"透明、反光、低紋理與過近距離會使深度不可靠。","fail":"點雲有洞／距離跳動：檢查可用測距範圍、鏡頭校準與環境材質。","note":"SfM與COLMAP是多張影像3D重建工具；它們不是基本導航的必需套件。"},"type":"extra"},{"id":"08","slug":"simulation-data","name":"模擬、3D場景與生成資料","en":"MUJOCO · ISAAC SIM · WORLD MODELS","question":"沒辦法一直讓實體機器人碰撞和重做任務，怎麼在虛擬世界累積經驗？","lead":"把機器人與環境放進物理模擬器，改變物體、位置與外力，產生更多條件下的運動經驗。也可以利用真實影像重建場景或學習世界模型。","focus":"模擬／資料生成","figs":["sim","generator","reconstruct","nvidia-stack"],"sections":[["MuJoCo與Isaac Sim各做什麼","MuJoCo主要用來計算機器人接觸、關節與動力學，適合操作控制和學習研究。Isaac Sim可建立具視覺、感測器與物理效果的虛擬場景，並整合ROS2。","模擬場景與控制介面仍要依目標選擇。"],["程序化生成多種情境","用規則或語言模型產生任務腳本，改變光線、物體位置、外觀與障礙配置，再讓模擬器重複執行，收集不同失敗情境。","產生更多情境不代表它們都符合真實物理。"],["照片重建與模擬不是同一件事","NeRF與3D Gaussian Splatting可根據多張照片生成逼真的新視角；但外觀看似完整不代表有正確物理碰撞網格、質量與摩擦力。","要做碰撞或導航仍須建立可用的幾何與物理參數。"],["世界模型嘗試預測下一步","世界模型學習「目前觀測＋動作→下一個觀測或狀態」的關係，讓系統可以在模型內預測結果。預測若偏離實體物理，後續決策也可能跟著錯。","世界模型不是保證符合物理定律的模擬器。"],["模擬轉真實必須處理落差","模擬器可能低估感測雜訊、接觸變化與光影差異。真實部署前仍需要驗證，再把真實失敗回傳資料飛輪。 這些差異統稱模擬到真實落差。","虛擬世界成功，不等於真實環境已達安全條件。"],["Isaac家族有不同用途","Isaac Sim負責3D場景、感測器與物理模擬；Isaac Lab主要做機器人學習與並行訓練；Isaac ROS提供GPU加速的ROS2感知模組。三者不能互相當成替代品。","室內導航入門先完成ROS2與一般模擬；需要再加GPU工具。"],["從模擬把資料送到ROS2","透過ROS2 Bridge，模擬車可以發布雷射、里程計與座標，接收輪速命令。先確認座標系、時間與資料頻率，再驗證同一套導航程式。","模擬成功不代表實車已安全：需要核對摩擦、控制延遲與停止距離。"],["Agentic AI只做可檢查的開發輔助","AI代理可協助建立檔案、整理錯誤、產生測試摘要，但驅動程式安裝、CUDA調整、電源控制或安全設定都應人工確認，並保留可回復版本。","不要授權未知腳本自動取得管理權限或控制真實車輛。"]],"callout":"模擬是降低試錯成本的方法，不是省略現實評估的理由。","gloss":["mujoco","isaac","procedural","nerf","gs","worldmodel","sim2real","gazebo","isaaclab","isaacros","openusd","rosbridge","agentic"],"origin":[3,4,5,7,10],"official":["mujoco","isaac","nerf","gs","isaacwsl","isaac6spec","isaac6bridge","isaacros32","isaaclabdocs"],"build":{"mode":"進階選配","done":"在不接實體馬達的情況下觀察導航或碰撞案例。","parts":"不需要新零件；沿用已畫好的車體尺寸與感測器位置。","tools":"先選與現有ROS2 Humble相容的Gazebo版本；Isaac Sim是高資源選配；Isaac Lab用於學習訓練，Isaac ROS是GPU加速套件。","steps":["用簡化差速輪底盤、雷射和障礙物建立模擬場景；先讓模擬車可直走與轉彎。","確認模擬器與ROS2有雷射、里程計與速度命令交換，再用同一套導航流程測試。","改動障礙物位置、摩擦與感測雜訊，重播固定測例；只有硬體達標且確有需要時才評估Isaac Sim。"],"watch":"RTX4070 Laptop 8GB低於目前Isaac Sim官方最低16GB VRAM需求；不要重灌現有WSL。不同版本的Isaac ROS、Isaac Sim與ROS2支援組合不同。","fail":"模擬器無法啟動或極慢：先看VRAM、顯示驅動、所選模擬器與ROS2版本，不要直接修改既有Autoware／CUDA環境。","note":"對第一台室內車，優先Gazebo＋ROS2測試；Isaac Sim/OpenUSD適合高擬真場景，Isaac Lab和GR00T不是必要前提。"},"type":"extra","applied":{"lecture":"Lecture10","title":"把實車導航任務搬到模擬器","grade":"選配 · 先用輕量模擬","steps":["在Gazebo建出車體和簡單走道，接上差速驅動與模擬LiDAR。","透過ROS2確認雷射、里程計、tf2與速度指令互通。","重播第06階段的障礙／逾時情境，記錄模擬與實車結果差別。"],"check":"不碰實體馬達就能重複執行導航與停止測試。","caution":"這台RTX4070 Laptop 8GB不達Isaac Sim 6.2的官方最低VRAM；Isaac ROS須依特定支援版本驗證，不預設可直接用。"}},{"id":"09","slug":"data-flywheel","name":"評估、資料飛輪與真實資料","en":"EVALUATE · COLLECT · IMPROVE","question":"機器人在某些情況下一直失敗，應該多收什麼資料才能改善？","lead":"先找出失敗的條件與能力缺口，再選最能補足缺口的資料來源，而不是只把影片和資料越存越多。","focus":"評估／資料","figs":["matrix","flywheel","tradeoff","teleop"],"sections":[["把失敗變成可分析的條件","在不同地板、光照、障礙物、物件與速度條件下，記錄完成率、偏差和安全事件。模型錯誤以外，也可能是鏡頭髒污、硬體磨損或校正漂移。","要先找原因，再決定蒐集哪類資料。"],["資料飛輪是一個改善循環","部署後評估表現→找出缺口→挑選高價值經驗→更新模型或規則→再評估。關鍵在資料能否改善實際弱點，而非筆數越多越好。","高覆蓋率與高保真度未必同時便宜。"],["不同資料來源有不同代價","手把手示教提供接近真實接觸的動作紀錄，但耗時；遙控操作較容易改任務，仍受視角和回饋限制；人類影片規模大，卻缺少機器人的關節與受力真值。 這類人與機器人、不同機器人之間的差異也稱具身差距。","同一資料來源很難涵蓋所有物件與環境。"],["開源資料工具如何分工","LeRobot提供機器人資料、模型訓練與相關工具；Open X-Embodiment聚合不同機器人與任務的資料。兩者都無法直接消除不同機器本體的控制差異。","只在需要跨任務或跨機器學習時才導入相應資料流程。"],["下一筆資料怎麼挑","優先挑對安全影響大、失敗頻繁、模型不確定或先前缺乏代表性的情況；每次改善後仍需重新驗證其他情況沒有惡化。","資料飛輪不是自動保證性能持續變好。"],["固定測例是比較改善的基準","用同一組場景、速度與障礙位置，比較修改前後是否真的變好。若場景也跟著變，無法判定進步是來自程式還是環境。","把成功、失敗、無效測試分開記錄；保留版本與測試條件。"]],"callout":"把「系統在哪些條件下不可靠」變成下一輪改善的依據。","gloss":["fidelity","flywheel","embodiment","lerobot","openx","calibration","rosbag2","scenarios","vv"],"origin":[1,3,4,5,7,9,10],"official":["lerobot","rosbag2docs"],"build":{"mode":"進階優化","done":"知道哪類環境容易失敗，能有方向地調整系統。","parts":"原有機器人即可；可加相機方便回看故障。","tools":"rosbag2、CSV／試算表、情境測試表；回放與分析在開發電腦執行。","steps":["記錄每次測例的場景條件、是否到站、碰撞／急停、定位偏移與完成時間。","用rosbag2保留感測、里程計與控制資料，依失敗原因分組。","一次只改一類問題，跑相同測例比較，再補充新情境。"],"watch":"回播rosbag2時隔離真實馬達控制，避免回放的速度Topic意外驅動實車。","fail":"收集一堆資料卻沒有改善：缺少清楚失敗分類與前後比較基準。","note":"親手示教、遙控、人類影片等是機器人學習資料來源；導航入門不必全做。"},"type":"extra","applied":{"lecture":"Lecture9–10","title":"做一張能追蹤改善的測試紀錄表","grade":"進階優化","steps":["每列記：測例ID、軟體版本、車速、障礙位置、完成時間、是否碰撞。","失敗時附rosbag2和截圖，標註感測／定位／規劃／控制哪個環節出問題。","修正後重跑原測例；只有確實改善才標為完成。"],"check":"能指出最常出錯的情境，以及修正前後的差異。","caution":"資料回放只供分析或在隔離模擬環境使用，不可不經檢查直接對實車下控制命令。"}},{"id":"10","slug":"learning-policy","name":"讓機器人學習與適應","en":"POLICY · BEHAVIOR CLONING","question":"環境和物件一直改變，什麼時候要用固定規則，什麼時候用學習式模型？","lead":"可預測的動作常用明確規則；物體形狀、接觸方式或環境變化太多時，可讓模型從影像和操作經驗學習策略，但仍需要安全邊界。","focus":"學習／操作","figs":["compare","policy","contact","observe-act"],"sections":[["固定規則與學習式策略互補","固定工位可用事先寫好的運動順序；面對不同形狀和位置的物件，學習式策略能從影像與機器人狀態決定動作。泛化是指遇到訓練時沒見過的條件仍能完成任務。 通用策略模型的目標是讓同一套策略能應對更多任務或機器人。","學習不是取代所有傳統控制器。"],["策略模型的輸入與輸出","策略模型可接收相機影像、機器人關節狀態與目標指令，輸出下一步動作或一段動作序列。端到端模型縮短人工編寫中間規則的流程，但難以直接保證所有錯誤都可解釋。","Transformer是處理序列和關聯資訊的一種網路架構，並非物理定律模擬器。"],["行為複製用操作紀錄學動作","行為複製把人類或其他控制器的觀察－動作配對當訓練資料，讓模型模仿類似情境下的動作。換了機器本體或操作場景，仍可能需要適配。 這種差異可稱為具身差距。","看懂影片中的目標，不等於已得到可執行的關節控制。"],["接觸操作的物理限制","抓取與搬運除了位置，還有摩擦、質量、受力、物件變形與接觸時機。機械手臂例子補充移動車沒有涵蓋的「物理互動」。","視覺位置正確，抓取力不足仍可能滑落。"],["人機協作要配合真實流程","醫院配送或居家協助的價值在於可靠完成一小段工作流程，不只是展示機器人的動作。若通道被擋住，機器人應能等待、改路或請求協助。","工作流程的品質與成功率同樣需要評估。"],["主動感知：先看清楚再動手","相機看不出物體硬度時，研究會先做低風險試探，再決定抓取或舀取方式。用在小車，可改為在盲角先停止、換視角觀察，再決定是否通過。","這是可移植的工程原則，並非要把餵食機器人的控制器直接搬到輪車。"],["擴散策略與傳統控制分工","Diffusion Policy可從操作資料學到多段動作序列，適合研究抓取、搬運等變化大的操作；簡單室內導航已有Nav2時，不應為了新模型而替換穩定的安全控制。","先有可量化基準，再判斷學習式模型是否真的比規則控制有用。"],["預測→執行→反應","例如手臂搬運物件前預測是否容易滑落，執行時監看影像或力回饋，發現風險就停止並調整動作。對輪車則以監看障礙與重新規劃類比。","學習模型與安全停止機制應分開，不能把風險判斷完全交給單一模型。"]],"callout":"固定規則、學習式策略和安全限制可以並存；沒必要讓模型接管每個底層控制。","gloss":["policy","gen_policy","e2e","generalization","transformer","embodiment","activeperception","diffusionpolicy","predictreact","isaaclab"],"origin":[2,3,5,10,11],"official":["lerobot","isaaclabdocs"],"build":{"mode":"研究延伸","done":"已有可靠基本導航後，再評估是否需要學習式策略。","parts":"選配機械手臂＋相機；需要接觸資訊時加力／觸覺感測器。純移動小車不需購買。","tools":"Python、PyTorch、LeRobot；Isaac Lab／Diffusion Policy屬研究選配，優先先用簡單行為複製模型。","steps":["先挑傳統控制難處理的一件事，例如抓取位置變動；基本導航已可完成就不必加入大模型。","有安全設備與操作手臂後，收集影像與動作的對照資料，從簡單行為複製開始。","讓機器人先觀察、預測動作可能失敗，再在受限環境下執行並即時修正；保留急停與人類接管。"],"watch":"食物操縱是Lecture11案例，與室內車基本導航不同；不用熱湯、危險物體作為初期測試材料。","fail":"訓練成功但換環境失敗：可能是資料覆蓋不足或模擬與真實差距。","note":"主動感知也能用在小車轉角：停下改變觀察角度、重新辨識障礙；操縱策略僅在加裝手臂後考慮。"},"type":"extra","applied":{"lecture":"Lecture11","title":"先實作「看不清楚就停止再觀察」","grade":"研究延伸","steps":["在模擬的轉角建立局部遮擋，不讓機器人直接穿過未知區域。","當觀測不足時停車、更新感測，再依新資訊選擇前進或改道。","若加裝機械手臂，另在安全桌面任務比較固定軌跡與主動感知操作。"],"check":"觀測不足時不盲目前進；恢復觀測後才繼續，失敗能追查。","caution":"這是把Lecture11的主動感知轉用於導航的設計建議；擴散策略與Isaac Lab不是本階段必要條件。"}}],"glossary":{"ros2":{"name":"ROS2","en":"Robot Operating System 2","desc":"不是作業系統本體，而是讓機器人的不同程式模組交換訊息、協調工作的軟體框架。"},"node":{"name":"節點","en":"ROS Node","desc":"ROS2中的單一功能程式，例如讀取LiDAR、計算路徑或控制輪子。"},"ros_topic":{"name":"Topic","en":"ROS2 Topic","desc":"ROS2中的持續資料通道：發送端發布資料，接收端訂閱資料，例如雷射掃描或車速。"},"ros_action":{"name":"Action","en":"ROS2 Action","desc":"可持續一段時間且能回報進度、取消任務的ROS2機制，例如「移動到指定位置」。"},"lidar":{"name":"LiDAR","en":"Light Detection and Ranging","desc":"發射雷射並接收反射訊號來量測距離，可形成空間掃描資料；水霧或反光等可能干擾結果。"},"tof":{"name":"飛行時間","en":"Time of Flight / ToF","desc":"量測訊號從發射到反射回來的時間，進而估算距離的一種原理。"},"pointcloud":{"name":"點雲","en":"Point Cloud","desc":"由許多具有空間位置的點組成的資料，用來表示物體表面與周圍幾何。"},"imu":{"name":"IMU","en":"Inertial Measurement Unit","desc":"慣性測量單元，通常用加速度計與陀螺儀估計加速度和旋轉狀態。"},"odometry":{"name":"里程計","en":"Odometry","desc":"利用輪子轉動或其他運動訊號估計位置變化，長時間可能累積誤差。"},"calibration":{"name":"校正","en":"Calibration","desc":"量測並調整感測器內部參數，或確認不同感測器之間的相對位置與方向。"},"fusion":{"name":"感測器融合","en":"Sensor Fusion","desc":"把相機、LiDAR、IMU等不同來源的資料結合，改善對環境或自身狀態的估計。"},"slam":{"name":"SLAM","en":"Simultaneous Localization and Mapping","desc":"同步定位與建圖：一邊估計自己在哪裡，一邊累積並修正環境地圖；Lecture5起再深入原理。"},"autoware":{"name":"Autoware","en":"Open-source Autonomous Driving Software","desc":"以ROS為基礎的開源自動駕駛軟體堆疊，整合感知、定位、規劃、控制等功能；主要面向車輛。"},"opencv":{"name":"OpenCV","en":"Open Source Computer Vision Library","desc":"常用的開源電腦視覺程式庫，能處理影像、偵測特徵與做相機校正。"},"policy":{"name":"策略模型","en":"Policy Model","desc":"根據目前觀察或狀態，產生下一個動作的規則或學習模型。"},"gen_policy":{"name":"通用策略模型","en":"Generalist Policy","desc":"嘗試處理多種任務、物件或機器人的學習式動作模型；能否泛化需要實測驗證。"},"e2e":{"name":"端到端模型","en":"End-to-End Model","desc":"從觀察直接學習輸出某種動作或中間決策，不必每一步都由人手寫規則；不等於沒有安全模組。"},"generalization":{"name":"泛化","en":"Generalization","desc":"在訓練時未完全相同的新物件、新場景或新任務中仍能有效運作的能力。"},"transformer":{"name":"Transformer","en":"Neural Network Architecture","desc":"一種神經網路架構，常用來處理序列或多種輸入資訊；用在機器人時仍要搭配資料與控制設計。"},"fidelity":{"name":"保真度","en":"Fidelity","desc":"資料或模擬有多接近所需的真實視覺、運動或接觸物理現象。"},"flywheel":{"name":"資料飛輪","en":"Data Flywheel","desc":"部署、評估、找能力缺口、補資料、訓練、再評估的持續改進循環。"},"embodiment":{"name":"具身差距","en":"Embodiment Gap","desc":"人手、輪式車與機械手臂的結構和能力不同，因此人類動作無法直接照搬為馬達命令。"},"lerobot":{"name":"LeRobot","en":"Hugging Face LeRobot","desc":"開源機器人學習工具與資料格式生態，協助記錄示範、整理資料與訓練策略模型。"},"openx":{"name":"Open X-Embodiment","en":"Open X-Embodiment","desc":"把不同機構和機器人的操作經驗彙整為跨平台資料的合作研究與資料集。"},"mujoco":{"name":"MuJoCo","en":"Multi-Joint dynamics with Contact","desc":"專門計算多關節機構、接觸與物理動力學的模擬引擎，適合研究機器人運動與操作。"},"isaac":{"name":"Isaac Sim","en":"NVIDIA Isaac Sim","desc":"提供機器人、感測器與物理場景模擬的軟體平台，可與ROS2整合並生成合成資料。"},"sim2real":{"name":"模擬到真實落差","en":"Sim-to-Real Gap","desc":"在模擬器裡成功的動作，到了真實世界可能因摩擦、感測雜訊或材質不同而失效。"},"procedural":{"name":"程序化生成","en":"Procedural Generation","desc":"由規則自動建立許多場景或任務組合，不必每次都人工擺設。"},"nerf":{"name":"NeRF","en":"Neural Radiance Fields","desc":"利用多視角影像學習場景外觀，讓系統從新視角生成畫面的一類神經表示方法。"},"gs":{"name":"3D Gaussian Splatting","en":"3DGS","desc":"以大量具有位置、大小與外觀的3D高斯元素呈現場景，適合新視角影像合成；不自帶可靠接觸物理。"},"worldmodel":{"name":"世界模型","en":"World Model","desc":"預測「現在做某個動作，下一刻環境可能變成什麼樣」的模型，可輔助規劃或產生經驗。"},"odd":{"name":"ODD","en":"Operational Design Domain","desc":"運作設計域：自動駕駛系統預定能運作的條件範圍，如道路、天候、光照與速度；可借用此思路定義室內機器人邊界。"},"shift":{"name":"分布偏移","en":"Distribution Shift","desc":"部署環境與訓練資料的條件不同，例如從白天室內改為夜間雨天。"},"mrm":{"name":"最小風險動作","en":"Minimum Risk Maneuver / MRM","desc":"異常情況下，依環境與限制選擇能降低風險的動作，例如受控減速並安全停靠。"},"hara":{"name":"HARA","en":"Hazard Analysis and Risk Assessment","desc":"汽車功能安全的危害分析與風險評估流程，考慮嚴重度、暴露程度與可控性。"},"iso26262":{"name":"ISO 26262","en":"Automotive Functional Safety Standard","desc":"汽車電機／電子系統的功能安全系列標準；其分類流程不能直接當作所有機器人的通用公式。"},"tf2":{"name":"tf2","en":"ROS Transform Library","desc":"ROS2管理不同座標系之間相對位置與轉向的工具，可查詢指定時間點的座標變換。"},"frame":{"name":"座標系","en":"Coordinate Frame","desc":"描述物體位置時所採用的原點與軸向；相機、車身、地圖通常各有自己的座標系。"},"pose":{"name":"位姿","en":"Pose","desc":"同時描述位置和方向，例如機器人在地圖上的(x,y)位置及面向角度。"},"transform":{"name":"齊次變換矩陣","en":"Homogeneous Transformation","desc":"常用4×4矩陣把三維旋轉與平移放在一起，可串接多個座標變換。"},"pinhole":{"name":"針孔相機模型","en":"Pinhole Camera Model","desc":"用光線從物體穿過相機光心、落在成像平面的幾何模型，解釋三維點如何投影成二維像素。"},"intrinsics":{"name":"相機內參","en":"Camera Intrinsics","desc":"焦距及主點等相機內部投影參數，通常整理為矩陣K。"},"extrinsics":{"name":"相機外參","en":"Camera Extrinsics","desc":"相機相對某座標系的位置與方向，通常用旋轉R及平移t描述。"},"rgbd":{"name":"RGB-D","en":"Color + Depth","desc":"同時提供彩色影像與每個像素深度值的感測資料或相機；深度未必每個像素都有有效值。"},"unprojection":{"name":"反投影","en":"Unprojection","desc":"利用像素位置、相機內參及已知深度，計算該像素對應的三維點。"},"stereo":{"name":"立體視覺","en":"Stereo Vision","desc":"利用不同視角看到同一點的位置差，配合相機幾何估計物體距離。"},"baseline":{"name":"基線","en":"Stereo Baseline","desc":"雙目相機兩個光心之間的距離；影響可量測的深度範圍和精度。"},"disparity":{"name":"視差","en":"Disparity","desc":"同一空間點在左右校正影像中的水平像素位置差；在簡化雙目模型中，深度Z約為fB/d。"},"epipolar":{"name":"對極幾何","en":"Epipolar Geometry","desc":"限制兩張影像中同一空間點可能出現位置的幾何關係，讓對應點搜尋由整張影像縮小到對極線附近。"},"triangulation":{"name":"三角測量","en":"Triangulation","desc":"利用兩個或更多已知相機位置和對應影像射線，估計空間點的三維位置。"},"sfm":{"name":"SfM","en":"Structure from Motion","desc":"從多張不同視角的照片估計相機位置與稀疏三維結構；單目情況通常存在整體尺度不確定性。"},"sift":{"name":"SIFT","en":"Scale-Invariant Feature Transform","desc":"辨識並描述影像中特徵點的演算法，對縮放與影像旋轉具一定穩定性。"},"colmap":{"name":"COLMAP","en":"Structure-from-Motion and Multi-View Stereo Software","desc":"用照片進行特徵匹配、相機姿態估計、SfM及多視角立體重建的開源工具。"},"ba":{"name":"BA","en":"Bundle Adjustment","desc":"同時調整相機位姿與三維點位置，使重投影誤差盡可能小的最佳化方法。"},"icp":{"name":"ICP","en":"Iterative Closest Point","desc":"反覆找兩組點雲的對應點，再估計旋轉與平移，逐步把兩組點雲對齊。需要合理初始位置，可能陷入錯誤對齊。"},"drift":{"name":"漂移","en":"Drift","desc":"每次位置估計的小誤差隨移動距離累積，讓估算路線逐漸偏離實際位置。"},"loopclosure":{"name":"閉環偵測","en":"Loop Closure","desc":"機器人再次到達以前走過的地方時，辨認出舊地點並利用這個限制修正累積定位誤差。"},"visualodo":{"name":"視覺里程計","en":"Visual Odometry","desc":"利用相鄰影像的特徵變化，逐步估計相機或機器人的相對移動。"},"depthnet":{"name":"學習型深度估計","en":"Learning-based Depth Estimation","desc":"用神經網路從影像推測深度；預測可能只具相對尺度，不能一律當作公尺距離。"},"selfsupervised":{"name":"自監督視圖合成","en":"Self-supervised View Synthesis","desc":"使用連續影像、預測深度及相機運動來合成另一幀，利用合成誤差學習深度；依賴視角重疊與若干場景假設。"},"occupancy":{"name":"佔用柵格地圖","en":"Occupancy Grid","desc":"把環境分成格子，儲存各格可通行、被佔用或未知的資訊，是二維導航常用地圖表示法。"},"cspace":{"name":"C-Space","en":"Configuration Space","desc":"用機器人完整構型（如位置、方向或各關節角）描述可能狀態的空間；規劃時必須考慮機器人本身的尺寸。"},"inflation":{"name":"障礙物膨脹","en":"Obstacle Inflation","desc":"按機器人外形與安全間距擴大地圖中的障礙物，使規劃出的中心路線保留必要空間。"},"dof":{"name":"DoF","en":"Degree of Freedom","desc":"描述機器人構型所需的獨立變數數目；移動底盤與多關節手臂的DoF不同。"},"astar":{"name":"A*","en":"A-star Search","desc":"圖搜尋演算法，結合目前已付出的成本及到目標的估計成本，尋找低代價路線；啟發式條件會影響最優性。"},"bfs":{"name":"BFS","en":"Breadth-first Search","desc":"從起點一層一層向外搜尋的演算法；在每條邊成本相同時能找到邊數最少的路徑。"},"prm":{"name":"PRM","en":"Probabilistic Roadmap","desc":"在可行構型中取樣、建立無碰撞連線的路網，再把起終點接入查詢，常用於重複規劃。"},"rrt":{"name":"RRT","en":"Rapidly-exploring Random Tree","desc":"從起點長出探索樹，反覆隨機取樣、朝樣本延伸並做碰撞檢查，找得到可行路徑不代表最短。"},"rrtstar":{"name":"RRT*","en":"Asymptotically Optimal RRT","desc":"RRT的改良型，透過選最佳父節點和重連線降低路徑代價；在特定假設與足夠採樣下可漸近最佳。"},"nonholonomic":{"name":"非完整約束","en":"Non-holonomic Constraint","desc":"機器人瞬時速度有方向限制，例如一般輪式車不能直接向側面平移，必須透過轉向與前後移動改變位置。"},"bicycle":{"name":"單車模型","en":"Kinematic Bicycle Model","desc":"以虛擬前後輪簡化前輪轉向車的平面運動，描述速度、軸距、轉角與轉彎半徑的關係；不適用於所有底盤形式。"},"diffdrive":{"name":"差速驅動","en":"Differential Drive","desc":"左右輪獨立改變轉速來前進或轉彎的底盤形式，在適當條件下能原地旋轉，與前輪轉向車不同。"},"trajopt":{"name":"軌跡最佳化","en":"Trajectory Optimization","desc":"把時間、速度、加速度、碰撞與轉向等限制一起考慮，尋找可實際執行的動作曲線。"},"mpc":{"name":"MPC","en":"Model Predictive Control","desc":"每次依當前狀態預測未來一小段動作並解最佳化問題，執行前段指令後重算以應對新狀況。"},"jerk":{"name":"Jerk","en":"Rate of Change of Acceleration","desc":"加速度隨時間變化的快慢；太大的Jerk常代表動作突然且不平順。"},"nav2":{"name":"Nav2","en":"ROS 2 Navigation Stack","desc":"ROS2的導航軟體框架，整合地圖、定位、路徑規劃、局部控制與導航行為，常用於地面移動機器人。"},"ros2_control":{"name":"ros2_control","en":"ROS 2控制框架","desc":"在ROS2中將控制器與實際馬達、關節硬體介面接起來；可搭配差速驅動控制器。"},"slam_toolbox":{"name":"slam_toolbox","en":"ROS2二維SLAM套件","desc":"用雷射掃描與機器人移動資訊建立2D地圖，也支援定位用途。"},"amcl":{"name":"AMCL","en":"Adaptive Monte Carlo Localization","desc":"拿已知2D地圖與LiDAR掃描估計機器人的位置，不負責從零建圖。"},"urdf":{"name":"URDF","en":"Unified Robot Description Format","desc":"以XML描述機器人車身、輪子、關節及感測器彼此位置。"},"costmap":{"name":"Costmap","en":"導航代價地圖","desc":"在地圖上標示障礙、未知區與靠近障礙的風險，讓規劃器迴避。"},"encoder":{"name":"編碼器","en":"Wheel Encoder","desc":"記錄馬達或輪子的轉動量，搭配輪徑／輪距估算車子移動。"},"bms":{"name":"BMS","en":"Battery Management System","desc":"電池保護管理電路，用來監控電池狀態與提供保護；仍須搭配正確的充電與保護設計。"},"rosbag2":{"name":"rosbag2","en":"ROS 2資料錄製工具","desc":"儲存ROS2主題資料，方便重播感測器數據與追查失敗。"},"gazebo":{"name":"Gazebo","en":"機器人物理模擬器","desc":"建立車體、地面與感測器的虛擬環境，搭配合適的ROS2版本與橋接套件。"},"motor_driver":{"name":"馬達驅動板","en":"Motor Driver","desc":"將控制訊號轉為驅動馬達所需的電壓與電流；額定值須與馬達相符。"},"vv":{"name":"Verification／Validation","en":"核實／確認用途","desc":"Verification檢查「是否按規格正確製作」；Validation檢查「做出的機器人是否能滿足預定場景的需求」。"},"vmodel":{"name":"V模型","en":"V-Model","desc":"把需求、設計、製作與對應的單元、整合、情境測試配對；不是全部做好才開始想怎麼驗收。"},"scenarios":{"name":"三層情境測試","en":"Functional / Logical / Concrete Scenarios","desc":"先描述發生什麼，再列出可變參數範圍，最後指定一組確定條件作為可重複執行的測試。"},"ttc":{"name":"TTC","en":"Time to Collision","desc":"在兩個物體保持目前接近速度的簡化假設下，估計還有多久可能碰撞；不代表任何轉彎、停止場景都能直接適用。"},"pet":{"name":"PET","en":"Post Encroachment Time","desc":"兩個物體依次通過同一衝突區時，前者離開與後者進入之間的時間差，常用於交會風險分析。"},"sotif":{"name":"SOTIF","en":"ISO 21448: Safety of the Intended Functionality","desc":"汽車「預期功能安全」標準，討論系統即使沒有硬體故障，也可能因感測或功能限制而出現不合理風險；在室內小車可借用思路，不代表取得認證。"},"isaaclab":{"name":"Isaac Lab","en":"NVIDIA Isaac Lab","desc":"建立在Isaac Sim上的機器人學習／大規模模擬訓練框架，重點是訓練策略，不是基本SLAM導航套件。"},"isaacros":{"name":"Isaac ROS","en":"NVIDIA Isaac ROS","desc":"一組利用NVIDIA GPU加速感知與機器人運算的ROS2套件，與Isaac Sim模擬器、Isaac Lab訓練框架用途不同；需先核對版本和平台。"},"openusd":{"name":"OpenUSD","en":"Open Universal Scene Description","desc":"用來描述3D場景、物件階層、材質與資產關係的開放格式；可供模擬器重用場景。"},"rosbridge":{"name":"ROS2 Bridge","en":"Simulator–ROS 2 Bridge","desc":"連結物理模擬器與ROS2的介面，讓模擬車向ROS2發布雷射、里程計等資料，並接收速度命令。"},"agentic":{"name":"Agentic AI工作流","en":"Agentic AI Workflow","desc":"讓AI工具依目標分步呼叫指令、檢查結果、修正作業的流程。用在機器人開發時必須保留人工審查，不能自動執行不明指令或更動安全設定。"},"activeperception":{"name":"主動感知","en":"Active Perception","desc":"機器人為了取得更好的資訊，先主動移動觀察位置、調整視角或試探物體，再決定接下來的動作。"},"diffusionpolicy":{"name":"擴散策略","en":"Diffusion Policy","desc":"透過反覆去除動作序列中的雜訊來生成候選動作的學習方法，常用於機械手臂的操作策略研究。"},"predictreact":{"name":"預測－反應","en":"Anticipate & React","desc":"執行動作前估計可能的失敗或風險；若新觀察顯示情況改變，立即停止、修正或重新規劃。"}},"official":{"ros2":["ROS2官方說明","https://docs.ros.org/en/humble/Concepts/Basic/About-ROS-2-Interfaces.html"],"autoware":["Autoware官方文件","https://docs.autoware.org/main/home/"],"opencv":["OpenCV相機校正","https://docs.opencv.org/4.x/dc/dbb/tutorial_py_calibration.html"],"lerobot":["LeRobot官方文件","https://huggingface.co/docs/lerobot/index"],"mujoco":["MuJoCo官方文件","https://mujoco.readthedocs.io/en/stable/"],"isaac":["NVIDIA Isaac Sim官方文件","https://docs.isaacsim.omniverse.nvidia.com/"],"nerf":["NeRF原始研究","https://www.matthewtancik.com/nerf"],"gs":["3D Gaussian Splatting研究","https://repo-sam.inria.fr/fungraph/3d-gaussian-splatting/"],"odd":["ISO 34503 ODD定義","https://www.iso.org/standard/78952.html"],"iso26262":["ISO 26262官方資料","https://www.iso.org/standard/68385.html"],"nav2":["Nav2導航文件","https://docs.nav2.org/"],"tf2":["ROS2 tf2說明","https://docs.ros.org/en/humble/Concepts/Intermediate/About-Tf2.html"],"colmap":["COLMAP官方文件","https://colmap.github.io/"],"moveit":["MoveIt運動規劃說明","https://moveit.ai/documentation/concepts/"],"ros2humble":["ROS2 Humble官方文件","https://docs.ros.org/en/humble/"],"ros2control":["ros2_control差速驅動（Humble）","https://control.ros.org/humble/doc/ros2_controllers/diff_drive_controller/doc/userdoc.html"],"nav2setup":["Nav2新機器人設定指南","https://docs.nav2.org/rolling/configuration_and_development/first_time_robot_setup_guide/"],"sllidar":["SLAMTEC官方ROS2 LiDAR驅動","https://github.com/Slamtec/sllidar_ros2"],"amcl":["AMCL套件說明","https://index.ros.org/p/nav2_amcl/"],"isaacwsl":["Isaac Sim的ROS2平台支援說明","https://docs.isaacsim.omniverse.nvidia.com/6.1.0/installation/install_ros_other_platforms.html"],"isaac6spec":["NVIDIA Isaac Sim 6.2硬體需求（最低16GB VRAM）","https://docs.isaacsim.omniverse.nvidia.com/6.2.0/installation/requirements.html"],"isaac6bridge":["NVIDIA Isaac Sim 6.2 ROS2整合","https://docs.isaacsim.omniverse.nvidia.com/6.2.0/installation/install_ros.html"],"isaacros32":["NVIDIA Isaac ROS 3.2（ROS2 Humble）","https://nvidia-isaac-ros.github.io/v/release-3.2/getting_started/index.html"],"iso34502":["ISO 34502:2022 場景式安全評估","https://www.iso.org/standard/78951.html"],"iso21448":["ISO 21448:2022 SOTIF","https://www.iso.org/standard/77490.html"],"rosbag2docs":["ROS2 rosbag2","https://index.ros.org/r/rosbag2/"],"isaaclabdocs":["NVIDIA Isaac Lab官方文件","https://isaac-sim.github.io/IsaacLab/main/index.html"]},"sources":{"1":[["Lecture1講義","https://docs.google.com/document/d/1JG_Zs-eoFfj-xmuFun9sJSBjsDavWYlV-msGuQowldY/edit"],["Lecture1逐字稿","https://drive.google.com/file/d/1moNVMtqAGBSVyrpAPX20gvwxOOgtSXmF/view"]],"2":[["Lecture2講義","https://docs.google.com/document/d/1gQQ1soN6K-5c9VpV07W97gsrMW6w1qe_ImP0Q14zBxg/edit"],["Lecture2逐字稿","https://drive.google.com/file/d/1sv1OlkLVI5A3zUc6uecwDyUHLnJUTFur/view"]],"3":[["Lecture3講義","https://docs.google.com/document/d/1eIqC48uxLh1wZZaRFEHYPC5A6rMTr9LtmubxWPdGTd4/edit"],["Lecture3逐字稿A","https://drive.google.com/file/d/1c2zv6XHPGf-W0zoJ5YJ7ZJXV_8pe0IKH/view"],["Lecture3逐字稿B","https://drive.google.com/file/d/1Q function figHtml(kind,i){return `<figure class="darkfigure" style="margin:0" aria-label="${esc(figLabels[kind]||kind)}"><div class="figTag">FIG. ${String(i+1).padStart(2,'0')} / ${esc(kind.toUpperCase())}</div>${ding(kind)}<figcaption class="figTitle">${esc(figLabels[kind]||kind)}</figcaption></figure>`}
function sidebar(){let slug=currentPage?.slug;$('#nav').innerHTML=P.map(p=>`<button class="navitem ${slug===p.slug?'current':''}" data-nav="${p.slug}" ${slug===p.slug?'aria-current="page"':''}><span class="navnum">${p.id}</span><span>${esc(p.name)}</span></button>`).join('')}
function indexHtml(){const B=DATA.robot_baseline;const path=(arr)=>`<div class="pathCards">${arr.map(p=>`<button class="pathCard" data-nav="${p.slug}"><span class="pn">${p.id} / ${p.type==='core'?'基本路線':'延伸'}</span><strong>${esc(p.name)}</strong><span>${esc(p.build.done)}</span></button>`).join('')}</div>`;return `<section class="indexhero"><div class="kicker">LECTURES 01–11 / BUILD PATH</div><h2>做一台真正能<br>自主移動的機器人。</h2><p class="desc">${esc(B.goal)}先完成基本功能，再依需要選進階技術。</p><div class="indexdraw"><figure class="darkfigure" style="margin:0"><div class="figurelabel">HARDWARE / SENSOR / CONTROL</div>${ding('robot')}<figcaption class="figurecaption">差速輪底盤 → 感測器 → 定位 → 導航 → 馬達 → 安全停止</figcaption></figure><div class="stacknote"><span class="no">01 → 06</span><strong>組裝與供電<br>馬達與里程計<br>感測器<br>SLAM建圖<br>自主導航<br>情境驗收</strong><div class="chip">07–10是選配延伸；情境驗收已列入基本路線。</div></div></div></section><section class="baseline"><h3>基本零件與環境</h3><p>${esc(B.title)}｜${esc(B.scope)}</p><div class="partTags">${B.base_parts.map(x=>`<span>${esc(x)}</span>`).join('')}</div><p>${esc(B.dev)}</p></section><div class="buildPath"><div class="buildPathhead">基本製作流程 <span>依序完成 01 → 06</span></div>${path(P.filter(p=>p.type==='core'))}<div class="buildPathhead">需要時再學 <span>進階 07 → 10</span></div>${path(P.filter(p=>p.type==='extra'))}</div>`}
function sourceHtml(p){let seen=new Set(),sources=[];for(let n of p.origin){for(let a of DATA.sources[String(n)]){if(!seen.has(a[1])){sources.push(a);seen.add(a[1]);}}}let official=p.official.map(k=>DATA.official[k]).filter(Boolean);return `<details class="sources"><summary>課程講義、逐字稿與技術文件</summary><div>${sources.map(x=>`<a href="${esc(x[1])}" target="_blank" rel="noopener noreferrer">${esc(x[0])}</a>`).join('')}</div>${official.length?`<div>${official.map(x=>`<a href="${esc(x[1])}" target="_blank" rel="noopener noreferrer">${esc(x[0])}</a>`).join('')}</div>`:''}</details>`}
function buildHtml(p){let b=p.build;let a=makeAnnotator(p);return `<section class="buildIntro"><div class="buildTop"><h3>這一階段要做什麼</h3><span class="buildMark ${p.type==='extra'?'extra':''}">${b.mode}</span></div><p class="buildGoal">完成：${esc(b.done)}</p><div class="buildGrid"><div class="buildCell"><h4>零件／材料</h4><p>${a(b.parts)}</p></div><div class="buildCell"><h4>工具／軟體</h4><p>${a(b.tools)}</p></div></div><div class="buildSteps"><h4>依序執行</h4><ol>${b.steps.map(x=>`<li>${a(x)}</li>`).join('')}</ol></div><div class="buildWarns"><div class="buildWarn"><strong>注意</strong><p>${a(b.watch)}</p></div><div class="buildWarn issue"><strong>常見問題</strong><p>${a(b.fail)}</p></div></div><p class="buildNote">${esc(b.note)}</p></section>`}
function appliedHtml(p){let v=p.applied;if(!v)return '';return `<section class="applied" aria-label="新課程實作補充"><div class="appliedHead"><small>LECTURE ${esc(v.lecture.replace('Lecture',''))} / APPLIED</small><b>${esc(v.grade)}</b></div><h3>${esc(v.title)}</h3><ol>${v.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><div class="appliedFoot"><p><strong>完成時應看到：</strong>${esc(v.check)}</p><p><strong>注意：</strong>${esc(v.caution)}</p></div></section>`}
function chapterHtml(p){let a=makeAnnotator(p),i=P.indexOf(p),prev=P[i-1],next=P[i+1];return `<section class="pagehero"><div class="pagetop"><div class="kicker">BUILD THE ROBOT / STAGE ${p.id}</div><span class="bigNo">${p.id}</span></div><h2>${esc(p.name)}</h2><div class="eng">${esc(p.en)}</div><p class="question">${a(p.question)}</p><p class="lead">${a(p.lead)}</p><div class="focusbar"><span>${p.type==='core'?'基本建置階段':'進階技術延伸'} · ${esc(p.focus)}</span><span>Lecture ${p.origin.join(' / ')}</span><div class="mini-progress" aria-label="全書閱讀位置">${P.map(x=>`<button aria-label="前往${esc(x.name)}" title="${esc(x.name)}" data-nav="${x.slug}" class="${x.slug===p.slug?'sel':''}"></button>`).join('')}</div></div></section>${buildHtml(p)}${appliedHtml(p)}<div class="subtitle"><span class="idx">A / VISUAL LOGIC</span><h3>對照系統圖理解</h3></div><div class="diagrams">${p.figs.map((k,i)=>figHtml(k,i)).join('')}</div><details class="studyDetails"><summary>展開技術原理（${p.sections.length}個重點）</summary><div class="subtitle"><span class="idx">B / PRINCIPLES</span><h3>原理與限制</h3></div><div class="sectiongrid">${p.sections.map((s,j)=>`<section class="lesson"><div class="smallno">${p.id}.${String(j+1).padStart(2,'0')}</div><h4>${esc(s[0])}</h4><p>${a(s[1])}</p><div class="key">${esc(s[2])}</div></section>`).join('')}</div><div class="emphasis"><span class="sym">↳</span><p>${a(p.callout)}</p></div></details><details class="studyDetails"><summary>展開本章專有名詞／工具（${p.gloss.length}項）</summary><div class="glossary">${p.gloss.map(k=>{let d=G[k];return `<article class="def" id="term-${k}"><div class="name">${esc(d.name)}</div><div class="en">${esc(d.en)}</div><p>${esc(d.desc)}</p></article>`}).join('')}</div></details>${sourceHtml(p)}<div class="pager"><div>${prev?`<button class="pageArrow" data-nav="${prev.slug}"><small>← PREVIOUS</small><b>${esc(prev.name)}</b></button>`:`<button class="pageArrow" data-home><small>← INDEX</small><b>全部階段</b></button>`}</div><div>${next?`<button class="pageArrow" data-nav="${next.slug}"><small>NEXT →</small><b>${esc(next.name)}</b></button>`:`<button class="pageArrow" data-home><small>INDEX →</small><b>全部階段</b></button>`}</div></div>`}
function render(){let slug=decodeURIComponent(location.hash.replace(/^#\/?(?:topic\/)?/,'').trim());currentPage=P.find(x=>x.slug===slug)||null;$('#view').innerHTML=currentPage?chapterHtml(currentPage):indexHtml();$('#bread').textContent=currentPage?.name||'10個階段';$('#progress').textContent=currentPage?`${currentPage.id} / 10`:'10 STAGES';sidebar();document.title=(currentPage?currentPage.name+'｜':'')+'實體人工智慧｜自主機器人製作圖解';document.querySelector('.main').scrollTo?.(0,0);window.scrollTo({top:0,behavior:'instant'});closeSidebar()}
function go(slug){location.hash=slug?'#/topic/'+slug:'#/';if(location.hash==='#/topic/'+slug)render()}
function closeSidebar(){$('#sidebar').classList.remove('show');$('#scrim').classList.remove('show')}
function closeSearch(){$('#searchLayer').classList.remove('show')}
function openSearch(){$('#searchLayer').classList.add('show');$('#searchInput').value='';showSearch('');setTimeout(()=>$('#searchInput').focus(),0)}
function showSearch(query){let q=query.trim().toLowerCase();let pg=P.filter(p=>!q||[p.name,p.en,p.lead,p.question,...p.gloss.map(k=>G[k].name),...p.sections.flat()].join(' ').toLowerCase().includes(q));let terms=Object.entries(G).filter(([k,g])=>q&&[g.name,g.en,g.desc].join(' ').toLowerCase().includes(q)).slice(0,14);$('#searchResult').innerHTML=pg.map(p=>`<button class="resultItem" data-nav="${p.slug}"><span>${p.id}　${esc(p.name)}</span><small>章節</small></button>`).join('')+terms.map(([k,v])=>`<button class="resultItem" data-term="${k}"><span>${esc(v.name)} — ${esc(v.en)}</span><small>名詞</small></button>`).join('')+(pg.length||terms.length?'':'<div class="searchEmpty">找不到相符的技術或名詞。</div>')}
function closeTerm(){$('#termLayer').classList.remove('show')}
function openTerm(k){let d=G[k];if(!d)return;closeSearch();$('#termCard').innerHTML=`<div class="termhead"><small>TECHNICAL TERM</small><button type="button" data-close-term>關閉 ×</button></div><h3>${esc(d.name)}</h3><p class="termEnglish">${esc(d.en)}</p><p class="definition">${esc(d.desc)}</p>`;$('#termLayer').classList.add('show');$('#termCard button').focus()}
window.addEventListener('hashchange',render);document.addEventListener('click',e=>{let nav=e.target.closest('[data-nav]');if(nav){closeSearch();go(nav.dataset.nav);return}let term=e.target.closest('[data-term]');if(term){openTerm(term.dataset.term);return}if(e.target.closest('[data-home]'))go(null);if(e.target.closest('[data-close-term]'))closeTerm()});$('#homeBtn').onclick=()=>go(null);$('#searchNav').onclick=openSearch;$('#searchTop').onclick=openSearch;$('#searchClose').onclick=closeSearch;$('#searchInput').addEventListener('input',e=>showSearch(e.target.value));$('#searchLayer').addEventListener('click',e=>{if(e.target.id==='searchLayer')closeSearch()});$('#termLayer').addEventListener('click',e=>{if(e.target.id==='termLayer')closeTerm()});$('#menuBtn').onclick=()=>{$('#sidebar').classList.add('show');$('#scrim').classList.add('show')};$('#scrim').onclick=closeSidebar;document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}if(e.key==='Escape'){closeSearch();closeTerm();closeSidebar()}});render();
</script></body></html>
