<div class="af-page ga-v2"><div class="af-kicker"><span>COURSE 06 / MODULE 3</span><span>DATA ANALYSIS</span></div><h1>由摘要到深入提問</h1><p class="af-deck">先看資料全貌，再用具體問題尋找值得解釋的模式。</p><figure class="ga-figure"><div class="ga-rows"><div class="ga-row"><b>概況</b><p>列數、欄位型別、日期範圍與缺值</p></div><div class="ga-row"><b>比較</b><p>依渠道、月份或群組比較相同指標</p></div><div class="ga-row"><b>異常</b><p>找出超出一般範圍的紀錄</p></div><div class="ga-row"><b>驗證</b><p>查看分析步驟及原表重算</p></div></div><figcaption>每一項分析都要能追溯到欄位與計算方式。</figcaption></figure><section class="af-section"><h2>資料分析與模型敘述</h2><p>課程示範Gemini在試算表中整理摘要、分析與生成圖表。若模型指出某渠道營收較高，應檢查是總營收、每次造訪營收還是平均客單價；不能混用。可查看工具提供的分析步驟或計算邏輯。</p></section><blockquote class="af-prompt">先摘要資料結構與缺值，再依渠道計算每次造訪營收，列出分母、資料範圍和計算方式。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>先核對數字，再請AI解釋；解釋可能只是推測。</p></aside><footer class="af-page-foot"><span>AI STRATEGY &amp; ANALYSIS / C06</span><span>23</span></footer></div>
