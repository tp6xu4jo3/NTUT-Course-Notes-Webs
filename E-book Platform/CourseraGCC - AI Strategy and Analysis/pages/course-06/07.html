<div class="af-page ga-v2"><div class="af-kicker"><span>COURSE 06 / MODULE 3</span><span>DATA ANALYSIS</span></div><h1>讓數字支持敘事，不替你編故事</h1><p class="af-deck">說明發現、可能原因與下一步，三者需要分開。</p><figure class="ga-figure"><div class="ga-rows"><div class="ga-row"><b>發現</b><p>A渠道每次造訪營收為40元，B為30元（假設）</p></div><div class="ga-row"><b>可能解釋</b><p>受眾意圖、商品組合或活動差異</p></div><div class="ga-row"><b>缺少證據</b><p>投入成本、樣本量、客群與期間</p></div><div class="ga-row"><b>行動</b><p>補資料、設計驗證，再決定資源分配</p></div></div><figcaption>編輯補充：示例數值不代表實際營運資料。</figcaption></figure><section class="af-section"><h2>把相關與因果分開</h2><p>如果A渠道平均營收較高，不能直接認定增加A預算一定會提高總營收。先查投入成本與樣本條件，再考慮對照測試。讓AI提出可能原因時，要求區分資料支持與待驗證假設。</p></section><blockquote class="af-prompt">依已核對的結果撰寫一段給主管的摘要：先說發現，再列出兩個合理假設及其驗證方法，最後提出低風險下一步。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>數據故事不應遮掩限制或只挑選支持原立場的資料。</p></aside><footer class="af-page-foot"><span>AI STRATEGY &amp; ANALYSIS / C06</span><span>25</span></footer></div>
