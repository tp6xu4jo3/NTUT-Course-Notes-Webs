<div class="af-page ga-v2"><div class="af-kicker"><span>COURSE 06 / MODULE 1</span><span>DATA ANALYSIS</span></div><h1>先定義決策與衡量指標</h1><p class="af-deck">資料分析應從問題出發，而非先把所有資料畫成圖。</p><figure class="ga-figure"><div class="ga-flow"><div class="ga-step"><b>目標</b><small>想改善什麼</small></div><span class="ga-arrow" aria-hidden="true">→</span><div class="ga-step"><b>KPI</b><small>怎麼衡量</small></div><span class="ga-arrow" aria-hidden="true">→</span><div class="ga-step"><b>資料</b><small>需要哪些欄位</small></div><span class="ga-arrow" aria-hidden="true">→</span><div class="ga-step"><b>判斷</b><small>依結果採取行動</small></div></div><figcaption>KPI是可用來檢視目標進展的關鍵指標。</figcaption></figure><section class="af-section"><h2>把模糊目標變成可量測問題</h2><p>例如增加交流活動成效，可以追蹤實到人數、報名到場率與每位參加者成本；若目標是提升學習成果，還需設計回饋與評量。指標選擇必須和要做的決策有關。</p></section><blockquote class="af-prompt">目標是增加活動實際參與。提出可量測指標、計算方式、必要資料與限制；預測主管會問哪些問題。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>報名率、到場率、滿意度回答不同問題，不應任意替換。</p></aside><footer class="af-page-foot"><span>AI STRATEGY &amp; ANALYSIS / C06</span><span>19</span></footer></div>
