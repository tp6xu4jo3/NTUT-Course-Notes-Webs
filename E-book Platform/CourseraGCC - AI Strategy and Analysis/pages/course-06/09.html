<div class="af-page ga-v2"><div class="af-kicker"><span>COURSE 06 / MODULE 3</span><span>DATA ANALYSIS</span></div><h1>整合練習：從問題到決策</h1><p class="af-deck">完成一份讓別人可以查證、重算並採取行動的分析報告。</p><figure class="ga-figure"><div class="ga-grid"><div class="ga-cell"><b>策略</b><p>目標、候選方案與限制</p></div><div class="ga-cell"><b>研究</b><p>原始來源與證據摘要</p></div><div class="ga-cell"><b>分析</b><p>乾淨資料、指標、計算</p></div><div class="ga-cell"><b>行動</b><p>風險、建議、負責人</p></div></div><figcaption>第二冊綜合成果：一條可追溯的決策鏈。</figcaption></figure><section class="af-section"><h2>實作</h2><p>選擇一個校園或工作問題，從Course 02的策略計畫出發，使用Course 03研究方法蒐集證據，再用Course 06整理資料和圖表。將結論與假設分欄，讓同儕用原資料重算至少一個指標。</p></section><blockquote class="af-prompt">審查這份分析報告：檢查指標分母、來源、計算及推論；列出最可能改變決策的三項未知資訊。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>若模型宣稱某渠道最好，先驗證計算、分母與成本，不能單憑模型的結論調整預算。</p></aside><footer class="af-page-foot"><span>AI STRATEGY &amp; ANALYSIS / C06</span><span>27</span></footer></div>
