<div class="af-page ga-v2"><div class="af-kicker"><span>COURSE 03 / MODULE 2</span><span>RESEARCH AND INSIGHTS</span></div><h1>將研究轉成自己的學習資源</h1><p class="af-deck">摘要、問答、音訊概覽或學習指南都應回到同一批來源。</p><figure class="ga-figure"><div class="ga-flow"><div class="ga-step"><b>選定來源</b><small>核准資料</small></div><span class="ga-arrow" aria-hidden="true">→</span><div class="ga-step"><b>指定用途</b><small>摘要或問答</small></div><span class="ga-arrow" aria-hidden="true">→</span><div class="ga-step"><b>生成資源</b><small>依受眾調整</small></div><span class="ga-arrow" aria-hidden="true">→</span><div class="ga-step"><b>回查</b><small>核對引用</small></div></div><figcaption>輸出形式可以不同，證據基礎不能偷偷改變。</figcaption></figure><section class="af-section"><h2>比較摘要與問答</h2><p>摘要適合快速建立全貌，問答適合找具體證據。若要讀懂設計色彩理論，先要求一頁摘要，再追問不同資料如何建議測試配色。課程也示範生成其他媒體摘要，應按可用功能選擇。</p></section><blockquote class="af-prompt">根據來源製作一份新手學習指南，列出術語、例子、可練習的方法及原始引用；另列三個來源無法回答的問題。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>生成資源不能取代閱讀重要原文；查證時回到引用段落。</p></aside><footer class="af-page-foot"><span>AI STRATEGY &amp; ANALYSIS / C03</span><span>16</span></footer></div>
