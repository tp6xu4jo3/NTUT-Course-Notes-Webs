<div class="af-page ga-v2"><div class="af-kicker"><span>COURSE 03 / MODULE 1</span><span>RESEARCH AND INSIGHTS</span></div><h1>從引用走回原始證據</h1><p class="af-deck">引用只能指出可能的依據，不能自動證明論點正確。</p><figure class="ga-figure"><div class="ga-rows"><div class="ga-row"><b>主張</b><p>某種宣傳方式提升報名率</p></div><div class="ga-row"><b>原始來源</b><p>找到研究或活動主辦者發布的資料</p></div><div class="ga-row"><b>核對</b><p>期間、分母、受眾、比較基準、研究限制</p></div><div class="ga-row"><b>結論</b><p>只陳述來源真正支持的範圍</p></div></div><figcaption>示意查核鏈：主張與來源要能逐項對應。</figcaption></figure><section class="af-section"><h2>區分事實、推論與建議</h2><p>來源可能顯示某場活動報名較多，卻沒有排除場地、時間、課程安排等變因。能說兩者相關，不代表能斷言宣傳方式造成成長。若不同資料相互矛盾，先呈現差異而不是拼成單一數字。</p></section><blockquote class="af-prompt">列出每項關鍵主張、來源連結、原文支持的資訊、適用範圍和疑點；找不到支持就移除該主張。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>遇到重要數字應親自開啟原始來源，而非只請模型重新確認。</p></aside><footer class="af-page-foot"><span>AI STRATEGY &amp; ANALYSIS / C03</span><span>13</span></footer></div>
