<div class="af-page ga-v2"><div class="af-kicker"><span>COURSE 03 / MODULE 3</span><span>RESEARCH AND INSIGHTS</span></div><h1>建立可重用的AI專家</h1><p class="af-deck">把第一冊的角色設定延伸為一套固定評估規則。</p><figure class="ga-figure"><div class="ga-flow"><div class="ga-step"><b>定義專長</b><small>任務與能力</small></div><span class="ga-arrow" aria-hidden="true">→</span><div class="ga-step"><b>設定指令</b><small>角度、規則</small></div><span class="ga-arrow" aria-hidden="true">→</span><div class="ga-step"><b>提供情境</b><small>工作與目標</small></div><span class="ga-arrow" aria-hidden="true">→</span><div class="ga-step"><b>反覆測試</b><small>用不同案例驗證</small></div></div><figcaption>教材以Gemini自訂專家／固定對話指令示範。</figcaption></figure><section class="af-section"><h2>專家角色不等於專業資格</h2><p>先請AI列出優秀審查者的能力，例如辨識假設、提出證據、檢查可行性；再選擇真正適用的能力，加入自己的角色與工作限制。重用時可以保存專家指令，毋須每次重新發明角色。</p></section><blockquote class="af-prompt">你是研究審查助手。先核對來源與研究設計，再指出最重要的反例和證據缺口。只提供依據支持的批評，未知就提出問題。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>避免將人格化專家當成權威。重要專業意見應由具資格的人複核。</p></aside><footer class="af-page-foot"><span>AI STRATEGY &amp; ANALYSIS / C03</span><span>17</span></footer></div>
