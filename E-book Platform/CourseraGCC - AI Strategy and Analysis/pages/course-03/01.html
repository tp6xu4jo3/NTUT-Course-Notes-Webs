<div class="af-page ga-v2"><div class="af-kicker"><span>COURSE 03 / MODULE 1</span><span>RESEARCH AND INSIGHTS</span></div><h1>研究不是搜尋結果的堆疊</h1><p class="af-deck">先決定要回答什麼問題，以及哪些證據能改變你的判斷。</p><figure class="ga-figure"><div class="ga-flow"><div class="ga-step"><b>研究問題</b><small>明確目標</small></div><span class="ga-arrow" aria-hidden="true">→</span><div class="ga-step"><b>研究計畫</b><small>範圍、來源、方法</small></div><span class="ga-arrow" aria-hidden="true">→</span><div class="ga-step"><b>蒐集證據</b><small>比對來源</small></div><span class="ga-arrow" aria-hidden="true">→</span><div class="ga-step"><b>結論</b><small>列限制與下一步</small></div></div><figcaption>Deep Research的核心是可檢查的研究流程。</figcaption></figure><section class="af-section"><h2>研究問題要有範圍</h2><p>例如要評估校內活動的宣傳方式，不應只問「現在流行什麼」。先說明目標是增加實際到場、對象是大學生、限制是兩週與小額預算，再決定哪些案例和數據有參考價值。</p></section><blockquote class="af-prompt">請先提出研究計畫，不要直接給結論。列出要回答的問題、資料期間、來源類型、比較指標與尚缺資料。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>研究計畫先由你確認，再執行；AI產生的研究問題也可能偏離原始目標。</p></aside><footer class="af-page-foot"><span>AI STRATEGY &amp; ANALYSIS / C03</span><span>11</span></footer></div>
