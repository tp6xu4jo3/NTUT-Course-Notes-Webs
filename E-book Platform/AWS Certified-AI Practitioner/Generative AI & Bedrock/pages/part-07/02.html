<article class="aif-page"><header class="aif-kicker"><span>PART 07 / VOL. 02</span><span>DOMAIN 2,3</span></header><h1>Token、快取及吞吐量</h1><p class="aif-intro">Token計價通常依模型與輸入／輸出Token量而變。相同請求次數，長文件或長輸出可能更昂貴。按需模式適合變動需求；預置吞吐量在符合模型及負載條件時提供預留能力，需評估使用率及承諾成本。</p><figure class="aif-figure"><div class="aif-compare"><div><b>輸入Token＋輸出Token</b>依費率計費</div><div><b>共用前綴</b>符合條件時快取</div></div><figcaption>概念對照示意。</figcaption></figure><section class="aif-section"><h2>深入理解</h2><p>Prompt Caching可對可重用的前綴降低重複處理，但支援方式、命中條件及定價依模型而變。快取不是把回答永久記住，也不能代替正確性評估。</p></section><aside class="aif-note"><b>理解與應用</b><p>不要宣稱預置吞吐量必然比按需便宜。</p></aside><footer class="aif-foot"><span>AIF-C01 / PART 7</span><a href="https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html" target="_blank" rel="noopener">官方範圍</a><span>06</span></footer></article>
