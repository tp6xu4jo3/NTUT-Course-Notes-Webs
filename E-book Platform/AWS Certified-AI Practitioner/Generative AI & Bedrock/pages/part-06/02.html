<article class="aif-page"><header class="aif-kicker"><span>PART 06 / VOL. 02</span><span>DOMAIN 2</span></header><h1>生成式AI的價值與限制</h1><p class="aif-intro">生成式AI適合文字摘要、草稿、翻譯、內容生成及文件問答等任務。對固定計算或法定判定，規則及傳統軟體可能較合適。評估產品時不能只看模型能力，也要看工作流程、錯誤成本及資料風險。</p><figure class="aif-figure"><div class="aif-flow" role="group" aria-label="概念流程"><div class="aif-node">業務目標</div><span class="aif-arrow" aria-hidden="true">→</span><div class="aif-node">模型選擇</div><span class="aif-arrow" aria-hidden="true">→</span><div class="aif-node">評估</div><span class="aif-arrow" aria-hidden="true">→</span><div class="aif-node">部署</div><span class="aif-arrow" aria-hidden="true">→</span><div class="aif-node">回饋</div></div><figcaption>原創教學示意；實際流程依服務與情境調整。</figcaption></figure><section class="aif-section"><h2>深入理解</h2><p>基礎模型生命週期從資料與模型選擇、預訓練、客製化、評估到部署及回饋。模型選擇須比較模態、能力、延遲、成本、語言、合規與限制。衡量商業價值可看轉換率、效率、成本及客戶滿意度。</p></section><aside class="aif-note"><b>理解與應用</b><p>原創情境：客服摘要應同時測量節省時間、摘要正確性及人工修正成本。</p></aside><footer class="aif-foot"><span>AIF-C01 / PART 6</span><a href="https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html" target="_blank" rel="noopener">官方範圍</a><span>04</span></footer></article>
