<article class="aif-page"><header class="aif-kicker"><span>PART 01 / VOL. 01</span><span>FOUNDATIONS</span></header><h1>區域、權限與責任</h1><p class="aif-intro">Region（區域）是地理部署範圍；Availability Zone（可用區域）是區域內彼此隔離的基礎設施位置。VPC提供邏輯隔離的網路。資料駐留、延遲與故障容忍會影響部署選擇。</p><figure class="aif-figure"><div class="aif-flow" role="group" aria-label="概念流程"><div class="aif-node">身分／角色</div><span class="aif-arrow" aria-hidden="true">→</span><div class="aif-node">IAM政策</div><span class="aif-arrow" aria-hidden="true">→</span><div class="aif-node">授權操作</div><span class="aif-arrow" aria-hidden="true">→</span><div class="aif-node">AWS資源</div></div><figcaption>原創教學示意；實際流程依服務與情境調整。</figcaption></figure><section class="aif-section"><h2>深入理解</h2><p>IAM（身分與存取管理）透過角色及政策控制誰能對哪些資源做什麼。最小權限只給完成工作必要的操作。AWS負責雲端基礎設施的安全，客戶負責雲端內自己掌管的資料、身分及設定；具體分工依服務而變。</p></section><aside class="aif-note"><b>理解與應用</b><p>雲端並不代表無須管理安全，也不代表所有服務都在所有區域提供。</p></aside><footer class="aif-foot"><span>AIF-C01 / PART 1</span><a href="https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01.html" target="_blank" rel="noopener">官方範圍</a><span>06</span></footer></article>
