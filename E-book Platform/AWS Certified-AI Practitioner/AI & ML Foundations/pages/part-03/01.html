<article class="aif-page"><header class="aif-kicker"><span>PART 03 / VOL. 01</span><span>DOMAIN 1</span></header><h1>資料的形態與標籤</h1><p class="aif-intro">結構化資料有明確欄位與結構，例如交易明細表。JSON或XML常屬半結構化，因為具鍵值或標記但欄位未必固定；影像、錄音及自由文字通常屬非結構化。時間序列強調觀測值的時間順序。</p><figure class="aif-figure"><div class="aif-flow" role="group" aria-label="概念流程"><div class="aif-node">交易資料</div><span class="aif-arrow" aria-hidden="true">→</span><div class="aif-node">標記正常／詐欺</div><span class="aif-arrow" aria-hidden="true">→</span><div class="aif-node">監督學習</div></div><figcaption>原創教學示意；實際流程依服務與情境調整。</figcaption></figure><section class="aif-section"><h2>深入理解</h2><p>標記資料（Labeled Data）含學習目標，例如已標明正常或詐欺的交易。未標記資料仍可有欄位，只是缺乏指定的答案標籤。資料的結構與是否有標籤是兩個獨立維度。</p></section><aside class="aif-note"><b>理解與應用</b><p>ZIP預試第2題以CSV員工表為例，考的是規律欄位，不是檔案副檔名本身。</p></aside><footer class="aif-foot"><span>AIF-C01 / PART 3</span><a href="https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain1.html" target="_blank" rel="noopener">官方範圍</a><span>09</span></footer></article>
