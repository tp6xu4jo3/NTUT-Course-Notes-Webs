<article class="aif-page"><header class="aif-kicker"><span>PART 02 / VOL. 01</span><span>DOMAIN 1</span></header><h1>模型如何學習及推論</h1><p class="aif-intro">演算法是學習或處理問題的方法；模型是訓練後形成、可用於預測的表示。訓練時利用資料調整模型參數，推論時使用已訓練的模型處理新輸入。</p><figure class="aif-figure"><div class="aif-flow" role="group" aria-label="概念流程"><div class="aif-node">歷史資料</div><span class="aif-arrow" aria-hidden="true">→</span><div class="aif-node">訓練</div><span class="aif-arrow" aria-hidden="true">→</span><div class="aif-node">已訓練模型</div><span class="aif-arrow" aria-hidden="true">→</span><div class="aif-node">新資料推論</div></div><figcaption>原創教學示意；實際流程依服務與情境調整。</figcaption></figure><section class="aif-section"><h2>深入理解</h2><p>例如垃圾郵件分類器先用歷史郵件學習文字與標籤的關係，再對新郵件輸出分類或分數。NLP處理人類語言，Computer Vision處理影像或影片。是否選擇傳統ML或FM，取決於資料、任務、成本、可解釋性及營運限制。</p></section><aside class="aif-note"><b>理解與應用</b><p>訓練和推論是不同階段；模型每次回覆不代表都重新訓練。</p></aside><footer class="aif-foot"><span>AIF-C01 / PART 2</span><a href="https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain1.html" target="_blank" rel="noopener">官方範圍</a><span>08</span></footer></article>
