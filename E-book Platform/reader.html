<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>閱讀器</title><link rel="stylesheet" href="assets/platform.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;family=Noto+Sans+TC:wght@400;500;700&amp;family=Noto+Serif+TC:wght@600;700;900&amp;display=swap" rel="stylesheet"></head><body class="reader"><header class="reader-header"><a class="control" href="./" aria-label="返回書櫃">← 書櫃</a><div class="reader-title"><strong id="book-title"></strong><span id="chapter"></span></div><div class="reader-tools"><button class="control" id="toc-toggle" aria-controls="toc" aria-expanded="true">目錄</button><button class="control" id="smaller" aria-label="縮小字體">A−</button><button class="control" id="larger" aria-label="放大字體">A+</button></div></header><div class="reader-layout"><aside id="toc" class="toc-panel"><div class="toc-head"><h2>目錄</h2><button class="control" id="toc-close" aria-label="關閉目錄">×</button></div><nav id="toc-list" aria-label="章節目錄"></nav></aside><main id="stage" class="stage" aria-label="書頁"><button class="page-arrow" id="prev" aria-label="上一頁">‹</button><div id="spread" class="spread"><article id="left" class="magazine-page reader-page"></article><article id="right" class="magazine-page reader-page" hidden></article></div><button class="page-arrow" id="next" aria-label="下一頁">›</button></main></div><footer class="reader-footer"><span id="counter" aria-live="polite"></span><div class="progress-control"><input type="range" id="progress" min="0" max="1" step="1" value="0" aria-label="閱讀進度，跳至指定閱讀位置"></div><span id="percent"></span></footer><p id="reader-status" role="status"></p><script type="module" src="assets/reader.js"></script></body></html>
