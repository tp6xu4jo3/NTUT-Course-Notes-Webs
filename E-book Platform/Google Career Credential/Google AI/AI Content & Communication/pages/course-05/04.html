<div class="af-page ga-v3"><div class="af-kicker"><span>COURSE 05 / MODULE 2</span><span>CONTENT CREATION</span></div><h1>簡報敘事：先有故事再排版</h1><p class="af-deck">簡報不是把文件縮成一張張投影片，而是把重點排列成能理解的順序。</p><figure class="ga-figure"><div class="ga-flow"><div class="ga-step"><b>情境</b><small>為何這件事重要</small></div><span class="ga-arrow" aria-hidden="true">→</span><div class="ga-step"><b>問題</b><small>觀眾需要理解的落差</small></div><span class="ga-arrow" aria-hidden="true">→</span><div class="ga-step"><b>證據</b><small>資料、案例或圖表</small></div><span class="ga-arrow" aria-hidden="true">→</span><div class="ga-step"><b>行動</b><small>下一步與決策</small></div></div><figcaption>一種常用敘事結構；依任務調整。</figcaption></figure><section class="af-section"><h2>從長文件產生大綱</h2><p>教材示範以Canvas將內部文件轉為簡報，先要求頁面主題與敘事順序，再生成畫面。每張只承擔一個核心訊息，證據與結論需能回查來源。</p></section><blockquote class="af-prompt">將已核准文件轉成6頁簡報大綱。每頁列出一個結論式標題、支持證據及建議視覺；不得新增數字。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>核對受眾是否能在短時間理解重點，不要只追求投影片數量。</p></aside><footer class="af-page-foot"><span>AI CONTENT &amp; COMMUNICATION / C05</span><span>16</span></footer></div>
