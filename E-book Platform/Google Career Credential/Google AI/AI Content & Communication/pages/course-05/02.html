<div class="af-page ga-v3"><div class="af-kicker"><span>COURSE 05 / MODULE 1</span><span>CONTENT CREATION</span></div><h1>圖片生成：把構圖交代清楚</h1><p class="af-deck">在指定主體以外，還要控制畫面留白、視覺焦點與文字位置。</p><figure class="ga-figure"><div class="ga-layout-example"><div class="ga-poster-frame" role="img" aria-label="4比5直式海報，標題與資訊位於左側，彩色幾何主體位於右側，彼此不重疊。"><div class="ga-poster-heading"><b>PROJECT<br>EXPO</b><small>標題留白區</small></div><svg viewBox="0 0 120 180" aria-hidden="true"><rect x="19" y="14" width="75" height="75" rx="16" fill="#4285f4"/><circle cx="78" cy="101" r="37" fill="#fbbc04"/><rect x="13" y="113" width="50" height="50" rx="12" fill="#34a853"/><circle cx="78" cy="101" r="15" fill="#fff"/></svg><div class="ga-poster-info"><b>日期／地點</b><small>正式資訊後加</small></div></div><div class="ga-layout-legend"><b>4:5直式</b><p>左側保留文字空間，右側集中主視覺。背景不干擾閱讀。</p><p>圖像素材不含正式日期與標誌。</p></div></div><figcaption>原創構圖示意；標題和資訊是排版佔位，不是實際活動資訊。</figcaption></figure><section class="af-section"><h2>把文字與畫面拆開</h2><p>先產生不含錯誤日期、標題與Logo的視覺素材，再用排版工具加入正式文字。參考圖可用來界定構圖或配色，但應說明保留哪些特徵，並確認素材權利。</p></section><blockquote class="af-prompt">生成一張4:5直式展覽插圖，右側是簡潔科技幾何主體，左上與左下留白供排版。不要生成文字或Logo。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>檢查裁切、可讀性、主體一致性及非預期元素。</p></aside><footer class="af-page-foot"><span>AI CONTENT &amp; COMMUNICATION / C05</span><span>14</span></footer></div>
