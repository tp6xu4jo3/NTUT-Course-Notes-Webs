<div class="af-page ga-v3"><div class="af-kicker"><span>COURSE 05 / MODULE 2</span><span>CONTENT CREATION</span></div><h1>讓同一份簡報適合不同受眾</h1><p class="af-deck">主管、客戶與技術團隊需要不同深度，但不應看到互相矛盾的事實。</p><figure class="ga-figure"><div class="ga-compare"><div><b>主管版</b><p>先呈現決策、效益、風險與需要核准的資源。</p></div><div><b>技術版</b><p>補上架構、方法、限制、測試與實作細節。</p></div></div><figcaption>改變層級與呈現順序，不改變已核對事實。</figcaption></figure><section class="af-section"><h2>以模組方式編輯</h2><p>把共同核心資訊放在主要頁面，技術細節移到附錄。若對象是客戶，說明使用效益及限制；若是同儕，增加方法與可重現步驟。只調整需要的投影片。</p></section><blockquote class="af-prompt">保留目前數據與結論，建立主管版和技術版簡報大綱；列出哪些內容移到附錄以及原因。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>正式匯出前檢查文字截斷、圖表單位、來源及投影片順序。</p></aside><footer class="af-page-foot"><span>AI CONTENT &amp; COMMUNICATION / C05</span><span>17</span></footer></div>
