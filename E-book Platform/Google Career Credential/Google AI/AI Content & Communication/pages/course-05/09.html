<div class="af-page ga-v3"><div class="af-kicker"><span>COURSE 05 / MODULE 3</span><span>CONTENT CREATION</span></div><h1>把設計回饋變成可實作修改</h1><p class="af-deck">有效的回饋要能讓設計者知道改哪裡、為什麼、完成條件是什麼。</p><figure class="ga-figure"><div class="ga-compare"><div><b>模糊</b><p>看起來不專業，版面有點亂。</p></div><div><b>可執行</b><p>標題與日期字級接近；將標題放大、日期移至下方，保留足夠間距。</p></div></div><figcaption>正反例是編輯設計示例。</figcaption></figure><section class="af-section"><h2>優先修正影響理解的問題</h2><p>先處理資訊錯誤、可讀性和層級，再處理配色和裝飾。回饋應尊重原設計目的，指出可驗收標準，不把個人偏好當成規則。若改動涉及風格，先保留關鍵元素。</p></section><blockquote class="af-prompt">把評論改成一份給設計同學的修改清單，依影響排序，每項包含位置、原因、建議及驗收條件。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>重新查看修改版本，確認修正沒有造成新的排版問題。</p></aside><footer class="af-page-foot"><span>AI CONTENT &amp; COMMUNICATION / C05</span><span>21</span></footer></div>
