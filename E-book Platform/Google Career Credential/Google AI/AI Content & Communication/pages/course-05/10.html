<div class="af-page ga-v3"><div class="af-kicker"><span>COURSE 05 / MODULE 3</span><span>CONTENT CREATION</span></div><h1>創作驗收與交付</h1><p class="af-deck">內容正式發布前，需同時驗證訊息、設計、權利及交付格式。</p><figure class="ga-figure"><div class="ga-grid"><div class="ga-cell"><b>事實</b><p>來源、文字、時間、數字</p></div><div class="ga-cell"><b>視覺</b><p>尺寸、對齊、裁切、色彩</p></div><div class="ga-cell"><b>權利</b><p>圖像、音訊、品牌與授權</p></div><div class="ga-cell"><b>交付</b><p>目標媒體、檔案、必要揭露</p></div></div><figcaption>原創交付檢核，不是官方固定流程。</figcaption></figure><section class="af-section"><h2>同一成果的不同媒體版本</h2><p>社群圖、簡報與影片有不同版面限制。不要直接縮放所有元素，應依目標畫面重新配置資訊，保留主訊息與必要資訊。匯出後以實際顯示尺寸檢視。</p></section><blockquote class="af-prompt">針對社群圖和簡報版各列驗收條件，檢查主訊息、文字可讀性、裁切和素材權利。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>若來源或權利未能確認，不應因作品已生成就直接發布。</p></aside><footer class="af-page-foot"><span>AI CONTENT &amp; COMMUNICATION / C05</span><span>22</span></footer></div>
