<div class="af-page ga-v3"><div class="af-kicker"><span>COURSE 04 / MODULE 1</span><span>WRITING AND COMMUNICATING</span></div><h1>從逐字稿提取可執行待辦</h1><p class="af-deck">好的會議摘要要區分討論、已決定事項、待辦與未決議題。</p><figure class="ga-figure"><div class="ga-rows"><div class="ga-row"><b>決議</b><p>下一版原型改為簡化介面</p></div><div class="ga-row"><b>待辦</b><p>小林：週五前完成測試清單</p></div><div class="ga-row"><b>未決</b><p>正式展示日期待老師確認</p></div><div class="ga-row"><b>來源</b><p>對應逐字稿時間或原句</p></div></div><figcaption>假設會議紀錄；未明確指定的人名或期限不可補造。</figcaption></figure><section class="af-section"><h2>轉換成行動清單</h2><p>先取得經授權的會議紀錄，再要求AI分類，而非單純壓縮逐字稿。可將待辦整理成任務、責任人、截止時間、依賴與待確認項目，交由與會者核對。</p></section><blockquote class="af-prompt">依逐字稿產出決議、待辦、未決議題表格。責任人或日期沒有明講就填待確認；附上可回查的位置。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>AI可能把提案當成決議。會議參與者應確認紀錄，保護不必要的個資。</p></aside><footer class="af-page-foot"><span>AI CONTENT &amp; COMMUNICATION / C04</span><span>04</span></footer></div>
