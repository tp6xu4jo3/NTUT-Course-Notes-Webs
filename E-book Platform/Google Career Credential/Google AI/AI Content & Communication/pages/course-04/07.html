<div class="af-page ga-v3"><div class="af-kicker"><span>COURSE 04 / MODULE 3</span><span>WRITING AND COMMUNICATING</span></div><h1>建立受眾化的溝通套件</h1><p class="af-deck">一份來源文件可以衍生多種訊息，但所有版本必須共用同一組事實。</p><figure class="ga-figure"><div class="ga-flow"><div class="ga-step"><b>來源文件</b><small>確認事實</small></div><span class="ga-arrow" aria-hidden="true">→</span><div class="ga-step"><b>利益關係人</b><small>辨識需求</small></div><span class="ga-arrow" aria-hidden="true">→</span><div class="ga-step"><b>核心訊息</b><small>按對象排序</small></div><span class="ga-arrow" aria-hidden="true">→</span><div class="ga-step"><b>輸出</b><small>郵件、簡報、FAQ</small></div></div><figcaption>核心事實不變，資訊深度、語氣與行動要求可不同。</figcaption></figure><section class="af-section"><h2>先擷取再生成</h2><p>從專案簡報或政策文件取出核心事實，整理對應受眾最關心的資訊，再建立每種輸出。不要一開始就讓AI生成多封郵件，否則容易讓各版本的日期、價格與條件不一致。</p></section><blockquote class="af-prompt">從附件提取已確認的日期、功能與限制；建立對老師、組員和參加者的訊息重點表，再分別草擬。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>發送前比對各版本的關鍵資訊及行動要求。</p></aside><footer class="af-page-foot"><span>AI CONTENT &amp; COMMUNICATION / C04</span><span>09</span></footer></div>
