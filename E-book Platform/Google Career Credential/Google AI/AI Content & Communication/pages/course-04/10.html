<div class="af-page ga-v3"><div class="af-kicker"><span>COURSE 04 / MODULE 4</span><span>WRITING AND COMMUNICATING</span></div><h1>課程檢核：同一訊息、不同表達</h1><p class="af-deck">將Course 04的摘要、角色回饋、文案與演練串成一套可驗收成果。</p><figure class="ga-figure"><div class="ga-grid"><div class="ga-cell"><b>輸入</b><p>已核對的會議紀錄</p></div><div class="ga-cell"><b>摘要</b><p>決議、待辦、未決</p></div><div class="ga-cell"><b>溝通</b><p>兩種受眾化版本</p></div><div class="ga-cell"><b>演練</b><p>處理可能的異議</p></div></div><figcaption>原創綜合練習。</figcaption></figure><section class="af-section"><h2>練習</h2><p>以一次專題會議為例，產生待辦表與給老師的進度郵件。請AI模擬一位持不同意見的老師，透過對話釐清弱點。最後只修改必要段落。</p></section><blockquote class="af-prompt">檢查這兩份訊息是否保留相同事實，且對應各自受眾；指出任何未經確認的新承諾。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>若摘要把「可能」變成「確定」，應先修正事實，再進行溝通。</p></aside><footer class="af-page-foot"><span>AI CONTENT &amp; COMMUNICATION / C04</span><span>12</span></footer></div>
