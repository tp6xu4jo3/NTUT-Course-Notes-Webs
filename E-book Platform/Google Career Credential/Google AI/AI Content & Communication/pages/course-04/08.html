<div class="af-page ga-v3"><div class="af-kicker"><span>COURSE 04 / MODULE 3</span><span>WRITING AND COMMUNICATING</span></div><h1>Canvas：把草稿與修改分開</h1><p class="af-deck">長文件適合局部編輯，而不是每次修改都重新生成整篇。</p><figure class="ga-figure"><div class="ga-wire"><div class="ga-wire-top"><span>編輯區</span><span>版本 B</span></div><div class="ga-wire-main"><div><b>保留區</b>專案名稱、截止日期、正式條件</div><div><b>選取區</b>只重寫第二段的語氣與結構</div><div><b>核對區</b>新舊版本差異</div><div><b>輸出</b>核准後才寄送</div></div></div><figcaption>概念介面示意，非產品截圖。</figcaption></figure><section class="af-section"><h2>局部修改的好處</h2><p>在支援Canvas的環境中，可以要求修改選定段落、調整文字長度或排版。若上下文沒有完整帶入編輯區，需重述目標受眾、已確認事實及限制。</p></section><blockquote class="af-prompt">只重寫第二段，對象為初次參與活動的學生，保留原日期、地點與資格條件；其餘段落不動。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>比對修改前後，避免其他段落被連帶改動。</p></aside><footer class="af-page-foot"><span>AI CONTENT &amp; COMMUNICATION / C04</span><span>10</span></footer></div>
