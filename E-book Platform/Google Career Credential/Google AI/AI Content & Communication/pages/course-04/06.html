<div class="af-page ga-v3"><div class="af-kicker"><span>COURSE 04 / MODULE 2</span><span>WRITING AND COMMUNICATING</span></div><h1>把回饋變成修訂決策</h1><p class="af-deck">讓AI提出修訂選項，你決定哪些值得採納。</p><figure class="ga-figure"><div class="ga-flow"><div class="ga-step"><b>回饋</b><small>指出問題位置</small></div><span class="ga-arrow" aria-hidden="true">→</span><div class="ga-step"><b>選擇</b><small>保留或採納</small></div><span class="ga-arrow" aria-hidden="true">→</span><div class="ga-step"><b>修改</b><small>處理特定段落</small></div><span class="ga-arrow" aria-hidden="true">→</span><div class="ga-step"><b>核對</b><small>原意、事實、語氣</small></div></div><figcaption>修改循環應保留可追蹤的決策。</figcaption></figure><section class="af-section"><h2>回饋報告</h2><p>教材示範讓AI以適合的角色審查文件，討論可能改法，再根據更新內容整理摘要。若建議彼此衝突，例如同時要求更詳細且字數不變，先設定優先級，再刪減不重要內容。</p></section><blockquote class="af-prompt">列出修改建議，分類為事實錯誤、結構、語氣或風格；每項提供原因。我確認後才改寫對應段落。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>不要自動接受所有編輯建議，尤其涉及事實與承諾。</p></aside><footer class="af-page-foot"><span>AI CONTENT &amp; COMMUNICATION / C04</span><span>08</span></footer></div>
