<div class="af-page ga-v4"><div class="af-kicker"><span>COURSE 07 / MODULE 2</span><span>APP BUILDING</span></div><h1>品牌素材工具：組合模型能力</h1><p class="af-deck">教材的Brand Builder示範將同一產品構想視覺化為多種素材。</p><figure class="ga-figure"><div class="ga-flow"><div class="ga-step"><b>產品描述</b><small>固定品牌資訊</small></div><span class="ga-arrow" aria-hidden="true">→</span><div class="ga-step"><b>生成素材</b><small>不同使用情境</small></div><span class="ga-arrow" aria-hidden="true">→</span><div class="ga-step"><b>畫廊</b><small>多種媒體預覽</small></div><span class="ga-arrow" aria-hidden="true">→</span><div class="ga-step"><b>驗收</b><small>一致性、文字、權利</small></div></div><figcaption>流程重點是跨輸出的一致性。</figcaption></figure><section class="af-section"><h2>多模型組合</h2><p>例如由文字模型整理產品設定，再由圖像模型生成各種廣告情境。不同模型的輸入輸出需明確銜接；若增加影片，應指定參考圖、時長與動作。重用同一份品牌設定，不讓每次生成自由改變產品。</p></section><blockquote class="af-prompt">建立產品視覺原型：先確認產品名稱、外觀、品牌色，再依固定設定生成海報、社群圖和看板構想。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>生成內容可能不一致；第三冊的視覺驗收規則仍適用。</p></aside><footer class="af-page-foot"><span>AI APP DEVELOPMENT / C07</span><span>07</span></footer></div>
