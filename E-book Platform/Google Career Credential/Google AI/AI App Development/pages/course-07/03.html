<div class="af-page ga-v4"><div class="af-kicker"><span>COURSE 07 / MODULE 2</span><span>APP BUILDING</span></div><h1>用輸入、處理、輸出描述App</h1><p class="af-deck">一句「做一個好用的工具」缺乏可執行需求；先定義資料流。</p><figure class="ga-figure"><div class="ga-flow"><div class="ga-step"><b>Input</b><small>會議紀錄文字</small></div><span class="ga-arrow" aria-hidden="true">→</span><div class="ga-step"><b>Process</b><small>提取任務、確認欄位</small></div><span class="ga-arrow" aria-hidden="true">→</span><div class="ga-step"><b>Output</b><small>可編輯待辦表</small></div></div><figcaption>輸入、處理與輸出（IPO）是編輯補充的需求框架。</figcaption></figure><section class="af-section"><h2>最小可用原型</h2><p>只做最重要的流程：貼上紀錄、產生待辦、人工確認、匯出。不要一開始加入帳號、複雜動畫與完整管理後台。指定缺少人名或期限時應標為待確認。</p></section><blockquote class="af-prompt">建立會議待辦App：輸入文字，輸出任務、負責人、期限、狀態四欄。缺漏欄位標待確認，提供編輯與複製表格功能。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>先用一筆已知輸入檢查輸出，確認核心功能後再擴充。</p></aside><footer class="af-page-foot"><span>AI APP DEVELOPMENT / C07</span><span>05</span></footer></div>
