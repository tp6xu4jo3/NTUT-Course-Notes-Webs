<div class="af-page ga-v4"><div class="af-kicker"><span>COURSE 07 / MODULE 3</span><span>APP BUILDING</span></div><h1>從工作流程挑選值得自動化的任務</h1><p class="af-deck">先畫出工作本身，再判斷App能不能真的減少負擔。</p><figure class="ga-figure"><div class="ga-grid"><div class="ga-cell"><b>重複性</b><p>任務是否定期出現？</p></div><div class="ga-cell"><b>穩定性</b><p>輸入與輸出是否可預期？</p></div><div class="ga-cell"><b>價值</b><p>能否節省時間或降低錯誤？</p></div><div class="ga-cell"><b>可控性</b><p>風險是否可接受並能驗收？</p></div></div><figcaption>工作流程評估為教材觀念的整理。</figcaption></figure><section class="af-section"><h2>以任務而非工具為起點</h2><p>例如每週整理專題紀錄包含收集、分類、確認及分派。將可重複的分類與格式化封裝，保留人員確認期限及責任人的步驟。若每次工作規則都不同，通用聊天可能更合適。</p></section><blockquote class="af-prompt">列出我每週重複的工作，依頻率、輸入輸出一致性、影響與驗證難度比較，提出一個最值得先做的工具。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>不要只因能做App就做App；確認實際節省成本。</p></aside><footer class="af-page-foot"><span>AI APP DEVELOPMENT / C07</span><span>10</span></footer></div>
