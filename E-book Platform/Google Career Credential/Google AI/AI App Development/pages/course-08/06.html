<div class="af-page ga-v4"><div class="af-kicker"><span>COURSE 08 / MODULE 1</span><span>APP DEPLOYMENT</span></div><h1>任務依賴、等待時間與工作日</h1><p class="af-deck">專案時程是明確規則問題，不能讓模型自由猜測日期。</p><figure class="ga-figure"><div class="ga-dependency" role="img" aria-label="任務A完成後等待核准3個工作日，再執行任務B。並行任務D可獨立進行，任務C需等待B和D完成。"><div class="ga-dep-main"><div><b>A</b><small>完成設計</small></div><span>↓</span><div class="ga-wait"><b>等待核准</b><small>3個工作日</small></div><span>↓</span><div><b>B</b><small>製作完成</small></div></div><div class="ga-dep-parallel"><div><b>D</b><small>設備準備<br>獨立並行</small></div></div><div class="ga-dep-join">B、D皆完成 ↓</div><div class="ga-dep-end"><b>C</b><small>開始驗收</small></div></div><figcaption>原創依賴示意：B與D是C的前置條件；D不依賴A。等待期不等於實際工時。</figcaption></figure><section class="af-section"><h2>用程式處理確定性邏輯</h2><p>假設任務B必須等A完成與核准等待期後才開始，A延遲可能影響B及C。若另一工作可並行，就不一定跟著延遲。編輯補充：需要明確定義日曆、工作日、持續時間與多前置任務的規則。</p></section><blockquote class="af-prompt">對此時程工具定義工作日、等待期與多前置任務規則，使用可重現的計算方法；缺少依賴資訊時顯示待確認。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>測試平日、週末、無依賴與多依賴案例；不可把預測日期當作已承諾日期。</p></aside><footer class="af-page-foot"><span>AI APP DEVELOPMENT / C08</span><span>18</span></footer></div>
