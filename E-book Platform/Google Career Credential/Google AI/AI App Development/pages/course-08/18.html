<div class="af-page ga-v4"><div class="af-kicker"><span>COURSE 08 / MODULE 3</span><span>APP DEPLOYMENT</span></div><h1>分享、發布與最小權限</h1><p class="af-deck">分享給特定人與發布到網路是不同風險等級的交付方式。</p><figure class="ga-figure"><div class="ga-compare"><div><b>Share｜限定對象</b><p>指定人員及角色；適合內部文件和小規模試用。</p></div><div><b>Publish｜公開</b><p>較廣泛的網路存取；須確認資料、成本、權限及安全條件。</p></div></div><figcaption>教材示範AI Studio分享與發布；實際平台設定需確認。</figcaption></figure><section class="af-section"><h2>不要只檢查是否能開啟</h2><p>編輯補充：前端隱藏資料並不是授權；API金鑰或私密設定不得放入公開前端程式，伺服器也須驗證使用者與權限。只授予必要角色，未授權使用者不能讀取資料或執行操作。</p></section><blockquote class="af-prompt">制定分享清單：使用者、允許動作、資料範圍及退出方式。檢查未登入或未獲授權的情境。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>不要將內部資料、敏感附件或密鑰直接發布。</p></aside><footer class="af-page-foot"><span>AI APP DEVELOPMENT / C08</span><span>30</span></footer></div>
