<div class="af-page ga-v4"><div class="af-kicker"><span>COURSE 08 / MODULE 2</span><span>APP DEPLOYMENT</span></div><h1>壓力測試：故意用錯方式操作</h1><p class="af-deck">正常輸入能成功，不代表App能承受真實使用中的例外。</p><figure class="ga-figure"><div class="ga-grid"><div class="ga-cell"><b>空值</b><p>未輸入內容就送出</p></div><div class="ga-cell"><b>格式</b><p>CSV欄位錯誤、日期無效</p></div><div class="ga-cell"><b>極端值</b><p>超長文字、大量資料</p></div><div class="ga-cell"><b>反常行為</b><p>快速連點、重複匯入、返回頁面</p></div></div><figcaption>壓力測試重點是找出例外與不合理狀態。</figcaption></figure><section class="af-section"><h2>區分壓力與邊界測試</h2><p>教材要求像困惑的新手那樣使用App。編輯補充：邊界測試檢查最小、最大及剛超界輸入；負載測試關注大量資料或請求時的行為。對需要付費呼叫的模型避免無限制測試。</p></section><blockquote class="af-prompt">建立測試表：空字串、重複欄位、無效日期、極大數值與連續點擊。每項定義安全回應與可恢復方式。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>錯誤應可理解且不破壞已輸入資料，不應出現假成功。</p></aside><footer class="af-page-foot"><span>AI APP DEVELOPMENT / C08</span><span>26</span></footer></div>
