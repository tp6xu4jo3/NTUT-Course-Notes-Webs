<div class="af-page ga-v4"><div class="af-kicker"><span>COURSE 08 / MODULE 3</span><span>APP DEPLOYMENT</span></div><h1>部署測試與小規模上線</h1><p class="af-deck">在擴大使用之前，先由一位目標使用者實際操作。</p><figure class="ga-figure"><div class="ga-flow"><div class="ga-step"><b>重新驗收</b><small>從頭完成工作</small></div><span class="ga-arrow" aria-hidden="true">→</span><div class="ga-step"><b>小規模分享</b><small>一位使用者</small></div><span class="ga-arrow" aria-hidden="true">→</span><div class="ga-step"><b>收集回饋</b><small>錯誤與困難</small></div><span class="ga-arrow" aria-hidden="true">→</span><div class="ga-step"><b>改善後擴大</b><small>核對權限與品質</small></div></div><figcaption>Soft launch：先縮小影響範圍。</figcaption></figure><section class="af-section"><h2>從使用者角度測試</h2><p>檢查首次開啟、資料匯入、正常與錯誤輸出、權限限制與完成後的下一步。讓一位同事自行使用，不在旁邊提供口頭提示，觀察哪個環節不清楚。</p></section><blockquote class="af-prompt">列出發布前測試與小規模試用任務，包含匿名／未授權存取、已知答案、手機畫面與錯誤回復。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>未通過的重要測試應阻止正式發布；不要將一位同事的成功當作全面安全驗證。</p></aside><footer class="af-page-foot"><span>AI APP DEVELOPMENT / C08</span><span>31</span></footer></div>
