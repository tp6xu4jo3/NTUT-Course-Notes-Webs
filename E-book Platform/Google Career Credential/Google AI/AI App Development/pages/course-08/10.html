<div class="af-page ga-v4"><div class="af-kicker"><span>COURSE 08 / MODULE 2</span><span>APP DEPLOYMENT</span></div><h1>定位Bug：一次縮小一個問題</h1><p class="af-deck">明確辨識重現步驟及故障所在，比反覆要求AI重做有效。</p><figure class="ga-figure"><div class="ga-flow"><div class="ga-step"><b>重現</b><small>相同輸入與操作</small></div><span class="ga-arrow" aria-hidden="true">→</span><div class="ga-step"><b>隔離</b><small>界面、資料、邏輯</small></div><span class="ga-arrow" aria-hidden="true">→</span><div class="ga-step"><b>修正</b><small>最小必要改動</small></div><span class="ga-arrow" aria-hidden="true">→</span><div class="ga-step"><b>重測</b><small>確認問題消失</small></div></div><figcaption>Debug循環：可重現問題優先。</figcaption></figure><section class="af-section"><h2>用實際結果取代模糊描述</h2><p>例如按下生成按鈕後沒有結果，先確認請求是否送出、是否有錯誤日誌、回應內容是否正確以及畫面是否更新。不要同時更換模型、改版面與重寫資料格式，否則難找原因。</p></section><blockquote class="af-prompt">重現步驟：匯入指定CSV，選A類，按生成。預期出現A類總計，實際為空白。請先指出可能原因及如何驗證，再進行最小修正。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>修正後用原測試及相關測試確認，不僅查看成功訊息。</p></aside><footer class="af-page-foot"><span>AI APP DEVELOPMENT / C08</span><span>22</span></footer></div>
