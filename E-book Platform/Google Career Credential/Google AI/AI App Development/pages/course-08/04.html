<div class="af-page ga-v4"><div class="af-kicker"><span>COURSE 08 / MODULE 1</span><span>APP DEPLOYMENT</span></div><h1>需求訪談：讓AI找出尚未回答的問題</h1><p class="af-deck">以第一冊的meta-prompting進行需求蒐集，重點是找出缺失的軟體行為。</p><figure class="ga-figure"><div class="ga-rows"><div class="ga-row"><b>輸入</b><p>空白、錯誤格式、重複資料怎麼辦？</p></div><div class="ga-row"><b>規則</b><p>同時有多個前置任務如何計算？</p></div><div class="ga-row"><b>權限</b><p>誰能新增、修改或查看？</p></div><div class="ga-row"><b>失敗</b><p>工具不可用時，應如何回報？</p></div></div><figcaption>需求訪談示例。</figcaption></figure><section class="af-section"><h2>在建置前消除歧義</h2><p>例如App要顯示專案延遲，模型不知道你是否採五天工作制、是否包含假日、是否允許同時進行多項工作。讓AI逐一詢問，你提供組織的實際規則。</p></section><blockquote class="af-prompt">在開始寫程式前，逐項訪問我，確認資料格式、工作日規則、任務依賴、例外和使用者權限。未確認的項目列為待定。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>不要假裝需求已經完整；明確標記待決事項。</p></aside><footer class="af-page-foot"><span>AI APP DEVELOPMENT / C08</span><span>16</span></footer></div>
