<div class="af-page ga-v4"><div class="af-kicker"><span>COURSE 08 / MODULE 2</span><span>APP DEPLOYMENT</span></div><h1>版本回復與回歸測試</h1><p class="af-deck">修改可能讓舊功能壞掉；每次可用版本都應有回復方式。</p><figure class="ga-figure"><div class="ga-flow"><div class="ga-step"><b>穩定版本</b><small>保存規格和可用成果</small></div><span class="ga-arrow" aria-hidden="true">→</span><div class="ga-step"><b>小幅修正</b><small>隔離改動</small></div><span class="ga-arrow" aria-hidden="true">→</span><div class="ga-step"><b>回歸測試</b><small>重跑既有案例</small></div><span class="ga-arrow" aria-hidden="true">→</span><div class="ga-step"><b>保留或回復</b><small>依結果決定</small></div></div><figcaption>版本管理與測試應搭配使用。</figcaption></figure><section class="af-section"><h2>避免用Prompt猜回舊版</h2><p>若工具提供版本紀錄，先保存可運作的版本；程式專案也可用版本控制記錄改動。若修正造成更多問題，回到已知穩定狀態再逐步定位，而非反覆要求模型恢復印象中的樣子。</p></section><blockquote class="af-prompt">修正前列出會修改的功能；保留上一版。修正後重新執行原本通過的匯入、篩選、計算及匯出案例。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>版本回復可能不會自動回復外部資料或設定；確認影響範圍。</p></aside><footer class="af-page-foot"><span>AI APP DEVELOPMENT / C08</span><span>27</span></footer></div>
