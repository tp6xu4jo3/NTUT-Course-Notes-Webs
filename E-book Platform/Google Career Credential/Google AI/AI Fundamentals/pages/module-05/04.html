<div class="af-page af-m5"><div class="af-kicker"><span>MODULE 05</span><span>ADVANCED PROMPTS</span></div><h1>從構想到視覺稿</h1><p class="af-deck">做圖片之前，先定義它要傳達的訊息，再安排主體、風格與構圖。</p><figure class="af-poster-demo"><div class="af-poster"><small>STUDENT PROJECT</small><strong>IDEAS<br>IN MOTION</strong><div class="af-orbit"><i></i><i></i><i></i></div><span>預留活動資訊區</span></div><figcaption>自製構圖示意：標題區、主視覺、留白、資訊區。</figcaption></figure><section class="af-section"><h2>實作順序</h2><p>先請AI發想三種視覺概念，再決定標題與色彩，最後選一個概念生成圖像。修改時指明要改的位置、光線、細節或風格，並說清楚哪些元素要保留。</p></section><blockquote class="af-prompt">製作一張學習活動海報的插圖。以藍、綠與白為主，主體在右側，左上保留大面積留白供文字排版；不產生任何活動日期或文字。</blockquote><aside class="af-note"><b>交付前</b><p>文字、標誌與日期要自行核對；若需要準確的版面文字，將文字與生成圖像分開排版通常更方便。</p></aside><footer class="af-page-foot"><span>AI FUNDAMENTALS / MODULE 5</span><span>18</span></footer></div>
