<div class="af-page af-m5"><div class="af-kicker"><span>MODULE 05</span><span>ADVANCED PROMPTS</span></div><h1>多模態AI｜超越文字</h1><p class="af-deck">模態（modality）指資料的形式，例如文字、影像、音訊或影片。</p><div class="af-modalities" role="img" aria-label="多模態模型接收文字、圖像、聲音，輸出文字或圖像"><div><span>文字</span><span>影像</span><span>音訊</span></div><b>→</b><strong>AI</strong><b>→</b><div><span>解讀</span><span>生成</span></div></div><section class="af-section"><h2>輸入的例子</h2><p>上傳一張去識別化的流程圖，再說明要AI檢查哪一部分；或提供一段經授權的逐字稿，請它整理議題與待辦。</p></section><section class="af-section"><h2>輸出的例子</h2><p>從文字構想生成插圖；也可以依參考圖的構圖或配色產生新的設計。不同模型支援的輸入與輸出形式不完全相同。</p></section><aside class="af-note"><b>多模態也會出錯</b><p>圖片中文字、圖表刻度、人物細節或空間關係可能辨識錯誤。涉及事實時，仍須回到原始資料核對。</p></aside><footer class="af-page-foot"><span>AI FUNDAMENTALS / MODULE 5</span><span>17</span></footer></div>
