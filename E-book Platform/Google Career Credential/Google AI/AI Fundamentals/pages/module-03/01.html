<div class="af-page af-m3"><div class="af-kicker"><span>MODULE 03</span><span>HOW AI WORKS</span></div><h1>AI、ML與生成式AI</h1><p class="af-deck">AI是廣泛的領域；機器學習是其中一種重要方法，生成式AI則是一類能生成內容的系統。</p><figure class="af-nesting" aria-label="概念關係：AI領域包含機器學習，許多生成式AI使用機器學習"><div class="af-outer">人工智慧 AI<div class="af-middle">機器學習 ML<div class="af-inner">許多生成式AI</div></div></div><figcaption>概念示意：不是所有AI都需要機器學習，也不是所有機器學習都用來生成內容。</figcaption></figure><section class="af-section"><h2>模型是什麼？</h2><p>模型是一種經過訓練的程式或數學結構。它學到資料中的規律，再將規律套用到新輸入。例如辨識垃圾郵件、預測需求，或產生一段文章。</p></section><section class="af-section"><h2>大型語言模型（LLM）</h2><p>LLM透過大量資料訓練，學習語言模式。生成文字時通常依前文預測後續的詞元（token）。文字流暢不代表每句都符合事實。</p></section><footer class="af-page-foot"><span>AI FUNDAMENTALS / MODULE 3</span><span>07</span></footer></div>
