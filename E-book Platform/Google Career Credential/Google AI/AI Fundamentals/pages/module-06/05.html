<div class="af-page af-m6"><div class="af-kicker"><span>MODULE 06</span><span>RESPONSIBLE AI</span></div><h1>把Agent關在合理的邊界內</h1><p class="af-deck">決定要委派多少工作時，先看錯誤的影響和動作能否撤回。</p><figure class="af-risk"><div class="af-axis">錯誤影響 ↑</div><div class="af-risk-grid"><div class="af-c2">高風險、可回復<br><small>重要文件草稿：人工核對</small></div><div class="af-c3">高風險、難回復<br><small>付款、公開發布：明確審核</small></div><div class="af-c1">低風險、可回復<br><small>整理公開資料、草擬文案</small></div><div class="af-c0">低風險、難回復<br><small>外部發送：仍需確認</small></div></div><figcaption>由左至右：動作愈難撤回。矩陣是思考工具，實際風險依情境而變。</figcaption></figure><blockquote class="af-prompt">讀取指定會議的空閒資訊，整理3個候選時間並草擬邀請。不要新增事件或寄出通知；有資訊缺漏就列出問題。</blockquote><aside class="af-note"><b>最小權限</b><p>只開放完成任務所需的讀取或寫入權限。清楚交代預算、操作範圍、完成條件與何時需要人工批准。</p></aside><footer class="af-page-foot"><span>AI FUNDAMENTALS / MODULE 6</span><span>23</span></footer></div>
