<div class="af-page af-m1"><div class="af-kicker"><span>MODULE 01</span><span>COLLABORATION</span></div><h1>從工具到合作夥伴</h1><p class="af-deck">AI最有價值的地方，是幫你把一個複雜問題想得更完整。</p><div class="af-flow" role="group" aria-label="流程圖"><div class="af-node af-c0"><b>目標</b><small>你定義問題</small></div><span class="af-arrow" aria-hidden="true">→</span><div class="af-node af-c1"><b>探索</b><small>AI提出選項</small></div><span class="af-arrow" aria-hidden="true">→</span><div class="af-node af-c2"><b>判斷</b><small>你檢驗取捨</small></div><span class="af-arrow" aria-hidden="true">→</span><div class="af-node af-c3"><b>行動</b><small>你決定方案</small></div></div><section class="af-section"><h2>一次性指令 vs. 持續合作</h2><p>只請AI代寫通知，省下的是寫字時間。若你的目標是提高某項活動的參與率，可以讓AI協助分析可能原因、提出策略、比較成本，再找出需要驗證的假設。每一步都由你提供脈絡與判斷。</p></section><aside class="af-note"><b>主導權在你</b><p>AI可以提出看似完整的解法，但它不了解所有現場限制。你需要決定什麼可以採用。</p></aside><footer class="af-page-foot"><span>AI FUNDAMENTALS / MODULE 1</span><span>03</span></footer></div>
