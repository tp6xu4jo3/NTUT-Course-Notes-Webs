<div class="af-page ga-v2"><div class="af-kicker"><span>COURSE 06 / MODULE 2</span><span>DATA ANALYSIS</span></div><h1>把非結構化資料整理成表格</h1><p class="af-deck">圖片、PDF或文字中的資料需轉成一致欄位，才能可靠分析。</p><figure class="ga-figure"><div class="ga-flow"><div class="ga-step"><b>原始資料</b><small>影像或文字</small></div><span class="ga-arrow" aria-hidden="true">→</span><div class="ga-step"><b>抽取欄位</b><small>日期、金額、分類</small></div><span class="ga-arrow" aria-hidden="true">→</span><div class="ga-step"><b>清理</b><small>型別、缺漏、重複</small></div><span class="ga-arrow" aria-hidden="true">→</span><div class="ga-step"><b>驗證</b><small>抽樣回查原文</small></div></div><figcaption>抽取只是第一步；清理與核對同樣重要。</figcaption></figure><section class="af-section"><h2>先設計欄位</h2><p>若擷取一張收據，要求輸出日期、品項、數量、單價與小計；數字不要混入幣別文字，無法讀取的值標記為空值。比對加總與原始總額，錯誤再回到原圖修正。</p></section><blockquote class="af-prompt">從這張已去識別化圖片擷取成表格，列出日期、項目、數量、單價；模糊數字標為待確認，不要猜測。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>避免重複列與錯誤日期，保留原始資料及清理紀錄。</p></aside><footer class="af-page-foot"><span>AI STRATEGY &amp; ANALYSIS / C06</span><span>21</span></footer></div>
