<div class="af-page ga-v2"><div class="af-kicker"><span>COURSE 06 / MODULE 1</span><span>DATA ANALYSIS</span></div><h1>指標定義與分母決定答案</h1><p class="af-deck">同一批資料只要分母不同，數字代表的意思就可能不同。</p><figure class="ga-figure"><div class="ga-rows"><div class="ga-row"><b>到場率</b><p>實到80人 ÷ 報名100人 = 80%</p></div><div class="ga-row"><b>容量使用率</b><p>實到80人 ÷ 場地容量120人 ≈ 66.7%</p></div><div class="ga-row"><b>每人次成本</b><p>總支出4,000元 ÷ 實到80人 = 50元</p></div><div class="ga-row"><b>比較條件</b><p>相同期間、對象及統計口徑</p></div></div><figcaption>編輯補充：以上是假設活動數據，不是官方案例或真實統計。</figcaption></figure><section class="af-section"><h2>先向主管確認要回答什麼</h2><p>同樣是80人，若上一場只有60人，可能代表成長；若場地原本預期滿座，則仍有改善空間。比較前先確認報名和實到人數是否重複、期間是否一致。</p></section><blockquote class="af-prompt">依指定目標建立指標字典，列出名稱、公式、單位、來源、排除條件與更新頻率。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>比率的分母為0時，不要強制算成0%；應標為不適用或待查。</p></aside><footer class="af-page-foot"><span>AI STRATEGY &amp; ANALYSIS / C06</span><span>20</span></footer></div>
