<div class="af-page ga-v2"><div class="af-kicker"><span>COURSE 06 / MODULE 2</span><span>DATA ANALYSIS</span></div><h1>AI()函數：把文字變成可分析分類</h1><p class="af-deck">在支援的Google Sheets環境，可用自然語言要求AI逐列分類。</p><figure class="ga-figure"><div class="ga-rows"><div class="ga-row"><b>B2</b><p>報名流程很清楚，速度也快</p></div><div class="ga-row"><b>分類結果</b><p>正面</p></div><div class="ga-row"><b>B3</b><p>找不到活動日期</p></div><div class="ga-row"><b>分類結果</b><p>負面</p></div></div><figcaption>假設分類示例；實際結果要抽樣複核。</figcaption></figure><section class="af-section"><h2>AI分類與確定性公式</h2><p>教材示範使用=AI()標註文字。它適合語意分類，不適合取代SUM、COUNTIF等可重現的計算。將允許分類固定為正面、中立、負面或待人工判斷。</p></section><blockquote class="af-prompt">=AI(&quot;將這則回饋分類為正面、中立、負面或待確認，只回傳類別&quot;, B2)</blockquote><aside class="af-note"><b>檢核與提醒</b><p>功能可用性依帳號與版本；若同一列反覆分類不一致，調整規則並人工檢查。</p></aside><footer class="af-page-foot"><span>AI STRATEGY &amp; ANALYSIS / C06</span><span>22</span></footer></div>
