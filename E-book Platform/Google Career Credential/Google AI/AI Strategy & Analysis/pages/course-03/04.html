<div class="af-page ga-v2"><div class="af-kicker"><span>COURSE 03 / MODULE 1</span><span>RESEARCH AND INSIGHTS</span></div><h1>讓研究報告變成可讀的資訊圖</h1><p class="af-deck">圖像是研究結論的呈現方式，不是證據本身。</p><figure class="ga-figure"><div class="ga-rows"><div class="ga-row"><b>標題</b><p>明確指出圖想回答的問題</p></div><div class="ga-row"><b>證據</b><p>保留數字、單位、時間與基準</p></div><div class="ga-row"><b>視覺</b><p>比較用長條、變化用折線、流程用箭頭</p></div><div class="ga-row"><b>註記</b><p>來源、假設及缺少資料的位置</p></div></div><figcaption>資料圖應與原始報告一致。</figcaption></figure><section class="af-section"><h2>先核對，再視覺化</h2><p>教材示範將研究報告轉成資訊圖。先抽出真正有證據的重點，再安排視覺層級。若只有定性訪談，就使用分類、流程或引述摘要，不要捏造百分比。第三冊會深入視覺設計。</p></section><blockquote class="af-prompt">根據已驗證的報告，規劃一張資訊圖：只用原報告數值，保留單位、來源和限制；沒有數字的發現使用文字卡。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>AI生成圖內的數字、拼字、刻度和來源需逐一檢查。</p></aside><footer class="af-page-foot"><span>AI STRATEGY &amp; ANALYSIS / C03</span><span>14</span></footer></div>
