
          <div class="h-full flex flex-col justify-between">

                <span class="text-xs font-bold tracking-wider text-teal-700">UNIT 03 · 3D 視覺幾何（整合 L5–L7）</span>
                <span class="text-xs font-mono-code text-slate-400">P. 11</span>

              <h2 class="font-serif-tc text-xl sm:text-2xl font-bold text-slate-900 mb-2">
                針孔相機投影與「比薩斜塔錯位照」之謎
              </h2>

              <p class="mag-body mb-2.5">
                相機拍下的照片是平面的 2D 像素 <code class="font-mono-code text-xs bg-slate-200 px-1 rounded">(u, v)</code>，但機械臂必須知道物體在 3D 空間中的真實座標 <code class="font-mono-code text-xs bg-slate-200 px-1 rounded">(X, Y, Z)</code> 才能伸手去抓。這中間的橋樑就是<strong>針孔相機模型（Pinhole Camera Model）</strong>：先透過<strong>外參矩陣 [R|t]</strong> 把世界座標轉到相機視角，再透過<strong>內參矩陣 K</strong>（焦距與光心）投影成像素。
              </p>

              <!-- SVG Pinhole Camera & Back-Projection + Leaning Tower Ill-Posed Diagram -->
              <div class="bg-white border border-slate-200 rounded-xl p-3 shadow-sm mb-2.5">
                <svg viewBox="0 0 460 215" class="w-full h-auto">
                  <!-- Top Half: Pinhole Camera Projection -->
                  <text x="10" y="16" font-size="10.5" font-weight="bold" fill="#0F766E">📐 針孔投影與深度反投影（Back-Projection）</text>

                  <!-- Image Plane -->
                  <rect x="65" y="34" width="12" height="72" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.5"/>
                  <text x="42" y="118" font-size="9" fill="#0F766E">2D 像素 (u,v)</text>

                  <!-- Optical Center -->
                  <circle cx="135" cy="70" r="4" fill="#0F172A"/>
                  <text x="115" y="86" font-size="9" fill="#475569">光心 O</text>

                  <!-- Optical Axis -->
                  <line x1="45" y1="70" x2="310" y2="70" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 3"/>

                  <!-- 3D World Point -->
                  <circle cx="285" cy="36" r="5.5" fill="#EA580C"/>
                  <text x="255" y="27" font-size="9.5" font-weight="bold" fill="#C2410C">3D 點 P(Xw,Yw,Zw)</text>

                  <!-- Projection Ray -->
                  <line x1="71" y1="86" x2="285" y2="36" stroke="#EA580C" stroke-width="1.8"/>
                  <circle cx="71" cy="86" r="3" fill="#EA580C"/>

                  <!-- Formula Box -->
                  <rect x="315" y="28" width="138" height="76" rx="7" fill="#F0FDFA" stroke="#5EEAD4"/>
                  <text x="323" y="45" font-size="9.5" font-weight="bold" fill="#0F766E">已知深度 Z 反推 3D：</text>
                  <text x="323" y="64" font-size="10" font-weight="bold" fill="#1E293B" font-family="JetBrains Mono">P_cam = Z · K⁻¹ p</text>
                  <text x="323" y="81" font-size="8.5" fill="#475569">少了深度 Z，一條射線上</text>
                  <text x="323" y="93" font-size="8.5" fill="#475569">有無窮多個可能的 3D 點！</text>

                  <!-- Divider -->
                  <line x1="10" y1="126" x2="450" y2="126" stroke="#E2E8F0" stroke-width="1.5"/>

                  <!-- Bottom Half: Leaning Tower of Pisa Ill-Posed Problem -->
                  <text x="10" y="143" font-size="10.5" font-weight="bold" fill="#B45309">🗼 為什麼單眼估測深度是「病態問題（Ill-Posed）」？</text>

                  <!-- Camera Eye -->
                  <polygon points="22,178 44,166 44,190" fill="#1E293B"/>
                  <!-- Ray Cone -->
                  <line x1="44" y1="178" x2="275" y2="148" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3 2"/>
                  <line x1="44" y1="178" x2="275" y2="205" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3 2"/>

                  <!-- Near Hand -->
                  <rect x="108" y="170" width="10" height="18" rx="3" fill="#F97316"/>
                  <text x="90" y="202" font-size="8.5" font-weight="bold" fill="#C2410C">近處小手指</text>

                  <!-- Far Tower -->
                  <rect x="242" y="152" width="22" height="50" rx="2" fill="#94A3B8" stroke="#475569"/>
                  <text x="225" y="212" font-size="8.5" font-weight="bold" fill="#334155">遠處巨大比薩斜塔</text>

                  <text x="290" y="172" font-size="9.5" fill="#1E293B">在 2D 照片上佔據</text>
                  <text x="290" y="186" font-size="9.5" font-weight="bold" fill="#B45309">完全相同的像素高度！</text>
                  <text x="290" y="200" font-size="8.5" fill="#475569">單靠一張圖無法區分大小與遠近</text>
                </svg>
              </div>
            </div>

            <div class="bg-teal-900 text-teal-50 rounded-xl p-3 text-xs leading-relaxed">
              <strong class="text-amber-300">💡 一句話看懂投影本質：</strong>
              相機拍照是把 3D 世界「壓扁」成 2D 平面，過程中唯獨丟失了<strong>深度 Z</strong>。只要能找回每個像素的 Z 值，就能用 <code class="font-mono-code text-teal-200">Z · K⁻¹p</code> 瞬間還原整座立體世界！
            </div>
