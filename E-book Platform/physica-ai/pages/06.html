<article class="h-full flex flex-col"><header class="flex items-center justify-between border-b-2 pb-1.5 mb-3" style="border-color:#1D4ED8"><span class="text-xs font-bold tracking-wider" style="color:#1D4ED8">UNIT 01 · 需求與工作流程（L2）</span><span class="text-xs font-mono-code text-slate-400">P. 06</span></header><h2 class="font-serif-tc text-xl sm:text-2xl font-bold text-slate-900 leading-snug mb-3">如何選擇機器人要解決的任務？</h2><div class="space-y-2"><p class="mag-body mb-2.5">照護與物流案例的重點在工作流程：搬運、取物或自助進食是否真的減少使用者負擔？機器人若需要人員頻繁救援，可能只是轉移工作。</p><div class="overflow-x-auto"><table class="w-full text-xs border-collapse my-2"><thead><tr><th class="text-left bg-slate-100 border border-slate-200 p-2">需求</th><th class="text-left bg-slate-100 border border-slate-200 p-2">可衡量指標</th></tr></thead><tbody><tr><td class="align-top border border-slate-200 p-2">自主取物</td><td class="align-top border border-slate-200 p-2">任務成功率、使用者操作步驟</td></tr><tr><td class="align-top border border-slate-200 p-2">醫院搬運</td><td class="align-top border border-slate-200 p-2">完成時間、人工介入次數、通道安全</td></tr><tr><td class="align-top border border-slate-200 p-2">家庭或照護</td><td class="align-top border border-slate-200 p-2">可接近範圍、碰撞風險、使用者控制權</td></tr></tbody></table></div><div class="bg-slate-900 text-slate-100 rounded-xl p-3 mt-2"><h3 class="text-xs font-bold text-amber-300 mb-1">評估方法</h3><p class="text-xs leading-relaxed">先定義使用者、工作環境、任務與不可接受的失敗，再選擇機械結構、感測器及控制方式。</p></div></div></article>
