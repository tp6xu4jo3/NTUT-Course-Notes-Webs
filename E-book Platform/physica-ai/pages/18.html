<article class="h-full flex flex-col"><header class="flex items-center justify-between border-b-2 pb-1.5 mb-3" style="border-color:#4F46E5"><span class="text-xs font-bold tracking-wider" style="color:#4F46E5">UNIT 04 · 軌跡與控制（L8）</span><span class="text-xs font-mono-code text-slate-400">P. 18</span></header><h2 class="font-serif-tc text-xl sm:text-2xl font-bold text-slate-900 leading-snug mb-3">從可通行路徑到可執行運動</h2><div class="space-y-2"><p class="mag-body mb-2.5">規劃出不碰撞的幾何路徑後，還要安排速度、加速度與時間。車輛或機械臂不能瞬間轉向或跳到另一個構型。</p><div class="font-mono-code text-sm text-center bg-slate-100 rounded-lg p-2.5 my-2 break-words">min J = w₁C<sub>安全</sub> + w₂C<sub>平順</sub> + w₃C<sub>時間</sub></div><div class="grid grid-cols-1 sm:grid-cols-2 gap-2 my-2"><div class="bg-white border border-slate-200 rounded-lg p-2.5"><h3 class="text-xs font-bold text-slate-800 mb-1">碰撞</h3><p class="text-xs leading-relaxed text-slate-700">沿途每個構型皆需保留安全距離。</p></div><div class="bg-white border border-slate-200 rounded-lg p-2.5"><h3 class="text-xs font-bold text-slate-800 mb-1">運動學</h3><p class="text-xs leading-relaxed text-slate-700">滿足轉向角、關節角度與可達範圍。</p></div><div class="bg-white border border-slate-200 rounded-lg p-2.5"><h3 class="text-xs font-bold text-slate-800 mb-1">動力學</h3><p class="text-xs leading-relaxed text-slate-700">速度、加速度、扭力不得超過設備能力。</p></div><div class="bg-white border border-slate-200 rounded-lg p-2.5"><h3 class="text-xs font-bold text-slate-800 mb-1">控制</h3><p class="text-xs leading-relaxed text-slate-700">利用感測回饋調整軌跡，避免跟蹤偏差。</p></div></div><div class="bg-slate-900 text-slate-100 rounded-xl p-3 mt-2"><h3 class="text-xs font-bold text-amber-300 mb-1">與操控的連結</h3><p class="text-xs leading-relaxed">手臂終點可達，不代表整段移動安全。第七單元會用抓取任務解釋三重可行性。</p></div></div></article>
