<article class="h-full flex flex-col"><header class="flex items-center justify-between border-b-2 pb-1.5 mb-3" style="border-color:#7C3AED"><span class="text-xs font-bold tracking-wider" style="color:#7C3AED">UNIT 07 · 四大座標系（L12）</span><span class="text-xs font-mono-code text-slate-400">P. 29</span></header><h2 class="font-serif-tc text-xl sm:text-2xl font-bold text-slate-900 leading-snug mb-3">相機看見的點，如何交給手臂？</h2><div class="space-y-2"><p class="mag-body mb-2.5">機械手臂基座B、相機C、物件O與夾爪G各有自己的座標系。本刊使用 ᵃTᵦ 表示將B座標中的點轉換到A座標（亦即B座標系在A中的姿態）。</p><figure class="bg-white border border-slate-200 rounded-xl p-2 my-2"><svg viewBox="0 0 440 160" class="w-full h-auto" role="img" aria-label="四個座標系的關係"><g fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"><rect x="10" y="12" width="105" height="45" rx="6"/><rect x="165" y="12" width="105" height="45" rx="6"/><rect x="320" y="12" width="105" height="45" rx="6"/><rect x="165" y="110" width="105" height="40" rx="6"/></g><g font-size="12" text-anchor="middle" fill="#334155"><text x="62" y="31">B 基座</text><text x="62" y="45">控制基準</text><text x="217" y="31">C 相機</text><text x="217" y="45">觀測基準</text><text x="372" y="31">O 物件</text><text x="372" y="45">物件基準</text><text x="217" y="134">G 夾爪</text></g><g stroke="#0D9488" fill="none" stroke-width="2"><path d="M115 35h50M270 35h50M372 57v71H270M62 57v71H165"/></g><g fill="#0D9488" font-size="10"><text x="122" y="26">校準</text><text x="278" y="26">估計</text><text x="285" y="119">相對抓取</text><text x="76" y="119">目標姿態</text></g></svg><figcaption class="text-[11px] text-slate-500 text-center">四個座標系的關係（示意圖）</figcaption></figure><div class="overflow-x-auto"><table class="w-full text-xs border-collapse my-2"><thead><tr><th class="text-left bg-slate-100 border border-slate-200 p-2">變換</th><th class="text-left bg-slate-100 border border-slate-200 p-2">來源</th></tr></thead><tbody><tr><td class="align-top border border-slate-200 p-2">ᴮTᴄ</td><td class="align-top border border-slate-200 p-2">手眼校準或相機外參與正運動學</td></tr><tr><td class="align-top border border-slate-200 p-2">ᶜTᴏ</td><td class="align-top border border-slate-200 p-2">相機觀測的物件姿態估計</td></tr><tr><td class="align-top border border-slate-200 p-2">ᴼTɢ</td><td class="align-top border border-slate-200 p-2">相對物件的抓取候選</td></tr><tr><td class="align-top border border-slate-200 p-2">ᴮTɢ</td><td class="align-top border border-slate-200 p-2">供逆運動學求解的目標姿態</td></tr></tbody></table></div><div class="bg-slate-900 text-slate-100 rounded-xl p-3 mt-2"><h3 class="text-xs font-bold text-amber-300 mb-1">座標約定</h3><p class="text-xs leading-relaxed">若已知反方向的矩陣，要先取逆。眼在手上的相機會隨關節運動，需依當前構型更新基座到相機的變換。</p></div><p class="text-[11px] text-slate-500 mt-2">課程來源：<a class="underline" href="https://docs.google.com/document/d/1yg6q3MnkFNLyNEujEtNEDg-xp4bIosLthd8CjEkEXgs/edit" target="_blank" rel="noopener noreferrer">Lecture 12 講義</a>、<a class="underline" href="https://drive.google.com/file/d/1Xk47MRAxE3eSK0DlKbj4TOrOI6gweHWX/view" target="_blank" rel="noopener noreferrer">逐字稿 Part 1</a>、<a class="underline" href="https://drive.google.com/file/d/1lRt0Knt3tl-0dSu0_XpHauuE4tbwMgRn/view" target="_blank" rel="noopener noreferrer">Part 2</a></p></div></article>
