<article class="h-full flex flex-col"><header class="flex items-center justify-between border-b-2 pb-1.5 mb-3" style="border-color:#0D9488"><span class="text-xs font-bold tracking-wider" style="color:#0D9488">UNIT 03 · 幾何感知（L5、L6）</span><span class="text-xs font-mono-code text-slate-400">P. 22</span></header><h2 class="font-serif-tc text-xl sm:text-2xl font-bold text-slate-900 leading-snug mb-3">三角測量與Bundle Adjustment</h2><p class="mag-body mb-2">同一空間點在兩個不同視角的像素對應到兩條投影射線。利用已知相機姿態與內參，估計兩射線最接近的3D點。</p><figure class="bg-white border border-slate-200 rounded-xl p-2"><svg viewBox="0 0 420 130" class="w-full h-auto" role="img" aria-label="兩個相機觀測同一三維點"><g stroke="#0D9488" stroke-width="2" fill="none"><path d="M65 108L211 19M350 108L211 19M65 108H350" stroke-dasharray="5 3"/><path d="M93 73l20 30M305 73l-20 30"/></g><g fill="#0D9488"><circle cx="65" cy="108" r="5"/><circle cx="350" cy="108" r="5"/><circle cx="211" cy="19" r="6"/></g><g font-size="11" fill="#334155"><text x="40" y="123">相機1</text><text x="326" y="123">相機2</text><text x="220" y="18">3D點</text><text x="165" y="122">基線</text></g></svg></figure><p class="mag-body mb-2">BA聯合調整相機位姿與3D點，使估計投影位置與觀測位置一致。</p><div class="font-mono-code text-xs sm:text-sm bg-slate-100 text-slate-800 rounded-lg p-2.5 my-2 text-center break-words">min Σᵢⱼ ‖uᵢⱼ − π(Kᵢ,Rᵢ,tᵢ,Xⱼ)‖²</div><div class="bg-slate-900 text-white rounded-xl p-3 mt-2"><h3 class="font-bold text-xs text-amber-300 mb-1">重建流程</h3><p class="text-xs leading-relaxed">影像特徵→配對→相機相對姿態→三角測量→BA→稠密重建。COLMAP等工具實作此類管線；重投影誤差小仍不代表物理尺度或障礙邊界一定正確。</p></div><p class="text-[10px] text-slate-500 mt-2">課程來源：<a class="underline" href="https://docs.google.com/document/d/1iIrN8jwDsmTj-GKK7gl27mSPS7xUFqR9IcrzVu5Og1w/edit" target="_blank" rel="noopener noreferrer">Lecture 5</a> · <a class="underline" href="https://docs.google.com/document/d/1dXK_AlG3WC9sUXx7h2d2hvXTjo-cydc2NZb1vFq8Kpc/edit" target="_blank" rel="noopener noreferrer">Lecture 6</a></p></article>
