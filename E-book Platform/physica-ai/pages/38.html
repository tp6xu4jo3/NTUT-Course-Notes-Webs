<article class="h-full flex flex-col"><header class="flex items-center justify-between border-b-2 pb-1.5 mb-3" style="border-color:#DC2626"><span class="text-xs font-bold tracking-wider" style="color:#DC2626">UNIT 05 · 安全工程（L9、L11）</span><span class="text-xs font-mono-code text-slate-400">P. 38</span></header><h2 class="font-serif-tc text-xl sm:text-2xl font-bold text-slate-900 leading-snug mb-3">安全邊界與根因分析：知道失敗還不夠</h2><p class="mag-body mb-2">測試輸出應記錄參數、隨機種子、軌跡、模組輸出、時間戳與結果。把Pass/Fail映射到邏輯場景參數空間，觀察由安全轉為失敗的邊界。</p><figure class="bg-white border border-slate-200 rounded-xl p-2"><svg viewBox="0 0 420 142" class="w-full h-auto" role="img" aria-label="示意安全邊界圖"><g stroke="#94A3B8"><path d="M37 14v100h360" fill="none"/></g><circle cx="57" cy="28" r="4" fill="#0D9488"/><circle cx="93" cy="28" r="4" fill="#0D9488"/><circle cx="129" cy="28" r="4" fill="#0D9488"/><circle cx="165" cy="28" r="4" fill="#0D9488"/><circle cx="201" cy="28" r="4" fill="#0D9488"/><circle cx="237" cy="28" r="4" fill="#0D9488"/><circle cx="273" cy="28" r="4" fill="#0D9488"/><circle cx="309" cy="28" r="4" fill="#0D9488"/><circle cx="345" cy="28" r="4" fill="#DC2626"/><circle cx="57" cy="46" r="4" fill="#0D9488"/><circle cx="93" cy="46" r="4" fill="#0D9488"/><circle cx="129" cy="46" r="4" fill="#0D9488"/><circle cx="165" cy="46" r="4" fill="#0D9488"/><circle cx="201" cy="46" r="4" fill="#0D9488"/><circle cx="237" cy="46" r="4" fill="#0D9488"/><circle cx="273" cy="46" r="4" fill="#0D9488"/><circle cx="309" cy="46" r="4" fill="#DC2626"/><circle cx="345" cy="46" r="4" fill="#DC2626"/><circle cx="57" cy="64" r="4" fill="#0D9488"/><circle cx="93" cy="64" r="4" fill="#0D9488"/><circle cx="129" cy="64" r="4" fill="#0D9488"/><circle cx="165" cy="64" r="4" fill="#0D9488"/><circle cx="201" cy="64" r="4" fill="#0D9488"/><circle cx="237" cy="64" r="4" fill="#0D9488"/><circle cx="273" cy="64" r="4" fill="#DC2626"/><circle cx="309" cy="64" r="4" fill="#DC2626"/><circle cx="345" cy="64" r="4" fill="#DC2626"/><circle cx="57" cy="82" r="4" fill="#0D9488"/><circle cx="93" cy="82" r="4" fill="#0D9488"/><circle cx="129" cy="82" r="4" fill="#0D9488"/><circle cx="165" cy="82" r="4" fill="#0D9488"/><circle cx="201" cy="82" r="4" fill="#0D9488"/><circle cx="237" cy="82" r="4" fill="#DC2626"/><circle cx="273" cy="82" r="4" fill="#DC2626"/><circle cx="309" cy="82" r="4" fill="#DC2626"/><circle cx="345" cy="82" r="4" fill="#DC2626"/><circle cx="57" cy="100" r="4" fill="#0D9488"/><circle cx="93" cy="100" r="4" fill="#0D9488"/><circle cx="129" cy="100" r="4" fill="#0D9488"/><circle cx="165" cy="100" r="4" fill="#0D9488"/><circle cx="201" cy="100" r="4" fill="#DC2626"/><circle cx="237" cy="100" r="4" fill="#DC2626"/><circle cx="273" cy="100" r="4" fill="#DC2626"/><circle cx="309" cy="100" r="4" fill="#DC2626"/><circle cx="345" cy="100" r="4" fill="#DC2626"/><path d="M185 113L365 14" stroke="#475569" stroke-dasharray="5 4" fill="none"/><g font-size="10" fill="#334155"><text x="5" y="12">速度</text><text x="335" y="133">切入角</text><text x="56" y="132">綠：通過　紅：失敗（假設資料）</text></g></svg></figure><section class="bg-white rounded-xl border border-slate-200 p-3 mb-2"><h3 class="text-sm font-bold text-slate-800 mb-1">診斷步驟</h3><div class="flex flex-wrap gap-1.5 items-center justify-center my-3 text-xs"><span class="rounded-md border bg-white p-2 font-bold" style="color:#DC2626;border-color:#DC2626">重播失敗</span><span class="text-slate-400">→</span><span class="rounded-md border bg-white p-2 font-bold" style="color:#DC2626;border-color:#DC2626">檢查時間同步</span><span class="text-slate-400">→</span><span class="rounded-md border bg-white p-2 font-bold" style="color:#DC2626;border-color:#DC2626">定位異常模組</span><span class="text-slate-400">→</span><span class="rounded-md border bg-white p-2 font-bold" style="color:#DC2626;border-color:#DC2626">控制變因重測</span><span class="text-slate-400">→</span><span class="rounded-md border bg-white p-2 font-bold" style="color:#DC2626;border-color:#DC2626">修正及迴歸測試</span></div><p class="mag-body mb-2">例如先用理想感知輸出替換原感知，保持其他參數不變，觀察規劃是否恢復；有助區分感知與下游問題，但不等同自動證明根因。</p></section><div class="bg-slate-900 text-white rounded-xl p-3 mt-2"><h3 class="font-bold text-xs text-amber-300 mb-1">驗證限制</h3><p class="text-xs leading-relaxed">場景抽樣有分布偏差；模擬器與實際物理不一致；高維長尾無法窮盡。實地測試及獨立驗證仍必要。</p></div><p class="text-[10px] text-slate-500 mt-2">課程來源：<a class="underline" href="https://docs.google.com/document/d/1FNVlCIgqz801V2y3ekhr9On21xJNjkWx3pzPiNZHy7c/edit" target="_blank" rel="noopener noreferrer">Lecture 9</a> · <a class="underline" href="https://docs.google.com/document/d/1uPwxamBLbYaPBTRE3V962CK6ypurrywoUV1vAEY8C9Q/edit" target="_blank" rel="noopener noreferrer">Lecture 11</a></p></article>
