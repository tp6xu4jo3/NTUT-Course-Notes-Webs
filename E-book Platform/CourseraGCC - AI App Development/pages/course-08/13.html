<div class="af-page ga-v4"><div class="af-kicker"><span>COURSE 08 / MODULE 2</span><span>APP DEPLOYMENT</span></div><h1>持久規則：讓分鏡符合要求</h1><p class="af-deck">一個結果修好不代表下一次生成也正確；應把要求加入可重複的規則。</p><figure class="ga-figure"><div class="ga-rows"><div class="ga-row"><b>輸入</b><p>廣告概念</p></div><div class="ga-row"><b>生成</b><p>分鏡：畫面、聲音、時長</p></div><div class="ga-row"><b>檢查</b><p>每段時長、品牌規則、CTA</p></div><div class="ga-row"><b>不合格</b><p>修正或阻止匯出並提示</p></div></div><figcaption>教材以影片分鏡工具示範控制指令。</figcaption></figure><section class="af-section"><h2>Guardrail與驗收</h2><p>例如指定最後一段必須有CTA（呼籲行動），每個鏡頭時長應符合團隊規範。由模型產生分鏡後，程式可檢查必要欄位與總時長；語意或品牌一致性仍需人工審查。</p></section><blockquote class="af-prompt">每份分鏡最後一段必須包含CTA；匯出前檢查時長與必填欄位，若未通過，顯示原因並要求修正。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>控制指令不是安全保證；確定性條件應由程式實際檢查。</p></aside><footer class="af-page-foot"><span>AI APP DEVELOPMENT / C08</span><span>25</span></footer></div>
