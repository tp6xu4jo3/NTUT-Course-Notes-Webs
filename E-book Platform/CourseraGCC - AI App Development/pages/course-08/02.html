<div class="af-page ga-v4"><div class="af-kicker"><span>COURSE 08 / MODULE 1</span><span>APP DEPLOYMENT</span></div><h1>規格文件：把想法變成可驗收約定</h1><p class="af-deck">Spec doc說明誰要用、要做什麼、資料怎麼進出、哪些規則必須遵守。</p><figure class="ga-figure"><div class="ga-rows"><div class="ga-row"><b>目的與使用者</b><p>協助組員掌握工作延遲的影響</p></div><div class="ga-row"><b>功能</b><p>讀入任務、顯示依賴、調整延遲</p></div><div class="ga-row"><b>規則</b><p>不得把等待期算成人工工時</p></div><div class="ga-row"><b>驗收</b><p>改動前置任務後，受影響任務依規則更新</p></div></div><figcaption>規格文件示例。</figcaption></figure><section class="af-section"><h2>以行為描述功能</h2><p>將「看起來專業」改成可測試的要求：表格有任務、期限、狀態、前置任務；點擊某任務能看出後續影響。將必要功能與未來想法分開，減少一次生成不必要的功能。</p></section><blockquote class="af-prompt">依上述目標撰寫規格文件，包含使用者流程、資料欄位、約束、錯誤處理、非目標與驗收條件。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>先由你審核規格再開始建置；不要讓模型自行決定關鍵商業規則。</p></aside><footer class="af-page-foot"><span>AI APP DEVELOPMENT / C08</span><span>14</span></footer></div>
