<div class="af-page ga-v4"><div class="af-kicker"><span>COURSE 08 / MODULE 3</span><span>APP DEPLOYMENT</span></div><h1>總實作：從真實問題交付可靠工具</h1><p class="af-deck">以自己的工作流程做一個App，並留下可查驗的開發紀錄。</p><figure class="ga-figure"><div class="ga-grid"><div class="ga-cell"><b>Plan</b><p>規格、資料與驗收標準</p></div><div class="ga-cell"><b>Build</b><p>最小可用原型</p></div><div class="ga-cell"><b>Test</b><p>正常、邊界、權限與回歸</p></div><div class="ga-cell"><b>Deploy</b><p>限定對象、回饋、維護</p></div></div><figcaption>原創綜合練習；非官方Course Challenge題目。</figcaption></figure><section class="af-section"><h2>最後交付物</h2><p>以專題待辦或時程工具為例，保存核准規格、原型、測試案例及實際結果、已知限制、分享設定和後續維護計畫。若資料尚未核准或功能仍有關鍵缺陷，停在測試版本。</p></section><blockquote class="af-prompt">以產品負責人與測試者角色審查這個App的規格及測試紀錄，列出阻擋發布的問題及可以後續改善的項目。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>能說明如何驗證、如何安全分享、何時不應發布，才算完成這套開發流程。</p></aside><footer class="af-page-foot"><span>AI APP DEVELOPMENT / C08</span><span>33</span></footer></div>
