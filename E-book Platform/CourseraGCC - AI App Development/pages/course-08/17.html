<div class="af-page ga-v4"><div class="af-kicker"><span>COURSE 08 / MODULE 3</span><span>APP DEPLOYMENT</span></div><h1>Grounding：讓App使用正確資料</h1><p class="af-deck">當答案需要真實公司數據或規則時，App必須依已驗證來源處理。</p><figure class="ga-figure"><div class="ga-flow"><div class="ga-step"><b>核准資料</b><small>CSV或規則文件</small></div><span class="ga-arrow" aria-hidden="true">→</span><div class="ga-step"><b>資料處理</b><small>驗證、解析與查詢</small></div><span class="ga-arrow" aria-hidden="true">→</span><div class="ga-step"><b>計算／模型</b><small>使用指定資料</small></div><span class="ga-arrow" aria-hidden="true">→</span><div class="ga-step"><b>輸出</b><small>數值、來源及限制</small></div></div><figcaption>資料依據（grounding）的概念流程。</figcaption></figure><section class="af-section"><h2>查出假資料與錯誤引用</h2><p>教材展示儀表板聊天給出不存在的商品類別與營收。應用已知正確答案測試：模型是否讀取真正資料，而非內建示例？確定性計算應依資料程式化完成，模型只負責可查證的說明。</p></section><blockquote class="af-prompt">檢查分析聊天是否使用目前上傳的CSV，不得使用測試資料。若欄位或數字找不到，明確回報無資料。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>上傳來源不等於所有生成內容一定正確；核對引用及計算。</p></aside><footer class="af-page-foot"><span>AI APP DEVELOPMENT / C08</span><span>29</span></footer></div>
