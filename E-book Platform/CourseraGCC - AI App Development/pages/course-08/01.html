<div class="af-page ga-v4"><div class="af-kicker"><span>COURSE 08 / MODULE 1</span><span>APP DEPLOYMENT</span></div><h1>開發流程：規劃、測試、部署</h1><p class="af-deck">從原型到可供他人使用的工具，需要可反覆執行的開發流程。</p><figure class="ga-figure"><div class="ga-flow"><div class="ga-step"><b>Plan</b><small>需求與規格</small></div><span class="ga-arrow" aria-hidden="true">→</span><div class="ga-step"><b>Test &amp; debug</b><small>驗證及修正</small></div><span class="ga-arrow" aria-hidden="true">→</span><div class="ga-step"><b>Deploy</b><small>權限與發布</small></div><span class="ga-arrow" aria-hidden="true">→</span><div class="ga-step"><b>Feedback</b><small>使用回饋</small></div></div><figcaption>回饋會帶回下一輪規劃；不是一次性的直線流程。</figcaption></figure><section class="af-section"><h2>為什麼不直接一鍵建置</h2><p>課程以三階段工作流說明：先明確定義需求和原型；再測試功能與規則；最後為使用者準備入口與權限。需求越複雜，越需要在建置前決定資料結構與行為。</p></section><blockquote class="af-prompt">先幫我把需求分成規劃、建置、測試與部署工作，指出尚未決定的規則，不要直接生成程式。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>完成畫面只是中間里程碑；真正成果是可驗收的工作行為。</p></aside><footer class="af-page-foot"><span>AI APP DEVELOPMENT / C08</span><span>13</span></footer></div>
