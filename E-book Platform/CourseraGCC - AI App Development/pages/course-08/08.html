<div class="af-page ga-v4"><div class="af-kicker"><span>COURSE 08 / MODULE 1</span><span>APP DEPLOYMENT</span></div><h1>將核准規格轉成建置指令</h1><p class="af-deck">完成需求審查後，把決定收斂成一份清楚而不互相矛盾的建置描述。</p><figure class="ga-figure"><div class="ga-flow"><div class="ga-step"><b>規格</b><small>已核准需求</small></div><span class="ga-arrow" aria-hidden="true">→</span><div class="ga-step"><b>整理</b><small>明確功能與規則</small></div><span class="ga-arrow" aria-hidden="true">→</span><div class="ga-step"><b>建置</b><small>產出可點擊原型</small></div><span class="ga-arrow" aria-hidden="true">→</span><div class="ga-step"><b>驗證</b><small>比對原始目標</small></div></div><figcaption>從Playground探索到Build原型。</figcaption></figure><section class="af-section"><h2>控制建置範圍</h2><p>建置前刪除未採納的構想、重複指令與互相矛盾的描述，保留規格的必要部分。第一版優先驗證主要流程，不要加入多餘品牌或功能。建完後對照規格，而非只看模型宣稱完成。</p></section><blockquote class="af-prompt">根據核准規格建立第一版App，實作匯入、任務依賴、延遲調整與可回查結果。其他功能暫不加入。列出尚未實作的項目。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>將原始規格保留下來，避免後續修改時失去驗收依據。</p></aside><footer class="af-page-foot"><span>AI APP DEVELOPMENT / C08</span><span>20</span></footer></div>
