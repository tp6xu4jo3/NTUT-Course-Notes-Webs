<div class="af-page ga-v4"><div class="af-kicker"><span>COURSE 08 / MODULE 2</span><span>APP DEPLOYMENT</span></div><h1>畫面問題：用標註指出具體位置</h1><p class="af-deck">當文字難以描述UI故障，可以用截圖或標註協助模型定位。</p><figure class="ga-figure"><div class="ga-wire"><div class="ga-wire-top"><span>App版面</span><span>故障描述示意</span></div><div class="ga-wire-main"><div><b>預期</b>標題在圖片上方，留12px間距</div><div><b>實際</b>標題與圖片重疊</div><div><b>限制</b>保持功能與資料不變</div><div><b>驗收</b>窄螢幕和寬螢幕都不重疊</div></div></div><figcaption>概念標註示例，非真實截圖。</figcaption></figure><section class="af-section"><h2>描述預期與保留項目</h2><p>標出哪個區塊超出、對齊錯誤、遮住按鈕或文字太小。要求只改相關樣式，並說明其他內容應保持不變。修改後檢查多種視窗大小與長文字。</p></section><blockquote class="af-prompt">截圖中標題遮住圖片，請修正排版：兩者分行、留適當間距，保留目前功能、文字與顏色；手機也需可用。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>外觀改善不能破壞可操作性或無障礙焦點。</p></aside><footer class="af-page-foot"><span>AI APP DEVELOPMENT / C08</span><span>24</span></footer></div>
