<div class="af-page ga-v4"><div class="af-kicker"><span>COURSE 08 / MODULE 3</span><span>APP DEPLOYMENT</span></div><h1>部署前：為第一次使用的人設計</h1><p class="af-deck">自己熟悉的App不一定對新使用者友善。</p><figure class="ga-figure"><div class="ga-wire"><div class="ga-wire-top"><span>專題待辦工具</span><span>開始使用</span></div><div class="ga-wire-main"><div><b>歡迎說明</b>用途、資料格式及限制</div><div><b>主要操作</b>匯入／貼上紀錄</div><div><b>結果</b>可編輯的待辦表</div><div><b>求助</b>錯誤原因、下一步</div></div></div><figcaption>概念介面示意。</figcaption></figure><section class="af-section"><h2>清理開發痕跡</h2><p>移除測試資料、占位文字、無用調試按鈕與對使用者無關的技術訊息。增加必要說明及空狀態。錯誤日誌仍可在安全的開發環境保留，使用者只看到有用且不洩漏細節的訊息。</p></section><blockquote class="af-prompt">為第一次使用者增加簡短引導、CSV格式範例、清楚錯誤提示及空狀態；移除展示用假資料，保留必要管理功能。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>隱藏介面元件不等於限制存取權限；敏感資料需要真正的授權控制。</p></aside><footer class="af-page-foot"><span>AI APP DEVELOPMENT / C08</span><span>28</span></footer></div>
