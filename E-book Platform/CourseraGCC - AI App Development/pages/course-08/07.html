<div class="af-page ga-v4"><div class="af-kicker"><span>COURSE 08 / MODULE 1</span><span>APP DEPLOYMENT</span></div><h1>控制指令：規則要能落實</h1><p class="af-deck">規格中的約束不只供模型參考，也應成為程式可檢查的行為。</p><figure class="ga-figure"><div class="ga-grid"><div class="ga-cell"><b>資料</b><p>日期必須可解析，數值不得缺漏</p></div><div class="ga-cell"><b>計算</b><p>使用指定公式及日曆規則</p></div><div class="ga-cell"><b>例外</b><p>無效輸入回報原因，不猜值</p></div><div class="ga-cell"><b>顯示</b><p>待確認與已驗證狀態分開</p></div></div><figcaption>編輯補充：將規則落實至輸入、處理與輸出。</figcaption></figure><section class="af-section"><h2>Prompt規則與程式驗證</h2><p>自然語言能指導模型輸出，但對於日期、權限、必填項、計算等確定性條件，應在程式中加入驗證。對模型生成的結構化結果也要檢查欄位、型別與範圍。</p></section><blockquote class="af-prompt">當日期無效或依賴缺失，禁止產生正式時程。顯示明確錯誤與修正建議，保留使用者原輸入。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>不能只靠模型說它遵守規則；實際使用錯誤輸入驗證。</p></aside><footer class="af-page-foot"><span>AI APP DEVELOPMENT / C08</span><span>19</span></footer></div>
