<div class="af-page ga-v4"><div class="af-kicker"><span>COURSE 08 / MODULE 1</span><span>APP DEPLOYMENT</span></div><h1>以脈絡文件補齊需求</h1><p class="af-deck">Context doc提供既有工作規則、範例、欄位與限制，讓App不是通用空殼。</p><figure class="ga-figure"><div class="ga-grid"><div class="ga-cell"><b>流程文件</b><p>真實工作步驟</p></div><div class="ga-cell"><b>資料樣本</b><p>欄位、型別、範例</p></div><div class="ga-cell"><b>規範</b><p>設計、政策或計算規則</p></div><div class="ga-cell"><b>限制</b><p>可用資源、權限及例外</p></div></div><figcaption>只提供經核准且必要的資料。</figcaption></figure><section class="af-section"><h2>避免把文件當成一個模糊附件</h2><p>明確說明附件的用途：時程表決定依賴與日期；設計規範決定配色與字級；政策文件提供可用範圍。若文件彼此矛盾，要求先列出差異。</p></section><blockquote class="af-prompt">以附上的去識別化任務表為資料格式依據；只使用其中欄位。規則文件有衝突時先列出，不自動選擇。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>附件有助於規劃，但仍需驗證模型是否真正採用正確資料。</p></aside><footer class="af-page-foot"><span>AI APP DEVELOPMENT / C08</span><span>15</span></footer></div>
