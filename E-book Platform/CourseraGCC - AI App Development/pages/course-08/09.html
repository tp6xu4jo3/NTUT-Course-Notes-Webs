<div class="af-page ga-v4"><div class="af-kicker"><span>COURSE 08 / MODULE 2</span><span>APP DEPLOYMENT</span></div><h1>測試是比對預期與實際</h1><p class="af-deck">測試前先寫清楚正確答案或可觀察的行為。</p><figure class="ga-figure"><div class="ga-rows"><div class="ga-row"><b>案例</b><p>任務A延遲2工作日</p></div><div class="ga-row"><b>預期</b><p>依賴A的B依規則後移</p></div><div class="ga-row"><b>實際</b><p>B日期未改（假設缺陷）</p></div><div class="ga-row"><b>判定</b><p>失敗；需修正依賴更新</p></div></div><figcaption>測試記錄示例，不是實際測試結果。</figcaption></figure><section class="af-section"><h2>測試不同層級</h2><p>編輯補充：單一計算可測公式，整合測試可檢查資料匯入後是否同步更新畫面，端到端測試則從使用者輸入直到交付。先掌握核心功能，逐步提高覆蓋。</p></section><blockquote class="af-prompt">依規格列出測試案例，每項包含前置條件、輸入、預期輸出及判定方式，不要先替我標記通過。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>沒有實際執行測試，就不能宣稱測試通過。</p></aside><footer class="af-page-foot"><span>AI APP DEVELOPMENT / C08</span><span>21</span></footer></div>
