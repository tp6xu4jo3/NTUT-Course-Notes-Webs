<div class="af-page ga-v4"><div class="af-kicker"><span>COURSE 07 / MODULE 1</span><span>APP BUILDING</span></div><h1>AI Studio：理解兩種工作空間</h1><p class="af-deck">先用對話探索問題，再進入建置環境產出可以試用的程式。</p><figure class="ga-figure"><div class="ga-compare"><div><b>Playground／對話</b><p>實驗模型、澄清需求、試寫規則與提示詞。</p></div><div><b>Build／建置</b><p>依需求生成程式、預覽介面、修改功能並測試。</p></div></div><figcaption>課程以Google AI Studio為示範；實際介面會更新。</figcaption></figure><section class="af-section"><h2>模型與App是不同層</h2><p>AI模型可處理文字、影像或其他任務；App將模型、介面、資料與程式邏輯組合起來。部分功能不需要模型，例如計算總和、排序與輸入驗證。把可確定的工作交給程式，不必每次呼叫AI。</p></section><blockquote class="af-prompt">為我的待辦工具區分哪些功能適合模型、哪些應由普通程式完成，列出原因及預期輸出。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>功能名稱與可用模型依環境而異；不要把特定版本的操作當成通用開發原理。</p></aside><footer class="af-page-foot"><span>AI APP DEVELOPMENT / C07</span><span>04</span></footer></div>
