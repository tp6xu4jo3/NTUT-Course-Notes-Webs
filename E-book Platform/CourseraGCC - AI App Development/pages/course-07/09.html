<div class="af-page ga-v4"><div class="af-kicker"><span>COURSE 07 / MODULE 3</span><span>APP BUILDING</span></div><h1>逐步擴充，而非一次加入所有功能</h1><p class="af-deck">先讓核心工作可用，再按使用者需求新增功能和視覺樣式。</p><figure class="ga-figure"><div class="ga-rows"><div class="ga-row"><b>v0</b><p>輸入紀錄、輸出待辦</p></div><div class="ga-row"><b>v1</b><p>允許編輯及複製</p></div><div class="ga-row"><b>v2</b><p>篩選、狀態與提示</p></div><div class="ga-row"><b>後續</b><p>視使用頻率決定是否儲存或分享</p></div></div><figcaption>版本規劃示例；每一版本都要可驗收。</figcaption></figure><section class="af-section"><h2>用具體改動迭代</h2><p>一次描述一個功能與其目的，例如增加複製按鈕讓同學貼到試算表。修改樣式時保留功能與資料，明確指定版面、色彩、對比和小螢幕行為。不要讓模型因改樣式重寫全部功能。</p></section><blockquote class="af-prompt">保留現有輸入與匯出流程，新增複製待辦表按鈕；手機上按鈕不得遮住表格，空資料時停用。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>測試新功能也要測舊功能，避免修改造成退步。</p></aside><footer class="af-page-foot"><span>AI APP DEVELOPMENT / C07</span><span>11</span></footer></div>
