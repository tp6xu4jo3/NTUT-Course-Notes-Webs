<div class="af-page ga-v4"><div class="af-kicker"><span>COURSE 07 / MODULE 2</span><span>APP BUILDING</span></div><h1>決策工具：把比較規則做成介面</h1><p class="af-deck">教材的Tie Breaker範例讓使用者輸入選項及目標，取得有理由的比較。</p><figure class="ga-figure"><div class="ga-wire"><div class="ga-wire-top"><span>Decision helper</span><span>原型示意</span></div><div class="ga-wire-main"><div><b>選項A／B</b>輸入候選方案</div><div><b>評估條件</b>成本、時間、必要性</div><div><b>比較結果</b>優缺點、假設</div><div><b>確認</b>使用者決定</div></div></div><figcaption>示意介面，不是實際Google AI Studio畫面。</figcaption></figure><section class="af-section"><h2>不要讓AI替你做重要決策</h2><p>讓App呈現比較條件、所需資料與取捨，而非直接輸出一個武斷答案。可用程式檢查空白欄位；由模型整理文字優缺點。對結果提供人工修改入口。</p></section><blockquote class="af-prompt">製作兩方案比較App，要求列出限制、支持理由和待確認資訊；不要自動執行決策。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>若輸入沒有足夠資訊，應要求補充，而非捏造價格或風險。</p></aside><footer class="af-page-foot"><span>AI APP DEVELOPMENT / C07</span><span>06</span></footer></div>
