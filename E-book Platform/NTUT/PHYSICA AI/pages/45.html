<article class="h-full flex flex-col"><header class="flex items-center justify-between border-b-2 pb-1.5 mb-3" style="border-color:#7C3AED"><span class="text-xs font-bold tracking-wider" style="color:#7C3AED">UNIT 07 · 機器人操控（L12）</span><span class="text-xs font-mono-code text-slate-400">P. 45</span></header><h2 class="font-serif-tc text-xl sm:text-2xl font-bold text-slate-900 leading-snug mb-3">機械手臂由什麼組成？</h2><div class="space-y-2"><p class="mag-body mb-2.5">串列連桿操控器由剛性連桿和關節依序連接。關節提供運動，連桿傳遞運動，末端執行器接觸環境。自由度（DoF）是描述構型所需的獨立座標數量。</p><figure class="bg-white border border-slate-200 rounded-xl p-2 my-2"><svg viewBox="0 0 440 160" class="w-full h-auto" role="img" aria-label="串列連桿操控器"><g fill="none" stroke="#7C3AED" stroke-width="8" stroke-linecap="round"><path d="M55 126 L106 81 L160 105 L218 42 L277 67 L330 44"/></g><g fill="#F4F0FF" stroke="#4F46E5" stroke-width="3"><circle cx="55" cy="126" r="8"/><circle cx="106" cy="81" r="8"/><circle cx="160" cy="105" r="8"/><circle cx="218" cy="42" r="8"/><circle cx="277" cy="67" r="8"/><circle cx="330" cy="44" r="8"/></g><rect x="28" y="128" width="55" height="14" rx="3" fill="#475569"/><path d="M338 44h18v-13h17m-17 13v13h17" fill="none" stroke="#0D9488" stroke-width="4"/><g fill="#475569" font-size="11"><text x="14" y="119">基座</text><text x="115" y="69">關節</text><text x="180" y="90">連桿</text><text x="335" y="23">末端工具</text></g></svg><figcaption class="text-[11px] text-slate-500 text-center">串列連桿操控器（示意圖）</figcaption></figure><div class="overflow-x-auto"><table class="w-full text-xs border-collapse my-2"><thead><tr><th class="text-left bg-slate-100 border border-slate-200 p-2">關節</th><th class="text-left bg-slate-100 border border-slate-200 p-2">運動</th><th class="text-left bg-slate-100 border border-slate-200 p-2">自由度</th></tr></thead><tbody><tr><td class="align-top border border-slate-200 p-2">旋轉 Revolute</td><td class="align-top border border-slate-200 p-2">繞軸旋轉，像門鉸鏈</td><td class="align-top border border-slate-200 p-2">1</td></tr><tr><td class="align-top border border-slate-200 p-2">滑動 Prismatic</td><td class="align-top border border-slate-200 p-2">沿軸平移，像抽屜</td><td class="align-top border border-slate-200 p-2">1</td></tr><tr><td class="align-top border border-slate-200 p-2">螺旋 Helical</td><td class="align-top border border-slate-200 p-2">旋轉與平移按螺距耦合</td><td class="align-top border border-slate-200 p-2">1</td></tr></tbody></table></div><div class="bg-slate-900 text-slate-100 rounded-xl p-3 mt-2"><h3 class="text-xs font-bold text-amber-300 mb-1">構型與姿態不同</h3><p class="text-xs leading-relaxed">七軸手臂有七個關節變數；末端剛體在三維空間的姿態通常用六個自由度描述。</p></div><p class="text-[11px] text-slate-500 mt-2">課程來源：<a class="underline" href="https://docs.google.com/document/d/1yg6q3MnkFNLyNEujEtNEDg-xp4bIosLthd8CjEkEXgs/edit" target="_blank" rel="noopener noreferrer">Lecture 12 講義</a>、<a class="underline" href="https://drive.google.com/file/d/1Xk47MRAxE3eSK0DlKbj4TOrOI6gweHWX/view" target="_blank" rel="noopener noreferrer">逐字稿 Part 1</a>、<a class="underline" href="https://drive.google.com/file/d/1lRt0Knt3tl-0dSu0_XpHauuE4tbwMgRn/view" target="_blank" rel="noopener noreferrer">Part 2</a></p></div></article>
