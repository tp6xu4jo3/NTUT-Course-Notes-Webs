<article class="h-full flex flex-col"><header class="flex items-center justify-between border-b-2 pb-1.5 mb-3" style="border-color:#7C3AED"><span class="text-xs font-bold tracking-wider" style="color:#7C3AED">UNIT 07 · 末端工具（L12）</span><span class="text-xs font-mono-code text-slate-400">P. 46</span></header><h2 class="font-serif-tc text-xl sm:text-2xl font-bold text-slate-900 leading-snug mb-3">夾爪選擇會改變抓取問題</h2><div class="space-y-2"><p class="mag-body mb-2.5">末端執行器的尺寸、接觸方式、可施加的力及可進入的空間，決定哪些任務可以完成。</p><figure class="bg-white border border-slate-200 rounded-xl p-2 my-2"><svg viewBox="0 0 440 160" class="w-full h-auto" role="img" aria-label="三種工具的接觸方式"><g stroke="#7C3AED" stroke-width="4" fill="none"><path d="M65 18v45m-24 0h48m-48 0v50h14m34-50v50H75"/><path d="M220 18v45m-25 0h50m-48 0-14 44m37-44v44m23-44 14 44"/><path d="M366 18v60m-30 0h60m-55 0-13 25h76l-13-25"/></g><rect x="50" y="101" width="30" height="25" rx="4" fill="#CBD5E1"/><circle cx="220" cy="110" r="18" fill="#CBD5E1"/><rect x="334" y="104" width="64" height="15" fill="#CBD5E1"/><g fill="#475569" font-size="11" text-anchor="middle"><text x="65" y="145">二指夾爪</text><text x="220" y="145">多指夾爪</text><text x="366" y="145">吸盤</text></g></svg><figcaption class="text-[11px] text-slate-500 text-center">三種工具的接觸方式（示意圖）</figcaption></figure><div class="overflow-x-auto"><table class="w-full text-xs border-collapse my-2"><thead><tr><th class="text-left bg-slate-100 border border-slate-200 p-2">工具</th><th class="text-left bg-slate-100 border border-slate-200 p-2">適用條件</th><th class="text-left bg-slate-100 border border-slate-200 p-2">常見失敗</th></tr></thead><tbody><tr><td class="align-top border border-slate-200 p-2">吸盤</td><td class="align-top border border-slate-200 p-2">可形成密封的平整表面</td><td class="align-top border border-slate-200 p-2">多孔、粗糙或透氣材料可能漏氣</td></tr><tr><td class="align-top border border-slate-200 p-2">二指夾爪</td><td class="align-top border border-slate-200 p-2">可接觸相對表面、尺寸合適</td><td class="align-top border border-slate-200 p-2">摩擦或夾力不足造成滑脫</td></tr><tr><td class="align-top border border-slate-200 p-2">靈巧手</td><td class="align-top border border-slate-200 p-2">複雜形狀與多點操控</td><td class="align-top border border-slate-200 p-2">關節與接觸控制複雜</td></tr></tbody></table></div><div class="bg-slate-900 text-slate-100 rounded-xl p-3 mt-2"><h3 class="text-xs font-bold text-amber-300 mb-1">簡化夾持模型</h3><p class="text-xs leading-relaxed">垂直夾住質量 m 的物件，若兩指各施法向力 N、摩擦係數 μ，對稱靜態模型需 2μN ≥ mg。實機需留裕度，並考慮物件強度、加速度與扭矩。</p></div><p class="text-[11px] text-slate-500 mt-2">課程來源：<a class="underline" href="https://docs.google.com/document/d/1yg6q3MnkFNLyNEujEtNEDg-xp4bIosLthd8CjEkEXgs/edit" target="_blank" rel="noopener noreferrer">Lecture 12 講義</a>、<a class="underline" href="https://drive.google.com/file/d/1Xk47MRAxE3eSK0DlKbj4TOrOI6gweHWX/view" target="_blank" rel="noopener noreferrer">逐字稿 Part 1</a>、<a class="underline" href="https://drive.google.com/file/d/1lRt0Knt3tl-0dSu0_XpHauuE4tbwMgRn/view" target="_blank" rel="noopener noreferrer">Part 2</a></p></div></article>
