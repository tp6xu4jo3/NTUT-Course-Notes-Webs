<div class="af-page ga-v3"><div class="af-kicker"><span>COURSE 04 / MODULE 2</span><span>WRITING AND COMMUNICATING</span></div><h1>翻譯與修改要保留原意</h1><p class="af-deck">AI可以協助跨語言與語氣轉換，但自然流暢不保證語意完全一致。</p><figure class="ga-figure"><div class="ga-compare"><div><b>原意</b><p>我們目前可以試作，但尚未承諾交付日期。</p></div><div><b>錯誤改寫</b><p>我們很快就能完成交付。把可能性變成承諾。</p></div></div><figcaption>檢查語氣調整是否改變承諾、否定與條件。</figcaption></figure><section class="af-section"><h2>分階段修訂</h2><p>先明確指定語言、對象與語氣，再請AI提供較直譯和較自然的版本。保留專有名詞、數值與正式條件。若使用Canvas類編輯介面，先選定段落、指定修改範圍，再核對整份文件是否一致。</p></section><blockquote class="af-prompt">將這段說明翻成自然英文，保持未承諾交付日期的意思。列出可能有歧義的詞，不要新增保證。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>法律、契約、專業規格等關鍵翻譯需由適當專業人員核對。</p></aside><footer class="af-page-foot"><span>AI CONTENT &amp; COMMUNICATION / C04</span><span>07</span></footer></div>
