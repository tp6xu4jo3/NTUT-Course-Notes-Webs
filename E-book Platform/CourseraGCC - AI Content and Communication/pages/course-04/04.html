<div class="af-page ga-v3"><div class="af-kicker"><span>COURSE 04 / MODULE 2</span><span>WRITING AND COMMUNICATING</span></div><h1>以角色觀點找出溝通盲點</h1><p class="af-deck">與第二冊自訂AI專家不同，這裡的角色設定用來模擬讀者的反應。</p><figure class="ga-figure"><div class="ga-grid"><div class="ga-cell"><b>客戶</b><p>關心結果、時程與承諾</p></div><div class="ga-cell"><b>主管</b><p>關心風險、資源與決策</p></div><div class="ga-cell"><b>同事</b><p>關心分工、依賴與細節</p></div><div class="ga-cell"><b>新手</b><p>關心清楚步驟與術語解釋</p></div></div><figcaption>同一段文字在不同受眾面前可能有不同問題。</figcaption></figure><section class="af-section"><h2>取得具體而非空泛的回饋</h2><p>先讓AI以某一受眾角度指出看不懂、會誤解或仍有疑問之處。再要求提供修改建議並說明原因，不必讓AI一次重寫全部。你應保留原作者的意思及必要事實。</p></section><blockquote class="af-prompt">你是第一次看到這份專題提案的評審。列出最可能產生的五個疑問，引用相關文字並提供具體修改方向。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>不要將AI模擬出的反應當作真實受眾的意見。</p></aside><footer class="af-page-foot"><span>AI CONTENT &amp; COMMUNICATION / C04</span><span>06</span></footer></div>
