<div class="af-page ga-v3"><div class="af-kicker"><span>COURSE 04 / MODULE 1</span><span>WRITING AND COMMUNICATING</span></div><h1>摘要品質：覆蓋、正確、可用</h1><p class="af-deck">不要只檢查文句是否通順，還要看遺漏或誤判是否會影響執行。</p><figure class="ga-figure"><div class="ga-compare"><div><b>原始討論</b><p>「如果場地確定，我們下週也許可以開放報名。」</p></div><div><b>不合格摘要</b><p>下週開放報名。忽略了先決條件與未確認狀態。</p></div></div><figcaption>改寫示例：場地確定後再確認報名日期，目前未決。</figcaption></figure><section class="af-section"><h2>用原文驗收</h2><p>會議紀錄應簡短但保留條件，尤其是日期、責任人、否定句與例外。要求AI指出不確定之處，而不是把所有項目補成完整句。可讓模型先做檢查，再由人比對關鍵段落。</p></section><blockquote class="af-prompt">對照這份摘要與逐字稿，列出遺漏的決議、錯誤待辦、未確認的時間與被省略的條件。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>不要將「未提及」解讀為「沒有風險」或「已同意」。</p></aside><footer class="af-page-foot"><span>AI CONTENT &amp; COMMUNICATION / C04</span><span>05</span></footer></div>
