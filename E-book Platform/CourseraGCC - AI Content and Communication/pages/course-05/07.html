<div class="af-page ga-v3"><div class="af-kicker"><span>COURSE 05 / MODULE 2</span><span>CONTENT CREATION</span></div><h1>一致性：建立簡報視覺系統</h1><p class="af-deck">統一版式不等於每張都長一樣，而是讓觀眾快速辨識資訊層級。</p><figure class="ga-figure"><div class="ga-grid"><div class="ga-cell"><b>色彩</b><p>主色、輔色、強調色的用途</p></div><div class="ga-cell"><b>字體</b><p>標題、正文、註解的大小層級</p></div><div class="ga-cell"><b>格線</b><p>固定邊距、對齊與留白</p></div><div class="ga-cell"><b>圖像</b><p>一致筆觸、構圖或光線</p></div></div><figcaption>編輯補充：以規則建立整組版面。</figcaption></figure><section class="af-section"><h2>從參考素材延伸</h2><p>先挑選一張適合的插圖或投影片做為樣式參考，再生成其他素材。描述要延續的是色盤、簡約程度、線條或景深，而不是要求複製所有內容。</p></section><blockquote class="af-prompt">延續參考圖的扁平幾何、淺色背景與少量藍色強調，替新的概念生成不同構圖；保持主體清楚。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>對比度、文字大小與色盲可讀性比裝飾一致更重要。</p></aside><footer class="af-page-foot"><span>AI CONTENT &amp; COMMUNICATION / C05</span><span>19</span></footer></div>
