<div class="af-page ga-v3"><div class="af-kicker"><span>COURSE 05 / MODULE 2</span><span>CONTENT CREATION</span></div><h1>文字與圖片各自負責一件事</h1><p class="af-deck">視覺不是裝飾填空，應幫助觀眾理解文字不容易快速說明的內容。</p><figure class="ga-figure"><div class="ga-compare"><div><b>較弱</b><p>整頁段落文字，加上無關的科技背景。</p></div><div><b>較強</b><p>一行結論式標題、三步流程圖、必要數字與來源。</p></div></div><figcaption>視覺設計示例：圖像應服務訊息。</figcaption></figure><section class="af-section"><h2>選擇合適的視覺形式</h2><p>流程用箭頭，結構用分層，差異用對照，量化證據使用真正的圖表。概念圖可由生成式AI協助構想；精確資料圖要依資料繪製。圖像風格應與整份簡報一致。</p></section><blockquote class="af-prompt">為這三張投影片分別建議流程圖、比較圖或插圖，說明每個視覺要解釋的訊息；不要用無關裝飾。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>圖示若讓人誤解因果或比例，就算美觀也應修改。</p></aside><footer class="af-page-foot"><span>AI CONTENT &amp; COMMUNICATION / C05</span><span>18</span></footer></div>
