<div class="af-page ga-v3"><div class="af-kicker"><span>COURSE 05 / MODULE 1</span><span>CONTENT CREATION</span></div><h1>視覺創作從Brief開始</h1><p class="af-deck">Brief是創作需求的簡要說明，包含目的、對象、訊息、限制與交付形式。</p><figure class="ga-figure"><div class="ga-grid"><div class="ga-cell"><b>目的</b><p>宣傳、解釋或建立辨識度</p></div><div class="ga-cell"><b>受眾</b><p>需要注意什麼？</p></div><div class="ga-cell"><b>視覺</b><p>主體、構圖、光線、色彩</p></div><div class="ga-cell"><b>交付</b><p>比例、媒體、文字及限制</p></div></div><figcaption>先決定傳達目的，再選生成形式。</figcaption></figure><section class="af-section"><h2>用概念發散建立方向</h2><p>第一冊已介紹多模態及基本圖片提示詞。這裡把它變成完整設計流程：先產生數種風格差異明確的概念，再用受眾與用途篩選，而非因為某張圖最炫就選它。</p></section><blockquote class="af-prompt">為校園專題展發想3個主視覺方向：理性科技、活潑交流、簡約未來。各說明主體、色彩與適合受眾。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>避免不必要的品牌仿冒、未授權素材及誤導性圖像。</p></aside><footer class="af-page-foot"><span>AI CONTENT &amp; COMMUNICATION / C05</span><span>13</span></footer></div>
