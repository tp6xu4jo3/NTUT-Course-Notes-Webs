<div class="af-page ga-v3"><div class="af-kicker"><span>COURSE 05 / MODULE 3</span><span>CONTENT CREATION</span></div><h1>用規範而非喜好評估設計</h1><p class="af-deck">讓AI根據明確設計標準檢查作品，避免只說好看或不好看。</p><figure class="ga-figure"><div class="ga-rows"><div class="ga-row"><b>資訊層級</b><p>第一眼能否看到主訊息？</p></div><div class="ga-row"><b>可讀性</b><p>字級、對比、行距是否清楚？</p></div><div class="ga-row"><b>一致性</b><p>色彩、對齊、圖示是否有規則？</p></div><div class="ga-row"><b>正確性</b><p>文字、日期、圖表與標誌是否準確？</p></div></div><figcaption>設計評論標準，屬編輯補充。</figcaption></figure><section class="af-section"><h2>多模態評論</h2><p>提供作品圖片及設計規範，要求AI指出具體位置、問題、影響與建議。若沒有規範，可先請AI提出適合受眾與媒介的檢查標準，再由你選擇。</p></section><blockquote class="af-prompt">依上述規範檢查這張海報，列出最需要修改的3處。說明位置、原因及改法，避免抽象的『更有設計感』。</blockquote><aside class="af-note"><b>檢核與提醒</b><p>模型可能讀錯小字、顏色或比例，需實際查看原圖。</p></aside><footer class="af-page-foot"><span>AI CONTENT &amp; COMMUNICATION / C05</span><span>20</span></footer></div>
