<article class="aif-page"><header class="aif-kicker"><span>PART 03 / VOL. 01</span><span>DOMAIN 1</span></header><h1>監督、非監督與強化學習</h1><p class="aif-intro">監督學習使用帶有目標值的資料，分類預測類別（詐欺或正常），迴歸預測連續數值（房價）。非監督學習探索沒有目標標籤的資料，例如依消費特徵進行分群。</p><figure class="aif-figure"><div class="aif-compare"><div><b>已標記</b>分類／迴歸</div><div><b>無標籤</b>分群</div><div><b>行動＋獎勵</b>策略</div></div><figcaption>概念對照示意。</figcaption></figure><section class="aif-section"><h2>深入理解</h2><p>強化學習透過行動、環境回饋及累積獎勵學習策略。預測未來銷量則是預測問題，通常需要保留時間關係。若稅率、資格規則等結果由明確條件決定，傳統程式邏輯可能更便宜、更可靠。</p></section><aside class="aif-note"><b>理解與應用</b><p>先問要輸出的是類別、數值、群組還是行動策略。</p></aside><footer class="aif-foot"><span>AIF-C01 / PART 3</span><a href="https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain1.html" target="_blank" rel="noopener">官方範圍</a><span>10</span></footer></article>
