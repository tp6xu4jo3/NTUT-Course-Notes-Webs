<article class="aif-page"><header class="aif-kicker"><span>PART 02 / VOL. 01</span><span>DOMAIN 1</span></header><h1>AI、ML與生成式AI的關係</h1><p class="aif-intro">AI（人工智慧）是讓系統執行需要智慧判斷的廣泛概念。ML（機器學習）從資料學習規律，不必為每個情況手寫固定規則。Deep Learning（深度學習）是以多層神經網路學習表示的ML方法。</p><figure class="aif-figure"><div class="aif-flow" role="group" aria-label="概念流程"><div class="aif-node">AI</div><span class="aif-arrow" aria-hidden="true">→</span><div class="aif-node">ML</div><span class="aif-arrow" aria-hidden="true">→</span><div class="aif-node">深度學習</div><span class="aif-arrow" aria-hidden="true">→</span><div class="aif-node">現代生成式模型</div></div><figcaption>原創教學示意；實際流程依服務與情境調整。</figcaption></figure><section class="aif-section"><h2>深入理解</h2><p>GenAI（生成式AI）以學到的模式產生內容，例如文字或影像；現代GenAI常以深度學習實現。Agentic AI著重以目標導向的系統安排工具與多步行動，不是單純的模型種類。</p></section><aside class="aif-note"><b>理解與應用</b><p>不要將所有AI視為LLM，也不要將所有聊天機器人稱為代理。</p></aside><footer class="aif-foot"><span>AIF-C01 / PART 2</span><a href="https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain1.html" target="_blank" rel="noopener">官方範圍</a><span>07</span></footer></article>
