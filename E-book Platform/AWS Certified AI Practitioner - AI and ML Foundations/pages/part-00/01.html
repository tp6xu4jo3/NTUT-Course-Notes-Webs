<article class="aif-page"><header class="aif-kicker"><span>PART 00 / VOL. 01</span><span>FOUNDATIONS</span></header><h1>這張證照要證明什麼</h1><p class="aif-intro">從企業需求出發，理解AI能做什麼、選擇合適的AWS服務，並辨識風險。考試不要求自行撰寫ML演算法或部署完整基礎設施。</p><figure class="aif-figure"><div class="aif-weight"><div>AI與ML<span><i style="width:71.42857142857143%"></i></span></div><b>20%</b></div><div class="aif-weight"><div>GenAI<span><i style="width:85.71428571428571%"></i></span></div><b>24%</b></div><div class="aif-weight"><div>基礎模型應用<span><i style="width:100%"></i></span></div><b>28%</b></div><div class="aif-weight"><div>負責任AI<span><i style="width:50%"></i></span></div><b>14%</b></div><div class="aif-weight"><div>安全治理<span><i style="width:50%"></i></span></div><b>14%</b></div><figcaption>官方計分內容權重，不代表固定題數。</figcaption></figure><section class="aif-section"><h2>深入理解</h2><p>官方考綱：AIF-C01、2026-10-29發布的線上Version 1.2。65題中50題計分、15題不計分；量尺分數700為及格門檻，並非固定答對70%。目前英文指南列單選與多選，不沿用舊資料中的排序與配對作為正式題型。</p></section><aside class="aif-note"><b>理解與應用</b><p>先認清需求、限制與取捨，再比對服務能力。不要把單一關鍵字當成答案。</p></aside><footer class="aif-foot"><span>AIF-C01 / PART 0</span><a href="https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01.html" target="_blank" rel="noopener">官方範圍</a><span>03</span></footer></article>
