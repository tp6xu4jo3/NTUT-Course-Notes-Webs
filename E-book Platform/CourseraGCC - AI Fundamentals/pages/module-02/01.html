<div class="af-page af-m2"><div class="af-kicker"><span>MODULE 02</span><span>FIRST LAB</span></div><h1>從零開始的簡報</h1><p class="af-deck">把發散、選擇與寫作分成三次對話，會比要求AI一次生出完美簡報更容易掌握。</p><div class="af-flow" role="group" aria-label="流程圖"><div class="af-node af-c0"><b>發散</b><small>列出3種架構</small></div><span class="af-arrow" aria-hidden="true">→</span><div class="af-node af-c1"><b>選擇</b><small>依受眾選方向</small></div><span class="af-arrow" aria-hidden="true">→</span><div class="af-node af-c2"><b>開場</b><small>草擬引言</small></div></div><section class="af-section"><h2>任務設定</h2><p>假設要向同學介紹AI如何協助專題研究。先指定目標、受眾和時間，再要求幾種有差異的敘事方式。</p></section><blockquote class="af-prompt">我要做一場5分鐘簡報，向大學生介紹AI如何協助專題研究。請提出3種不同的敘事架構，每種附上適合的開場與核心訊息。</blockquote><aside class="af-note"><b>實作環境</b><p>課程使用Gemini進行練習；選擇可使用的聊天工具即可重現核心方法，不必把訂閱或介面細節當成知識重點。</p></aside><footer class="af-page-foot"><span>AI FUNDAMENTALS / MODULE 2</span><span>05</span></footer></div>
