<div class="af-page af-m3"><div class="af-kicker"><span>MODULE 03</span><span>HOW AI WORKS</span></div><h1>機器學習的三種方法</h1><p class="af-deck">差異在於學習時拿到什麼訊號。</p><div class="af-learning"><div><div class="af-symbols"><i class="circle"></i><i class="circle"></i><i class="square"></i><i class="square"></i></div><b>有監督學習</b><small>已有標籤：分類、預測</small></div><div><div class="af-symbols grouped"><i class="circle"></i><i class="circle"></i><i class="square"></i><i class="square"></i></div><b>非監督學習</b><small>沒有標籤：發現群組或結構</small></div><div><div class="af-symbols"><i class="reward">+</i><i class="reward bad">−</i><i class="reward">+</i></div><b>強化學習</b><small>透過獎勵學習行動策略</small></div></div><div class="af-table-wrap"><table class="af-table"><thead><tr><th scope="col">方法</th><th scope="col">教學例子</th></tr></thead><tbody><tr><td>Supervised</td><td>提供標記為馬或斑馬的圖片，訓練分類器。</td></tr><tr><td>Unsupervised</td><td>提供未標記的圖片，找出外觀相似的群組。</td></tr><tr><td>Reinforcement</td><td>讓代理在環境中嘗試行動，依獎勵調整策略。</td></tr></tbody></table></div><aside class="af-note"><b>實務上可以混合</b><p>不同模型可能在不同階段使用多種訓練方式。這裡的分類是理解學習訊號，不是產品的固定標籤。</p></aside><footer class="af-page-foot"><span>AI FUNDAMENTALS / MODULE 3</span><span>09</span></footer></div>
