<div class="af-page af-m3"><div class="af-kicker"><span>MODULE 03</span><span>HOW AI WORKS</span></div><h1>訓練與推論</h1><p class="af-deck">模型先從資料中學習，再用學到的規律處理新的問題。</p><div class="af-flow" role="group" aria-label="流程圖"><div class="af-node af-c0"><b>訓練資料</b><small>影像或文字</small></div><span class="af-arrow" aria-hidden="true">→</span><div class="af-node af-c1"><b>訓練</b><small>調整模型參數</small></div><span class="af-arrow" aria-hidden="true">→</span><div class="af-node af-c2"><b>模型</b><small>保留學得模式</small></div><span class="af-arrow" aria-hidden="true">→</span><div class="af-node af-c3"><b>推論</b><small>處理新輸入</small></div></div><figure class="af-fruit"><div><span class="af-apple red"></span><span class="af-apple red"></span><span class="af-apple red"></span><b>訓練：只看紅蘋果</b></div><span class="af-arrow">→</span><div><span class="af-apple green"></span><span class="af-apple yellow"></span><b>測試：其他顏色？</b></div><figcaption>教材中的分揀概念：樣本不夠多元，可能降低辨識新類型的能力。</figcaption></figure><section class="af-section"><h2>資料與架構都重要</h2><p>訓練資料影響模型學到哪些模式；模型架構、訓練目標及後續調校也會影響表現。因此不同模型對相同指令不一定給出相同答案。</p></section><aside class="af-note"><b>別把對話當作即時訓練</b><p>一次聊天提供的新資訊通常是當次推論的脈絡，不代表模型的參數已永久更新。</p></aside><footer class="af-page-foot"><span>AI FUNDAMENTALS / MODULE 3</span><span>08</span></footer></div>
