<div class="af-page af-m5"><div class="af-kicker"><span>MODULE 05</span><span>ADVANCED PROMPTS</span></div><h1>讓Prompt更有力量</h1><p class="af-deck">與其追求神奇咒語，不如用精確的限制、評估標準與輸出方式。</p><div class="af-table-wrap"><table class="af-table"><thead><tr><th scope="col">想達成什麼</th><th scope="col">可以怎麼要求</th></tr></thead><tbody><tr><td>安排流程</td><td>先列假設，再提出選項，最後比較取捨。</td></tr><tr><td>控制受眾</td><td>為非技術主管撰寫，先說明影響再介紹原理。</td></tr><tr><td>設定界線</td><td>限300字、只引用附件、不新增未提供的數字。</td></tr><tr><td>要求批判</td><td>找出最強反例，說明哪項假設最脆弱。</td></tr><tr><td>產生替代</td><td>提出三個不同方案，各列一項優點與風險。</td></tr><tr><td>深化細節</td><td>針對第二個方案，補一個具體使用情境。</td></tr></tbody></table></div><aside class="af-note"><b>評估，而非迷信指令</b><p>要求模型列出可檢查的依據和簡明推導，比只寫「仔細想」更容易驗收。</p></aside><footer class="af-page-foot"><span>AI FUNDAMENTALS / MODULE 5</span><span>15</span></footer></div>
