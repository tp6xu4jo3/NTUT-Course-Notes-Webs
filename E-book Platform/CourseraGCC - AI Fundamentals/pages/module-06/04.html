<div class="af-page af-m6"><div class="af-kicker"><span>MODULE 06</span><span>RESPONSIBLE AI</span></div><h1>AI Agent｜從回答到執行</h1><p class="af-deck">一般對話以回答指令為主；Agent可以在授權範圍內安排多個步驟並呼叫工具。</p><div class="af-tiles"><section class="af-tile"><span class="af-dot af-c0">01</span><h3>Model｜模型</h3><p>判斷為達成目標需要哪些步驟。</p></section><section class="af-tile"><span class="af-dot af-c1">02</span><h3>Permissions｜權限</h3><p>限制可存取的資料與可執行的動作。</p></section><section class="af-tile"><span class="af-dot af-c2">03</span><h3>Goal｜目標</h3><p>定義最終交付、範圍與完成條件。</p></section></div><figure class="af-agent-cycle"><div>Analyze<br><small>分析下一步</small></div><span>→</span><div>Act<br><small>執行授權動作</small></div><span>→</span><div>Observe<br><small>檢查結果</small></div><figcaption>必要時再分析下一步；完成、遇到限制或達到停止條件時結束。</figcaption></figure><section class="af-section"><h2>例如：協調會議</h2><p>Agent可讀取經授權的空閒時段並草擬邀請。若發現時間衝突，就重新提出選項。實際寄送前可設定人工確認。</p></section><footer class="af-page-foot"><span>AI FUNDAMENTALS / MODULE 6</span><span>22</span></footer></div>
