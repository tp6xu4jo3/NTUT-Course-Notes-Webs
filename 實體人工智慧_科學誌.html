<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PHYSICA AI · 實體智能科學誌 Vol. 01</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Noto Serif TC, Noto Sans TC, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet" />

  <style>
    :root {
      --paper-bg: #FAF8F3;
      --paper-edge: #EFECE4;
      --ink-main: #1E293B;
      --ink-muted: #475569;
      --accent-blue: #1D4ED8;
      --accent-orange: #EA580C;
      --accent-teal: #0D9488;
      --accent-indigo: #4F46E5;
      --accent-crimson: #DC2626;
      --accent-violet: #7C3AED;
      --font-scale: 1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at 50% 35%, #263142 0%, #111827 75%, #090D16 100%);
      color: var(--ink-main);
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    .font-serif-tc {
      font-family: 'Noto Serif TC', Georgia, serif;
    }

    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Magazine Paper Texture & Spine Shadows */
    .magazine-page {
      background-color: var(--paper-bg);
      background-image:
        radial-gradient(rgba(30, 41, 59, 0.025) 1px, transparent 0),
        linear-gradient(180deg, rgba(255,255,255,0.6) 0%, rgba(244,240,230,0.4) 100%);
      background-size: 18px 18px, 100% 100%;
      color: var(--ink-main);
      position: relative;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: thin;
      scrollbar-color: rgba(100, 116, 139, 0.35) transparent;
      user-select: text;
    }

    .magazine-page::-webkit-scrollbar {
      width: 5px;
    }
    .magazine-page::-webkit-scrollbar-thumb {
      background-color: rgba(100, 116, 139, 0.35);
      border-radius: 9999px;
    }

    /* Desktop Left & Right Spine Crease Shading */
    @media (min-width: 1024px) {
      .page-left-shadow {
        box-shadow:
          inset -24px 0 32px -18px rgba(15, 23, 42, 0.16),
          inset 2px 0 0 rgba(255, 255, 255, 0.85),
          -8px 14px 28px rgba(0, 0, 0, 0.45);
        border-radius: 10px 2px 2px 10px;
      }

      .page-right-shadow {
        box-shadow:
          inset 24px 0 32px -18px rgba(15, 23, 42, 0.16),
          inset -2px 0 0 rgba(255, 255, 255, 0.85),
          8px 14px 28px rgba(0, 0, 0, 0.45);
        border-radius: 2px 10px 10px 2px;
      }
    }

    @media (max-width: 1023px) {
      .mobile-single-shadow {
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55);
        border-radius: 12px;
      }
    }

    /* Scalable Body Typography */
    .mag-body {
      font-size: calc(0.875rem * var(--font-scale));
      line-height: 1.72;
      color: #273549;
    }

    .mag-lead {
      font-size: calc(0.95rem * var(--font-scale));
      line-height: 1.78;
    }

    /* Drop Cap for Editorial Opening */
    .drop-cap::first-letter {
      float: left;
      font-family: 'Noto Serif TC', serif;
      font-weight: 900;
      font-size: 3.1rem;
      line-height: 0.88;
      padding-top: 4px;
      padding-right: 10px;
      padding-bottom: 2px;
      color: #1D4ED8;
    }

    /* Pull Quote Styling */
    .pull-quote {
      border-left: 4px solid currentColor;
      background: linear-gradient(90deg, rgba(29, 78, 216, 0.06) 0%, rgba(29, 78, 216, 0.01) 100%);
      padding: 0.75rem 1rem;
      border-radius: 0 8px 8px 0;
    }

    /* 3D Page Flip Stage */
    .book-perspective {
      perspective: 2400px;
    }

    .flip-leaf {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50%;
      transform-style: preserve-3d;
      pointer-events: none;
      z-index: 40;
      will-change: transform;
    }

    .flip-leaf-right {
      right: 0;
      transform-origin: left center;
    }

    .flip-leaf-left {
      left: 0;
      transform-origin: right center;
    }

    .flip-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background-color: var(--paper-bg);
      overflow: hidden;
    }

    .flip-face-front-right {
      border-radius: 2px 10px 10px 2px;
      box-shadow: inset 24px 0 32px -18px rgba(15, 23, 42, 0.18), 0 12px 30px rgba(0, 0, 0, 0.35);
    }

    .flip-face-back-right {
      transform: rotateY(180deg);
      border-radius: 10px 2px 2px 10px;
      box-shadow: inset -24px 0 32px -18px rgba(15, 23, 42, 0.18), 0 12px 30px rgba(0, 0, 0, 0.35);
    }

    .flip-face-front-left {
      border-radius: 10px 2px 2px 10px;
      box-shadow: inset -24px 0 32px -18px rgba(15, 23, 42, 0.18), 0 12px 30px rgba(0, 0, 0, 0.35);
    }

    .flip-face-back-left {
      transform: rotateY(-180deg);
      border-radius: 2px 10px 10px 2px;
      box-shadow: inset 24px 0 32px -18px rgba(15, 23, 42, 0.18), 0 12px 30px rgba(0, 0, 0, 0.35);
    }

    @keyframes flipNextAnim {
      0% { transform: rotateY(0deg); }
      100% { transform: rotateY(-180deg); }
    }

    @keyframes flipPrevAnim {
      0% { transform: rotateY(0deg); }
      100% { transform: rotateY(180deg); }
    }

    .animating-next {
      animation: flipNextAnim 0.62s cubic-bezier(0.645, 0.045, 0.355, 1) forwards;
    }

    .animating-prev {
      animation: flipPrevAnim 0.62s cubic-bezier(0.645, 0.045, 0.355, 1) forwards;
    }

    /* Corner Curl Affordance */
    .corner-curl-right {
      background: linear-gradient(225deg, rgba(203, 213, 225, 0.75) 0%, rgba(250, 248, 243, 0.95) 48%, transparent 50%);
      transition: all 0.25s ease;
    }
    .corner-curl-right:hover {
      width: 44px;
      height: 44px;
      box-shadow: -3px 3px 8px rgba(15, 23, 42, 0.15);
    }

    .corner-curl-left {
      background: linear-gradient(135deg, rgba(203, 213, 225, 0.75) 0%, rgba(250, 248, 243, 0.95) 48%, transparent 50%);
      transition: all 0.25s ease;
    }
    .corner-curl-left:hover {
      width: 44px;
      height: 44px;
      box-shadow: 3px 3px 8px rgba(15, 23, 42, 0.15);
    }

    /* Interactive Flip Cards on Page 24 */
    .quiz-card-inner {
      transition: transform 0.55s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
      position: relative;
    }
    .quiz-card.flipped .quiz-card-inner {
      transform: rotateY(180deg);
    }
    .quiz-face {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .quiz-back {
      transform: rotateY(180deg);
    }

    /* Clean Fraction Display */
    .math-frac {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      vertical-align: middle;
      margin: 0 3px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85em;
      line-height: 1.1;
    }
    .math-frac > span:first-child {
      border-bottom: 1.5px solid currentColor;
      padding: 0 3px 1px;
    }
    .math-frac > span:last-child {
      padding: 1px 3px 0;
    }
  </style>
</head>

    function flipToSpread(targetSpread) {
      targetSpread = Math.max(0, Math.min(SPREADS.length - 1, targetSpread));
      if (targetSpread === currentSpread || isFlipping) return;

      if (!isDesktop()) {
        renderMobilePageImmediate(targetSpread * 2);

      const goingForward = targetSpread > currentSpread;
      const fromSp = SPREADS[currentSpread];
      const toSp = SPREADS[targetSpread];

      if (goingForward) {
        // Front of turning leaf = current right page; Back of turning leaf = target left page

        flipNextBack.innerHTML = toSp.leftPage;
        // Underlying right slot immediately reveals target right page

        slotLeft.scrollTop = 0;

    function stepNext() {
      if (isDesktop()) {
        if (currentSpread < SPREADS.length - 1) flipToSpread(currentSpread + 1);
      } else {
        if (currentMobilePage < ALL_PAGES.length - 1) {
          slotMobile.style.opacity = '0.35';
          setTimeout(() => {
            renderMobilePageImmediate(currentMobilePage + 1);
            slotMobile.style.opacity = '1';
          }, 120);
        }
      }
    }

    function stepPrev() {
      if (isDesktop()) {
        if (currentSpread > 0) flipToSpread(currentSpread - 1);
      } else {
        if (currentMobilePage > 0) {
          slotMobile.style.opacity = '0.35';
          setTimeout(() => {
            renderMobilePageImmediate(currentMobilePage - 1);
            slotMobile.style.opacity = '1';
          }, 120);
        }
      }
    }

    // Global helper for clickable learning roadmap on Page 2
    window.jumpToSpread = function (idx) {
      closeTOC();
      if (isDesktop()) {
        flipToSpread(idx);
      } else {
        renderMobilePageImmediate(idx * 2);
      }
    };

    // =========================================================================
    // 3. HEADER, PROGRESS BAR & TOC SYNC
    // =========================================================================
    function buildProgressSegments() {
      const container = document.getElementById('progress-segments');
      container.innerHTML = SPREADS.map((sp, i) => `
        <button
          type="button"
          data-seg="${i}"
          title="跨頁 ${i + 1}：${sp.unit}｜${sp.title}"
          onclick="jumpToSpread(${i})"
          class="flex-1 h-full rounded-full transition-all duration-200 cursor-pointer bg-slate-700 hover:brightness-125"
        ></button>
      `).join('');
    }

    function buildTOC() {
      const tocList = document.getElementById('toc-list');
      tocList.innerHTML = SPREADS.map((sp, i) => {
        const pStart = String(i * 2 + 1).padStart(2, '0');
        const pEnd = String(i * 2 + 2).padStart(2, '0');
        return `
          <button type="button" onclick="jumpToSpread(${i})" class="text-left bg-white hover:bg-blue-50/70 border border-slate-200 hover:border-blue-400 rounded-xl p-3.5 shadow-xs transition flex items-start justify-between gap-3 cursor-pointer group">
            <div>
              <div class="flex items-center gap-2 mb-1">
                <span class="px-2 py-0.5 rounded text-[11px] font-bold text-white" style="background-color:${sp.unitColor}">${sp.unit}</span>
                <span class="text-[11px] font-mono-code text-slate-500">${sp.lectures}</span>
              </div>
              <div class="font-serif-tc font-bold text-sm sm:text-base text-slate-900 group-hover:text-blue-700 transition">
                ${sp.title}
              </div>
            </div>
            <span class="font-mono-code text-xs font-bold text-slate-400 group-hover:text-blue-600 shrink-0">
              P.${pStart}–${pEnd}
            </span>
          </button>
        `;
      }).join('');
    }

    function updateChromeUI() {
      const sp = SPREADS[currentSpread];
      document.getElementById('breadcrumb-dot').style.backgroundColor = sp.unitColor;
      document.getElementById('breadcrumb-text').textContent = `${sp.unit}｜${sp.title}`;
      document.getElementById('footer-unit-label').textContent = `${sp.unit} · ${sp.lectures}`;

      if (isDesktop()) {
        const p1 = String(currentSpread * 2 + 1).padStart(2, '0');
        const p2 = String(currentSpread * 2 + 2).padStart(2, '0');
        document.getElementById('footer-page-counter').textContent = `P. ${p1}–${p2} / 24`;
        btnPrev.disabled = currentSpread === 0;
        btnNext.disabled = currentSpread === SPREADS.length - 1;
        cornerPrev.style.display = currentSpread === 0 ? 'none' : '';
        cornerNext.style.display = currentSpread === SPREADS.length - 1 ? 'none' : '';
      } else {
        const p = String(currentMobilePage + 1).padStart(2, '0');
        document.getElementById('footer-page-counter').textContent = `P. ${p} / 24`;
        btnPrev.disabled = currentMobilePage === 0;
        btnNext.disabled = currentMobilePage === ALL_PAGES.length - 1;
      }

      // Highlight active progress segment
      document.querySelectorAll('#progress-segments button').forEach((btn, idx) => {
        if (idx === currentSpread) {
          btn.style.backgroundColor = sp.unitColor;
          btn.classList.add('scale-y-125', 'ring-1', 'ring-white/60');
        } else if (idx < currentSpread) {
          btn.style.backgroundColor = '#64748B';
          btn.classList.remove('scale-y-125', 'ring-1', 'ring-white/60');
        } else {
          btn.style.backgroundColor = '#334155';
          btn.classList.remove('scale-y-125', 'ring-1', 'ring-white/60');
        }
      });
    }

    // =========================================================================
    // 4. INTERACTIVE WIDGETS BINDING (STEREO LAB ON SPREAD 6)
    // =========================================================================
    function bindInteractiveWidgets() {
      const zSlider = document.getElementById('stereo-z-slider');
      const bSlider = document.getElementById('stereo-b-slider');
      if (!zSlider || !bSlider) return;

      const zValEl = document.getElementById('stereo-z-val');
      const bValEl = document.getElementById('stereo-b-val');
      const errValEl = document.getElementById('stereo-err-val');
      const verdictEl = document.getElementById('stereo-verdict');

      function updateStereoMath() {
        const Z = parseFloat(zSlider.value); // meters
        const B_cm = parseFloat(bSlider.value); // cm
        const B = B_cm / 100.0; // meters
        const f = 800; // focal length in px
        const deltaD = 0.5; // disparity noise in px

        // ΔZ = (Z^2 / (B * f)) * Δd (in meters)
        const deltaZ_m = ((Z * Z) / (B * f)) * deltaD;
        const deltaZ_cm = deltaZ_m * 100;

        zValEl.textContent = `${Z.toFixed(1)} m`;
        bValEl.textContent = `${B_cm} cm`;

        if (deltaZ_cm < 100) {
          errValEl.textContent = `± ${deltaZ_cm.toFixed(1)} cm`;
        } else {
          errValEl.textContent = `± ${(deltaZ_cm / 100).toFixed(2)} m`;
        }

        if (deltaZ_cm <= 2.5) {
          verdictEl.className = 'px-2.5 py-1 rounded bg-emerald-600/30 border border-emerald-400 text-emerald-200 text-[11px] font-bold text-right';
          verdictEl.textContent = '✅ 案頭抓取超精準！';
        } else if (deltaZ_cm <= 15) {
          verdictEl.className = 'px-2.5 py-1 rounded bg-amber-500/30 border border-amber-400 text-amber-200 text-[11px] font-bold text-right';
          verdictEl.textContent = '⚠️ 室內導航尚可';
        } else {
          verdictEl.className = 'px-2.5 py-1 rounded bg-rose-600/40 border border-rose-400 text-rose-200 text-[11px] font-bold text-right';
          verdictEl.textContent = '🚨 誤差過大！需靠 LiDAR';
        }
      }

      zSlider.addEventListener('input', updateStereoMath);
      bSlider.addEventListener('input', updateStereoMath);
      updateStereoMath();
    }

    // =========================================================================
    // 5. EVENT LISTENERS (BUTTONS, KEYBOARD, TOUCH SWIPE, FONT SIZE, TOC)
    // =========================================================================
    btnNext.addEventListener('click', stepNext);
    btnPrev.addEventListener('click', stepPrev);
    cornerNext.addEventListener('click', stepNext);
    cornerPrev.addEventListener('click', stepPrev);

    // Keyboard Arrow Keys
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') stepNext();
      if (e.key === 'ArrowLeft') stepPrev();
      if (e.key === 'Escape') closeTOC();
    });

    // Touch Swipe Support for Mobile/Tablet
    let touchStartX = 0;
    let touchStartY = 0;
    const bookContainer = document.getElementById('book-container');
    bookContainer.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    bookContainer.addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].screenX - touchStartX;
      const dy = e.changedTouches[0].screenY - touchStartY;
      // Trigger horizontal swipe only if clearly horizontal and not dragging a range slider
      if (e.target && e.target.tagName === 'INPUT') return;
      if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4) {
        if (dx < 0) stepNext();
        else stepPrev();
      }
    }, { passive: true });

    // Font Size Controls
    document.getElementById('btn-font-inc').addEventListener('click', () => {
      fontScale = Math.min(1.22, +(fontScale + 0.06).toFixed(2));
      document.documentElement.style.setProperty('--font-scale', fontScale);
    });
    document.getElementById('btn-font-dec').addEventListener('click', () => {
      fontScale = Math.max(0.88, +(fontScale - 0.06).toFixed(2));
      document.documentElement.style.setProperty('--font-scale', fontScale);
    });

    // TOC Modal Controls
    const tocModal = document.getElementById('toc-modal');
    function openTOC() {
      tocModal.classList.remove('hidden');
    }
    function closeTOC() {
      tocModal.classList.add('hidden');
    }
    document.getElementById('btn-toc').addEventListener('click', openTOC);
    document.getElementById('btn-close-toc').addEventListener('click', closeTOC);
    tocModal.addEventListener('click', (e) => {
      if (e.target === tocModal) closeTOC();
    });

    // Responsive Resize Sync
    window.addEventListener('resize', () => {
      updateChromeUI();
    });

    // Initialize Magazine on Load
    window.addEventListener('DOMContentLoaded', () => {
      buildProgressSegments();
      buildTOC();
      renderSpreadImmediate(0);
    });
  </script>
</body>
</html>
